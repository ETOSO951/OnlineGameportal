<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Air Hockey: Hyper Boost Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        :root { --main: #00ffcc; --bg: #050508; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: sans-serif; overflow: hidden; touch-action: none; text-align: center; }
        canvas { background: #111; border: 4px solid #444; display: block; margin: 0 auto; max-width: 100vw; max-height: 70vh; }
        .setup { padding: 40px 20px; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; box-sizing: border-box; }
        input { padding: 15px; width: 80%; border-radius: 10px; border: 1px solid #444; background: #111; color: #fff; font-size: 1.2rem; margin-bottom: 20px; text-align: center; }
        .btn { padding: 15px 30px; border-radius: 10px; border: none; background: #007bff; color: white; font-weight: bold; font-size: 1.1rem; cursor: pointer; width: 220px; margin: 8px; }
        #score-board { display: flex; justify-content: space-around; align-items: center; padding: 10px 0; background: #1a1a1a; border-bottom: 2px solid #333; }
        .score-num { font-size: 2.2rem; font-weight: bold; color: var(--main); }
        #status-msg { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 2.5rem; font-weight: bold; z-index: 100; pointer-events: none; display: none; text-shadow: 0 0 10px #000; }
        #debug-log { position: fixed; bottom: 0; width: 100%; font-size: 10px; color: #0f0; background: rgba(0,0,0,0.8); text-align: left; padding: 5px; pointer-events: none; z-index: 200; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="debug-log">Status: Waiting for input...</div>

    <div id="setup" class="setup">
        <h1 style="color:var(--main); letter-spacing: 4px;">AIR HOCKEY<br><small style="font-size:0.8rem">BOOST MODE</small></h1>
        <input type="text" id="room-id" placeholder="合言葉 (例: hockey123)">
        <div id="setup-btns">
            <button class="btn" onclick="initPeer(true)">1P (作成・親)</button>
            <button class="btn" onclick="initPeer(false)" style="background:#28a745;">2P (参加・子)</button>
        </div>
        <div id="wait-info" style="margin-top:20px; display:none;">
            <p style="color:var(--main); font-weight:bold;">通信中...</p>
            <p id="peer-id-display" style="font-size:0.8rem; color:#888;"></p>
            <button class="btn" onclick="location.reload()" style="background:#444; width:150px; font-size:0.8rem;">キャンセル</button>
        </div>
    </div>

    <div id="game-ui" class="hidden">
        <div id="score-board">
            <div><small>YOU</small><div id="opp-score" class="score-num">0</div></div>
            <div style="font-size:0.7rem; color:#888;">GOAL: 7<br>SCORE ON DEFENSE</div>
            <div><small>TEKI</small><div id="my-score" class="score-num">0</div></div>
        </div>
        <canvas id="gameCanvas"></canvas>
        <div id="status-msg"></div>
    </div>

<script>
let peer, conn, isHost = false;
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const statusMsg = document.getElementById('status-msg');

canvas.width = 320;
canvas.height = 480;
const paddleRad = 22;
const ballRad = 12;
const goalWidth = 160; 
const goalLeft = (320 - goalWidth) / 2;
const goalRight = goalLeft + goalWidth;

let myPos = { x: 160, y: 400 };
let oppPos = { x: 160, y: 80 };
let ball = { x: 160, y: 240, vx: 0, vy: 0 };
let myScore = 0, oppScore = 0;
let isGameOver = false;
let speedMultiplier = 1.0;

function log(m) {
    document.getElementById('debug-log').innerText = "Status: " + m;
    console.log(m);
}

function initPeer(host) {
    const rawId = document.getElementById('room-id').value;
    const rid = rawId.replace(/[^a-z0-9]/gi, '').toLowerCase();
    if(rid.length < 3) return alert("合言葉は3文字以上の英数字で！");

    isHost = host;
    document.getElementById('setup-btns').classList.add('hidden');
    document.getElementById('wait-info').style.display = 'block';
    log("Peerサーバーに接続中...");

    try {
        const myId = isHost ? rid : rid + "_gst_" + Math.floor(Math.random()*9999);
        peer = new Peer(myId);

        peer.on('open', (id) => {
            document.getElementById('peer-id-display').innerText = "Your ID: " + id;
            if(isHost) {
                log("1Pとして待機中... 2Pの接続を待っています");
                peer.on('connection', c => {
                    log("2Pが接続しました！");
                    conn = c;
                    setupCommunication();
                });
            } else {
                log("1P(" + rid + ")に接続を試みています...");
                conn = peer.connect(rid);
                conn.on('open', () => {
                    log("接続成功！ゲームを開始します");
                    setupCommunication();
                });
                
                setTimeout(() => {
                    if(!conn.open) {
                        log("接続タイムアウト");
                        alert("1Pが見つかりません。合言葉を確認してください。");
                        location.reload();
                    }
                }, 5000);
            }
        });

        peer.on('error', e => {
            log("エラー: " + e.type);
            if(e.type === 'unavailable-id' && isHost) {
                alert("その合言葉は既に使用されています。");
            } else {
                alert("通信エラー: " + e.type);
            }
            location.reload();
        });
    } catch(e) { log("例外: " + e.message); }
}

function setupCommunication() {
    document.getElementById('setup').classList.add('hidden');
    document.getElementById('game-ui').classList.remove('hidden');
    
    canvas.addEventListener('touchstart', e => e.preventDefault(), { passive: false });
    const moveHandler = e => {
        if(isGameOver) return;
        const rect = canvas.getBoundingClientRect();
        const touch = e.touches ? e.touches[0] : e;
        let tx = (touch.clientX - rect.left) * (canvas.width / rect.width);
        let ty = (touch.clientY - rect.top) * (canvas.height / rect.height);
        
        if(ty > canvas.height / 2 + paddleRad) {
            myPos.x = Math.max(paddleRad, Math.min(canvas.width - paddleRad, tx));
            myPos.y = Math.max(canvas.height / 2 + paddleRad, Math.min(canvas.height - paddleRad, ty));
        }
        sendData();
    };
    canvas.addEventListener('touchmove', moveHandler, { passive: false });
    canvas.addEventListener('mousemove', moveHandler);

    conn.on('data', data => {
        oppPos.x = canvas.width - data.myPos.x;
        oppPos.y = canvas.height - data.myPos.y;
        
        if(!isHost) {
            ball.x = canvas.width - data.ball.x;
            ball.y = canvas.height - data.ball.y;
            myScore = data.oppScore;
            oppScore = data.myScore;
            updateUI();
        }
    });

    conn.on('close', () => {
        alert("対戦相手との接続が切れました。");
        location.reload();
    });

    if(isHost) { 
        resetBall(); 
        gameLoop(); 
    } else { 
        drawLoop(); 
    }
}

function sendData() {
    if(conn && conn.open) conn.send({ myPos, ball, myScore, oppScore });
}

function gameLoop() {
    if(!isGameOver) {
        speedMultiplier += 0.0005;
        ball.x += ball.vx * speedMultiplier;
        ball.y += ball.vy * speedMultiplier;

        if(ball.x < ballRad || ball.x > canvas.width - ballRad) {
            ball.vx *= -1;
            ball.x = (ball.x < ballRad) ? ballRad : canvas.width - ballRad;
        }
        
        if(ball.y < -ballRad) {
            oppScore++;
            checkWinner();
            if(!isGameOver) resetBall();
        } else if(ball.y > canvas.height + ballRad) {
            myScore++;
            checkWinner();
            if(!isGameOver) resetBall();
        }

        checkCollision(myPos);
        checkCollision(oppPos);

        if((ball.y < ballRad && (ball.x < goalLeft || ball.x > goalRight)) || 
           (ball.y > canvas.height - ballRad && (ball.x < goalLeft || ball.x > goalRight))) {
            ball.vy *= -1;
            ball.y = (ball.y < ballRad) ? ballRad : canvas.height - ballRad;
        }
        updateUI(); // ホスト側もUI更新
    }
    sendData();
    draw();
    requestAnimationFrame(gameLoop);
}

function drawLoop() {
    draw();
    requestAnimationFrame(drawLoop);
}

function checkCollision(p) {
    const dx = ball.x - p.x;
    const dy = ball.y - p.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if(dist < paddleRad + ballRad) {
        let angle = Math.atan2(dy, dx);
        let currentSpeed = Math.sqrt(ball.vx**2 + ball.vy**2);
        let newSpeed = Math.min(currentSpeed + 0.8, 12);
        ball.vx = Math.cos(angle) * newSpeed;
        ball.vy = Math.sin(angle) * newSpeed;
        ball.x = p.x + Math.cos(angle) * (paddleRad + ballRad);
        ball.y = p.y + Math.sin(angle) * (paddleRad + ballRad);
    }
}

function resetBall() {
    speedMultiplier = 1.0;
    ball.x = 160; ball.y = 240;
    ball.vx = (Math.random() - 0.5) * 5;
    ball.vy = isHost ? -4 : 4;
    showStatus("READY", "#fff", 1000);
}

function checkWinner() {
    if(myScore >= 7) endGame("YOU LOSE...");
    else if(oppScore >= 7) endGame("YOU WIN!!");
}

function endGame(msg) {
    isGameOver = true;
    ball.vx = 0; ball.vy = 0;
    showStatus(msg, msg.includes("WIN") ? "#00ffcc" : "#ff4d4d", 5000);
    setTimeout(() => { location.reload(); }, 5000);
}

function showStatus(text, color, duration) {
    statusMsg.innerText = text;
    statusMsg.style.color = color;
    statusMsg.style.display = 'block';
    if(duration) setTimeout(() => { if(!isGameOver) statusMsg.style.display = 'none'; }, duration);
}

function updateUI() {
    document.getElementById('my-score').innerText = myScore;
    document.getElementById('opp-score').innerText = oppScore;
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = "#333";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, 240); ctx.lineTo(320, 240); ctx.stroke();
    ctx.beginPath(); ctx.arc(160, 240, 40, 0, Math.PI*2); ctx.stroke();
    
    ctx.strokeStyle = "#00ffcc";
    ctx.lineWidth = 4;
    ctx.strokeRect(goalLeft, -5, goalWidth, 10);
    ctx.strokeRect(goalLeft, 475, goalWidth, 10);

    ctx.fillStyle = "#ff4d4d";
    ctx.beginPath(); ctx.arc(oppPos.x, oppPos.y, paddleRad, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = "#fff"; ctx.stroke();

    ctx.fillStyle = "#007bff";
    ctx.beginPath(); ctx.arc(myPos.x, myPos.y, paddleRad, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = "#fff"; ctx.stroke();

    let bCol = Math.min(255, (speedMultiplier - 1) * 500);
    ctx.fillStyle = `rgb(255, ${255-bCol}, ${255-bCol})`;
    ctx.beginPath(); ctx.arc(ball.x, ball.y, ballRad, 0, Math.PI*2); ctx.fill();
    if(speedMultiplier > 1.2) {
        ctx.shadowBlur = 10; ctx.shadowColor = "#fff";
    } else { ctx.shadowBlur = 0; }
}
</script>
</body>
</html>

    /* 一人用モード共通HUDデザイン */
    .hud-val { font-size: 20px; font-weight: bold; color: #00f2ff; text-shadow: 0 0 8px #000; }
    .hud-sub { font-size: 11px; color: #aaa; }
    
    /* リザルト画面スタイル */
    #resultModal {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.88); display: none; flex-direction: column;
      justify-content: center; align-items: center; color: white; text-align: center; z-index: 50;

    .btn-action {
      padding: 12px 36px; background: #00f2ff; color: #000; font-weight: bold;
      border-radius: 30px; box-shadow: 0 0 18px #00f2ff; transition: 0.2s;
    }
    .btn-action:active { transform: scale(0.95); }

    @keyframes emoteFly {
      0% { transform: translateY(0) scale(0.6); opacity: 0; }
      25% { transform: translateY(-20px) scale(1.3); opacity: 1; }
      80% { transform: translateY(-70px) scale(1.1); opacity: 1; }
      100% { transform: translateY(-110px) scale(0.8); opacity: 0; }
    }

  <script>
    class SeaAudioEngine {
      constructor() { this.ctx = null; this.enabled = true; }
      init() {
        try {
          if (!this.ctx) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (AudioContext) this.ctx = new AudioContext();
          }
          if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
        } catch (e) {}
      }
      playCast() {
        if (!this.enabled || !this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(600, now);
          osc.frequency.exponentialRampToValueAtTime(200, now + 0.15);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
          osc.connect(gain); gain.connect(this.ctx.destination);
          osc.start(now); osc.stop(now + 0.15);
        } catch (e) {}
      }
      playCatch() {
        if (!this.enabled || !this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.1);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
          osc.connect(gain); gain.connect(this.ctx.destination);
          osc.start(now); osc.stop(now + 0.1);
        } catch (e) {}
      }
      playGold() {
        if (!this.enabled || !this.ctx) return;
        try {
          [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.05);
            gain.gain.setValueAtTime(0.2, this.ctx.currentTime + idx * 0.05);
            gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + idx * 0.05 + 0.15);
            osc.connect(gain); gain.connect(this.ctx.destination);
            osc.start(this.ctx.currentTime + idx * 0.05);
            osc.stop(this.ctx.currentTime + idx * 0.05 + 0.15);
          });
        } catch (e) {}
      }
      playBomb() {
        if (!this.enabled || !this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          const bufferSize = this.ctx.sampleRate * 0.4;
          const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
          const noise = this.ctx.createBufferSource();
          noise.buffer = buffer;
          const filter = this.ctx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(800, now);
          filter.frequency.linearRampToValueAtTime(50, now + 0.4);
          const gain = this.ctx.createGain();
          gain.gain.setValueAtTime(0.8, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
          noise.connect(filter); filter.connect(gain); gain.connect(this.ctx.destination);
          noise.start(now); noise.stop(now + 0.4);
        } catch (e) {}
      }
      playOver() {
        if (!this.enabled || !this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(300, now);
          osc.frequency.linearRampToValueAtTime(100, now + 0.5);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.5);
          osc.connect(gain); gain.connect(this.ctx.destination);
          osc.start(now); osc.stop(now + 0.5);
        } catch (e) {}
      }
    }
    const sound = new SeaAudioEngine();
  </script>

        connDot.className = "w-2 h-2 rounded-full bg-emerald-400";
        statusLabel.innerText = "ONLINE READY";
        statusLabel.className = "text-emerald-400 font-bold";
      } catch (err) {
        connDot.className = "w-2 h-2 rounded-full bg-amber-500";
        statusLabel.innerText = "OFFLINE (BOT MODE)";
        statusLabel.className = "text-amber-400 font-bold";
      }
    }

    function spawnFish() {
      if (gameOver) return;
      let t;
      const r = syncedRandom();

      if (selectedRule === 'bomb') {
        if (r < 0.45) t = types[5];
        else if (r < 0.55) t = types[3];
        else if (r < 0.70) t = types[4];
        else t = types[Math.floor(syncedRandom() * 3)];
      } else if (selectedRule === 'fever') {
        if (r < 0.50) t = types[3];
        else if (r < 0.85) t = types[4];
        else t = types[Math.floor(syncedRandom() * 3)];
      } else if (selectedRule === 'blind') {
        if (r < 0.35) t = types[5];
        else if (r < 0.50) t = types[3];
        else t = types[Math.floor(syncedRandom() * 3)];
      } else {
        if (r < 0.08) t = types[3];
        else if (r < 0.20) t = types[5];
        else if (r < 0.35) t = types[4];
        else t = types[Math.floor(syncedRandom() * 3)];
      }

      const dir = syncedRandom() > 0.5 ? 1 : -1;
      entities.push({
        id: Math.random().toString(36).substring(2, 9),
        x: dir === 1 ? -120 : canvas.width + 120,
        y: syncedRandom() * (canvas.height - 280) + 180,
        dir: dir,
        angle: 0,
        ...t
      });
    }

    function initEntities() {
      entities = [];
      particles = [];
      const initCount = selectedRule === 'fever' ? 8 : 5;
      for (let i = 0; i < initCount; i++) spawnFish();
    }

    function startCountdownAndPlay() {
      document.getElementById('waitingOverlay').classList.add('hidden');
      document.getElementById('lobbyScreen').classList.add('hidden');
      document.getElementById('roomModal').classList.add('hidden');
      document.getElementById('resultModal').style.display = 'none';

      const cdOverlay = document.getElementById('countdownOverlay');
      const cdText = document.getElementById('countdownText');
      cdOverlay.classList.remove('hidden');

      let count = 3;
      cdText.innerText = count;
      sound.playCatch();

      const timer = setInterval(() => {
        count--;
        if (count > 0) {
          cdText.innerText = count;
          sound.playCatch();
        } else if (count === 0) {
          cdText.innerText = "GO!";
          sound.playGold();
        } else {
          clearInterval(timer);
          cdOverlay.classList.add('hidden');
          executeGameStart();
        }
      }, 800);
    }

    function executeGameStart() {
      document.getElementById('lobbyScreen').classList.add('hidden');
      document.getElementById('roomModal').classList.add('hidden');
      document.getElementById('waitingOverlay').classList.add('hidden');
      document.getElementById('resultModal').style.display = 'none';

      isMatchStarted = true;
      timeLeft = 60;
      gameOver = false;
      lastFrameTime = performance.now();

      for (let i = 0; i < 4; i++) {
        hooks[i].active = false;
        hooks[i].y = -50;
        hooks[i].speed = selectedRule === 'fever' ? 1800 : 1250;
        playersData[i].score = 0;
        playersData[i].hp = 3;
        playersData[i].alive = true;
      }

      initEntities();
      setupHUDForPlayers();
      updateHUD();

      document.getElementById('battleHUD').classList.remove('hidden');
      document.getElementById('emoteBar').classList.remove('hidden');

      const modeBadge = document.getElementById('hudModeBadge');
      if (selectedRule === 'bomb') modeBadge.innerText = 'SURVIVAL';
      else if (selectedRule === 'fever') modeBadge.innerText = 'FEVER';
      else if (selectedRule === 'blind') modeBadge.innerText = 'BLIND';
      else modeBadge.innerText = 'STD';

      if (matchInterval) clearInterval(matchInterval);
      matchInterval = setInterval(() => {
        if (!gameOver) {
          timeLeft--;
          document.getElementById('hudTimer').innerText = timeLeft;

          const maxEntities = (selectedRule === 'fever' ? 12 : 7) + (timeLeft < 20 ? 3 : 0);
          if (entities.length < maxEntities && Math.random() > 0.3) spawnFish();

          // 強化されたBOTの射撃判断（針の重なり排他制御付き）
          if (isAIMode) {
            for (let i = 1; i < totalPlayers; i++) {
              if (playersData[i].alive && !hooks[i].active) {
                smartBotCast(i);
              }
            }
          }

          if (selectedRule === 'bomb' && (isAIMode || mySlot === 1)) {
            const aliveCount = playersData.slice(0, totalPlayers).filter(p => p.alive).length;
            if (aliveCount <= (totalPlayers > 1 ? 1 : 0)) {
              if (!isAIMode && currentRoomId && db) {
                updateDoc(doc(db, 'rooms', currentRoomId), { status: 'finished' }).catch(()=>{});
              } else {
                finishMatch();
              }
              return;
            }
          }

          if (timeLeft <= 0) {
            if (!isAIMode && currentRoomId && db && mySlot === 1) {
              updateDoc(doc(db, 'rooms', currentRoomId), { status: 'finished' }).catch(()=>{});
            } else if (isAIMode) {
              finishMatch();
            }
          }
        }
      }, 1000);
    }

    // ==========================================
    // 強化AI: 偏差射撃・ターゲット優先・重なり防止
    // ==========================================
    function smartBotCast(slotIndex) {
      if (Math.random() > 0.88) return;

      const candidates = entities.filter(e => {
        if (e.type === 'mine') return false;
        const nearMine = entities.some(m => m.type === 'mine' && Math.hypot(m.x - e.x, m.y - e.y) < 75);
        return !nearMine;
      });

      if (candidates.length === 0) return;

      // 価値の高い順（500点黄金魚 ＞ サメ ＞ その他）
      candidates.sort((a, b) => b.score - a.score);

      for (let target of candidates) {
        const reachTime = target.y / hooks[slotIndex].speed;
        const predictedX = target.x + (target.speed * target.dir * reachTime);

        if (predictedX < 40 || predictedX > canvas.width - 40) continue;

        // 他のフックと重なって貫通に見えるのを防止
        const isOverlapping = hooks.some((h, idx) => {
          return idx !== slotIndex && h.active && Math.abs(h.x - predictedX) < 60;
        });

        if (!isOverlapping) {
          hooks[slotIndex].x = predictedX;
          hooks[slotIndex].y = 0;
          hooks[slotIndex].active = true;
          break;
        }
      }
    }

    function startSoloBotMatch(playerCount) {
      sound.init();
      isAIMode = true;
      mySlot = 1;
      totalPlayers = playerCount;
      currentRoomId = null;
      randomSeed = Math.floor(Math.random() * 999999);

      playerNames[0] = myPlayerName;
      for (let i = 1; i < 4; i++) playerNames[i] = `BOT ${i + 1}`;

      startCountdownAndPlay();
    }

    function setupHUDForPlayers() {
      for (let i = 1; i <= 4; i++) {
        const hud = document.getElementById(`hudP${i}`);
        const hpElem = document.getElementById(`hpP${i}`);
        const label = document.getElementById(`labelP${i}`);

        if (i <= totalPlayers) {
          hud.classList.remove('hidden');
          label.innerText = playerNames[i - 1];
          if (selectedRule === 'bomb') hpElem.classList.remove('hidden');
          else hpElem.classList.add('hidden');
        } else {
          hud.classList.add('hidden');
        }
      }
    }

    function updateHUD() {
      for (let i = 0; i < totalPlayers; i++) {
        const slot = i + 1;
        const scoreElem = document.getElementById(`scoreP${slot}`);
        const hpElem = document.getElementById(`hpP${slot}`);
        const hud = document.getElementById(`hudP${slot}`);

        if (scoreElem) scoreElem.innerText = playersData[i].score;

        if (hpElem && selectedRule === 'bomb') {
          if (!playersData[i].alive) {
            hpElem.innerHTML = '<span class="text-rose-500 font-bold">DEAD</span>';
            if (hud) hud.style.opacity = '0.35';
          } else {
            hpElem.innerText = '❤️'.repeat(Math.max(0, playersData[i].hp)) + '🖤'.repeat(Math.max(0, 3 - playersData[i].hp));
            if (hud) hud.style.opacity = '1.0';
          }
        }
      }
    }

    function finishMatch() {
      if (gameOver) return;
      gameOver = true;
      isMatchStarted = false;
      clearInterval(matchInterval);
      hooks.forEach(h => h.active = false);
      sound.playOver();

      const leaderboard = [];
      for (let i = 0; i < totalPlayers; i++) {
        leaderboard.push({
          slot: i + 1,
          isMe: (i + 1) === mySlot,
          score: playersData[i].score,
          alive: playersData[i].alive,
          hp: playersData[i].hp,
          name: playerNames[i]
        });
      }

      if (selectedRule === 'bomb') {
        leaderboard.sort((a, b) => {
          if (a.alive !== b.alive) return a.alive ? -1 : 1;
          if (a.hp !== b.hp) return b.hp - a.hp;
          return b.score - a.score;
        });
      } else {
        leaderboard.sort((a, b) => b.score - a.score);
      }

      const boardContainer = document.getElementById('resLeaderboard');
      boardContainer.innerHTML = '';
      leaderboard.forEach((item, idx) => {
        const row = document.createElement('div');
        row.className = `flex items-center justify-between p-2 rounded-xl ${item.isMe ? 'bg-cyan-950/70 border border-cyan-400' : 'bg-slate-900 border border-slate-800'}`;
        row.innerHTML = `
          <div class="flex items-center gap-2">
            <span class="font-bold text-sm ${idx === 0 ? 'text-yellow-400' : 'text-slate-400'}">#${idx + 1}</span>
            <span class="text-xs font-bold truncate max-w-[120px]" style="color:${PLAYER_COLORS[item.slot - 1]}">${item.name}</span>
            ${!item.alive && selectedRule === 'bomb' ? '<span class="text-[9px] bg-rose-950 text-rose-400 px-1 py-0.5 rounded">DEAD</span>' : ''}
          </div>
          <div class="font-bold text-sm text-white">${item.score} pt</div>
        `;
        boardContainer.appendChild(row);
      });

      document.getElementById('resultModal').style.display = 'flex';
    }

    // 入力
    window.addEventListener('touchstart', (e) => {
      if (e.target.closest('#lobbyScreen') || e.target.closest('#roomModal') || e.target.closest('#resultModal') || e.target.closest('#waitingOverlay') || e.target.closest('#emoteBar')) {
        return;
      }
      if (gameOver || !isMatchStarted) return;

      const myHook = hooks[mySlot - 1];
      if (!playersData[mySlot - 1].alive) return;

      if (!myHook.active) {
        sound.init();
        const touchX = e.touches[0].clientX;
        myHook.x = touchX;
        myHook.y = 0;
        myHook.active = true;
        sound.playCast();

        syncMyHookOnline(touchX, true);
      }
    });

    async function syncMyHookOnline(posX, isActive) {
      if (isAIMode || !currentRoomId || !db) return;
      try {
        const roomRef = doc(db, 'rooms', currentRoomId);
        await updateDoc(roomRef, {
          [`hooks.p${mySlot}`]: { x: posX, active: isActive, t: Date.now() }
        });
      } catch (err) {}
    }

    async function syncMyStateOnline() {
      if (isAIMode || !currentRoomId || !db) return;
      try {
        const roomRef = doc(db, 'rooms', currentRoomId);
        await updateDoc(roomRef, {
          [`scores.p${mySlot}`]: playersData[mySlot - 1].score,
          [`hp.p${mySlot}`]: playersData[mySlot - 1].hp,
          [`alive.p${mySlot}`]: playersData[mySlot - 1].alive
        });
      } catch (err) {}
    }

    function listenToDuelRoom(roomId) {
      if (roomUnsubscribe) roomUnsubscribe();
      const roomRef = doc(db, 'rooms', roomId);

      roomUnsubscribe = onSnapshot(roomRef, (snapshot) => {
        if (!snapshot.exists()) {
          exitToLobby();
          return;
        }
        const data = snapshot.data();

        totalPlayers = data.capacity || 2;
        const currentCount = data.players ? data.players.length : 1;
        document.getElementById('waitingPlayerCount').innerText = `参加中: ${currentCount} / ${totalPlayers} 人`;

        if (data.names) {
          for (let i = 1; i <= totalPlayers; i++) {
            if (data.names[`p${i}`]) playerNames[i - 1] = data.names[`p${i}`];
          }
          setupHUDForPlayers();
        }

        if (data.status === 'playing' && !isMatchStarted) {
          selectedRule = data.rule || 'standard';
          randomSeed = data.seed || 12345;
          startCountdownAndPlay();
        }

        if (data.status === 'finished' && isMatchStarted) {
          finishMatch();
          return;
        }

        if (data.hooks && isMatchStarted) {
          for (let i = 1; i <= totalPlayers; i++) {
            if (i === mySlot) continue;
            const remoteHook = data.hooks[`p${i}`];
            if (remoteHook && remoteHook.t > (hooks[i - 1].lastT || 0)) {
              hooks[i - 1].lastT = remoteHook.t;
              if (remoteHook.active && !hooks[i - 1].active) {
                hooks[i - 1].x = remoteHook.x;
                hooks[i - 1].y = 0;
                hooks[i - 1].active = true;
                sound.playCast();
              }
            }
          }
        }

        if (data.scores && isMatchStarted) {
          for (let i = 1; i <= totalPlayers; i++) {
            if (i === mySlot) continue;
            if (typeof data.scores[`p${i}`] === 'number') playersData[i - 1].score = data.scores[`p${i}`];
          }
        }
        if (data.hp && isMatchStarted) {
          for (let i = 1; i <= totalPlayers; i++) {
            if (i === mySlot) continue;
            if (typeof data.hp[`p${i}`] === 'number') playersData[i - 1].hp = data.hp[`p${i}`];
            if (data.alive && typeof data.alive[`p${i}`] === 'boolean') playersData[i - 1].alive = data.alive[`p${i}`];
          }
        }
        if (isMatchStarted) updateHUD();
      }, (e) => {});
    }

    async function startQuickMatch() {

      showToast('ルーム作成中...');

    async function joinFriendRoom(code) {
      sound.init();
      if (!db || !currentUser) {
        showToast('サーバー未接続です');
        return;
      }
      const clean = code.trim();
      if (!clean) return;

      showToast('部屋を検索中...');
      try {
        const roomsRef = collection(db, 'rooms');
        const q = query(roomsRef, where('code', '==', clean), limit(1));
        const snap = await getDocs(q);

        if (snap.empty) {
          showToast('部屋が見つかりません');
          return;
        }

        const docSnap = snap.docs[0];
        const target = docSnap.data();
        const roomId = docSnap.id;

        const existingPlayers = target.players || [];
        existingPlayers.push(currentUser.uid);
        mySlot = existingPlayers.length;
        currentRoomId = roomId;
        isAIMode = false;
        totalPlayers = target.capacity || 2;
        selectedRule = target.rule || 'standard';

        const isFull = existingPlayers.length >= target.capacity;
        const roomRef = doc(db, 'rooms', roomId);

        await updateDoc(roomRef, {
          players: existingPlayers,
          [`names.p${mySlot}`]: myPlayerName,
          status: isFull ? 'playing' : 'waiting'
        });

        document.getElementById('roomModal').classList.add('hidden');

        if (!isFull) {
          document.getElementById('waitingRoomCodeBox').classList.remove('hidden');
          document.getElementById('waitingRoomCode').innerText = clean;
          document.getElementById('waitingOverlay').classList.remove('hidden');
        }

        listenToDuelRoom(roomId);
      } catch (e) {
        showToast('参加に失敗しました');
      }
    }

      document.getElementById('emoteBar').classList.add('hidden');

    // 描画関連
    function drawMine(e) {
      ctx.save(); ctx.translate(e.x, e.y); e.angle += 0.15; ctx.rotate(e.angle);
      ctx.fillStyle = "#222"; ctx.beginPath(); ctx.arc(0, 0, e.size, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = "#ff3300";
      for(let i=0; i<8; i++) {
        ctx.rotate(Math.PI/4); ctx.beginPath();
        ctx.moveTo(e.size, -5); ctx.lineTo(e.size+18, 0); ctx.lineTo(e.size, 5); ctx.fill();
      }
      ctx.restore();
    }

    function drawFish(e) {
      ctx.save(); ctx.translate(e.x, e.y); if(e.dir === -1) ctx.scale(-1, 1);
      e.angle += 0.25; ctx.fillStyle = e.color;
      ctx.beginPath(); ctx.ellipse(0, 0, e.size, e.size/1.7, 0, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-e.size, 0);
      ctx.lineTo(-e.size-18, -12 + Math.sin(e.angle)*12);
      ctx.lineTo(-e.size-18, 12 + Math.sin(e.angle)*12); ctx.fill();
      if (e.score === 500) { ctx.shadowBlur = 15; ctx.shadowColor = "gold"; }
      ctx.restore();
    }

    function drawHook(hookObj, playerIndex) {
      if (!hookObj.active) return;
      const color = PLAYER_COLORS[playerIndex];
      ctx.save(); ctx.lineWidth = 2.5; ctx.strokeStyle = color;
      ctx.beginPath(); ctx.moveTo(hookObj.x, 0); ctx.lineTo(hookObj.x, hookObj.y); ctx.stroke();
      ctx.fillStyle = color; ctx.beginPath(); ctx.arc(hookObj.x, hookObj.y, 6, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    // ゲーム更新ループ
    function gameLoop(now) {
      const dt = Math.min((now - lastFrameTime) / 1000, 0.1);
      lastFrameTime = now;

      let grd = ctx.createLinearGradient(0, 0, 0, canvas.height);
      if (selectedRule === 'blind') {
        grd.addColorStop(0, "#020617"); grd.addColorStop(1, "#010414");
      } else {
        grd.addColorStop(0, "#005c97"); grd.addColorStop(1, "#000428");
      }
      ctx.fillStyle = grd; ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (flash > 0) { ctx.fillStyle = `rgba(255,255,255,${flash})`; ctx.fillRect(0,0,canvas.width,canvas.height); flash *= 0.85; }
      if (shake > 0) { ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake); shake *= 0.9; }

      if (isMatchStarted) {
        // ★逆転要素：時間が進むにつれて最大2倍の不可視スコア倍率（全員一律）★
        // 開始時(60s)=1.0倍 〜 終了直前(0s)=2.0倍
        const timeProgress = Math.max(0, Math.min(1, (60 - timeLeft) / 60));
        const timeMultiplier = 1.0 + timeProgress;

        // 針の移動
        for (let p = 0; p < totalPlayers; p++) {
          const h = hooks[p];
          if (h.active) {
            h.y += h.speed * dt;
            drawHook(h, p);
            if (h.y > canvas.height) {
              h.active = false;
              if (p === mySlot - 1) syncMyHookOnline(h.x, false);
            }
          }
        }

        // 魚の移動と当たり判定
        for (let i = entities.length - 1; i >= 0; i--) {
          const e = entities[i];
          e.x += e.speed * e.dir * dt;

          if (e.type === 'mine') drawMine(e);
          else drawFish(e);

          let entityCaptured = false;

          for (let p = 0; p < totalPlayers; p++) {
            const h = hooks[p];
            if (h.active && Math.hypot(e.x - h.x, e.y - h.y) < e.size + 18) {
              let depthFactor = Math.pow((e.y / canvas.height), 2) * 4 + 0.1;
              if (selectedRule === 'fever') depthFactor *= 1.8;

              if (e.type === 'fish') {
                // 水深倍率に加えて不可視のタイムスコア倍率を適用
                const added = Math.floor(e.score * depthFactor * timeMultiplier);
                playersData[p].score += added;

                if (p === mySlot - 1) {
                  shake = 12 * depthFactor;
                  flash = 0.1 * depthFactor;
                  if (e.score === 500) sound.playGold();
                  else sound.playCatch();
                }
              } else { // 機雷
                playersData[p].score = Math.max(0, playersData[p].score - 300);
                if (selectedRule === 'bomb') {
                  playersData[p].hp = Math.max(0, playersData[p].hp - 1);
                  if (playersData[p].hp <= 0) {
                    playersData[p].alive = false;
                    h.active = false;
                    if (p === mySlot - 1) showToast("大破！ 脱落しました 💀");
                  }
                }
                if (p === mySlot - 1) {
                  flash = 0.9; shake = 50;
                  sound.playBomb();
                  if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
                }
              }

              updateHUD();
              if (p === mySlot - 1) {
                syncMyStateOnline();
                syncMyHookOnline(h.x, false);
              }

              let pCount = Math.floor(10 * depthFactor);
              for (let j = 0; j < pCount; j++) {
                particles.push({
                  x: e.x, y: e.y,
                  vx: (Math.random()-0.5)*15*depthFactor,
                  vy: (Math.random()-0.5)*15*depthFactor,
                  life: 1, c: e.color
                });
              }

              h.active = false;
              entities.splice(i, 1);
              spawnFish();
              entityCaptured = true;
              break;
            }
          }

          if (!entityCaptured && (e.x < -200 || e.x > canvas.width + 200)) {
            entities.splice(i, 1);
            spawnFish();
          }
        }

        // 暗闇ルール
        if (selectedRule === 'blind') {
          ctx.save();
          ctx.fillStyle = "rgba(0, 4, 18, 0.78)";
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.globalCompositeOperation = 'destination-out';
          for (let p = 0; p < totalPlayers; p++) {
            const h = hooks[p];
            if (h.active) {
              const rad = ctx.createRadialGradient(h.x, h.y, 15, h.x, h.y, 160);
              rad.addColorStop(0, "rgba(0,0,0,1)");
              rad.addColorStop(1, "rgba(0,0,0,0)");
              ctx.fillStyle = rad;
              ctx.beginPath(); ctx.arc(h.x, h.y, 160, 0, Math.PI * 2); ctx.fill();
            }
          }
          ctx.restore();
        }
      }

      // パーティクル描画
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx; p.y += p.vy; p.life -= 0.025;
        ctx.globalAlpha = p.life; ctx.fillStyle = p.c;
        ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, Math.PI * 2); ctx.fill();
        if (p.life <= 0) particles.splice(i, 1);
      }

      ctx.globalAlpha = 1; ctx.setTransform(1, 0, 0, 1, 0, 0);
      requestAnimationFrame(gameLoop);
    }

    // 初期化とバインド
    window.addEventListener('DOMContentLoaded', () => {
      const nameInput = document.getElementById('inputPlayerName');
      nameInput.value = myPlayerName;
      document.getElementById('btnSaveName').onclick = () => {
        const val = nameInput.value.trim();
        if (val) {
          myPlayerName = val;
          localStorage.setItem('deepSeaBattle_playerName', myPlayerName);
          showToast(`プレイヤー名を保存しました`);
        }
      };

      initFirebase();
      initEntities();
      requestAnimationFrame(gameLoop);

      // モード切替
      document.querySelectorAll('.rule-btn').forEach(btn => {
        btn.onclick = () => {
          document.querySelectorAll('.rule-btn').forEach(b => {
            b.className = 'rule-btn p-2 rounded-xl border border-slate-800 bg-slate-900/60 text-center transition';
            b.querySelector('div:last-child').className = 'text-[9px] font-bold text-slate-300';
          });
          btn.className = 'rule-btn p-2 rounded-xl border border-cyan-400 bg-cyan-950/40 text-center transition';
          btn.querySelector('div:last-child').className = 'text-[9px] font-bold text-cyan-300';
          selectedRule = btn.dataset.rule;
        };
      });

      // 人数選択
      document.querySelectorAll('.cap-btn').forEach(btn => {
        btn.onclick = () => {
          document.querySelectorAll('.cap-btn').forEach(b => {
            b.className = 'cap-btn py-1.5 rounded-xl border border-slate-700 bg-slate-950 text-xs text-slate-300';
          });
          btn.className = 'cap-btn py-1.5 rounded-xl border border-pink-500 bg-pink-950/40 text-xs text-pink-300 font-bold';
          currentCapacity = parseInt(btn.dataset.cap);
        };
      });

      document.getElementById('btnPracticeSolo2P').onclick = () => startSoloBotMatch(2);
      document.getElementById('btnPracticeSolo4P').onclick = () => startSoloBotMatch(4);
      document.getElementById('btnQuickMatch').onclick = startQuickMatch;

      document.getElementById('btnFriendMatch').onclick = () => {
        sound.init(); document.getElementById('roomModal').classList.remove('hidden');
      };
      document.getElementById('btnCloseRoomModal').onclick = () => {
        document.getElementById('roomModal').classList.add('hidden');
      };

      document.getElementById('btnCreateRoomSubmit').onclick = createFriendRoom;
      document.getElementById('btnJoinRoomSubmit').onclick = () => {
        const val = document.getElementById('inputRoomCode').value;
        joinFriendRoom(val);
      };

      document.getElementById('btnCancelWaiting').onclick = cancelWaiting;

      document.getElementById('btnExitLobby').onclick = exitToLobby;
      document.getElementById('btnRematch').onclick = () => {
        document.getElementById('resultModal').style.display = 'none';
        if (isAIMode) startSoloBotMatch(totalPlayers);
        else exitToLobby();
      };
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    
    <title>ONLINE GAME PORTAL</title>
    <style>
        :root {
            --bg-color: #0a0a0f;
            --panel-bg: rgba(20, 20, 35, 0.75);
            --neon-blue: #00fff0;
            --neon-pink: #f000ff;
            --neon-purple: #bd00ff;
            --neon-red: #ff3333; /* 追加：赤色用 */
            --text-main: #ffffff;
            --text-sub: #8a8a9e;
        }

        body {
            font-family: 'Segoe UI', Roboto, -apple-system, sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(0, 240, 255, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(255, 0, 127, 0.1) 0%, transparent 40%);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overscroll-behavior-y: contain;
            box-sizing: border-box;
        }

        /* 画面共通のフェードトランジション */
        .screen {
            position: absolute;
            width: 100%;
            max-width: 440px;
            height: 90vh;
            max-height: 760px;
            background: var(--panel-bg);
            padding: 32px 24px;
            border-radius: 28px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 1px 2px rgba(255, 255, 255, 0.1);
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            transition: opacity 0.5s ease, transform 0.5s ease, visibility 0.5s;
            
            -webkit-user-select: none;
            user-select: none;
        }

        /* 画面の非表示状態 */
        .hidden {
            opacity: 0;
            transform: scale(0.95);
            pointer-events: none;
            visibility: hidden;
        }

        /* --- 1. タイトル（スタート）画面 --- */
        #title-screen {
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .title-logo {
            font-size: 32px;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(45deg, var(--neon-blue), var(--neon-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
            margin-bottom: 8px;
        }

        .title-sub {
            font-size: 13px;
            color: var(--text-sub);
            letter-spacing: 4px;
            margin-bottom: 80px;
        }

        .start-btn {
            background: transparent;
            color: var(--neon-blue);
            border: 2px solid var(--neon-blue);
            padding: 16px 40px;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 2px;
            border-radius: 50px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
            animation: pulse 2s infinite;
        }

        .start-btn:active {
            background: var(--neon-blue);
            color: #000;
            box-shadow: 0 0 25px var(--neon-blue);
            transform: scale(0.95);
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 15px rgba(0, 240, 255, 0.2); }
            50% { box-shadow: 0 0 25px rgba(0, 240, 255, 0.6); }
            100% { box-shadow: 0 0 15px rgba(0, 240, 255, 0.2); }
        }

        /* --- 2. メイン（ポータル）画面 --- */
        #main-screen {
            justify-content: flex-start;
        }

        h1 {
            font-size: 24px;
            font-weight: 800;
            margin: 0 0 6px 0;
            text-align: left;
            background: linear-gradient(to right, #fff, var(--text-sub));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 13px;
            color: var(--text-sub);
            margin: 0 0 24px 0;
            text-align: left;
        }

        /* ゲームリストエリア */
        .game-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
            flex-grow: 1;
            overflow-y: auto;
            padding-right: 6px;
        }

        .game-list::-webkit-scrollbar {
            width: 4px;
        }
        .game-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        /* ゲーム起動・設定ボタン共通 */
        .game-btn {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 18px 20px;
            background: rgba(255, 255, 255, 0.03);
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: left;
            -webkit-tap-highlight-color: transparent;
        }

        .game-btn:active {
            background: rgba(0, 240, 255, 0.1);
            border-color: var(--neon-blue);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
            transform: translateX(4px);
        }

        .game-btn::after {
            content: "➔";
            color: var(--neon-blue);
            font-size: 14px;
            transition: transform 0.2s;
        }

        .game-btn.special {
            background: rgba(255, 0, 127, 0.05);
            border-color: rgba(255, 0, 127, 0.3);
            color: #ff80bf;
        }
        .game-btn.special::after { color: var(--neon-pink); }
        .game-btn.special:active {
            background: rgba(255, 0, 127, 0.15);
            border-color: var(--neon-pink);
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.2);
        }

        .game-btn.ura {
            background: rgba(189, 0, 255, 0.07);
            border-color: rgba(189, 0, 255, 0.4);
            color: #e5b3ff;
        }
        .game-btn.ura::after { color: var(--neon-purple); }
        .game-btn.ura:active {
            background: rgba(189, 0, 255, 0.2);
            border-color: var(--neon-purple);
            box-shadow: 0 0 15px rgba(189, 0, 255, 0.4);
        }

        /* 資料室用（水色） */
        .game-btn.manual-color {
            background: rgba(0, 240, 255, 0.05);
            border-color: rgba(0, 240, 255, 0.3);
            color: #80f5ff;
        }
        .game-btn.manual-color::after { color: var(--neon-blue); }
        .game-btn.manual-color:active {
            background: rgba(0, 240, 255, 0.15);
            border-color: var(--neon-blue);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
        }

        /* 四大試練・リミックス用（紫） */
        .game-btn.purple-color {
            background: rgba(189, 0, 255, 0.07);
            border-color: rgba(189, 0, 255, 0.4);
            color: #e5b3ff;
        }
        .game-btn.purple-color::after { color: var(--neon-purple); }
        .game-btn.purple-color:active {
            background: rgba(189, 0, 255, 0.2);
            border-color: var(--neon-purple);
            box-shadow: 0 0 15px rgba(189, 0, 255, 0.4);
        }

        /* クリアチェッカーもっと裏用（調節済み：より鮮やかなマゼンタ・ピンクグラデーション） */
        .game-btn.more-ura-color {
            background: linear-gradient(135deg, rgba(255, 0, 127, 0.12), rgba(189, 0, 255, 0.12));
            border-color: rgba(255, 0, 127, 0.5);
            color: #ffb3e6;
        }
        .game-btn.more-ura-color::after { color: var(--neon-pink); }
        .game-btn.more-ura-color:active {
            background: linear-gradient(135deg, rgba(255, 0, 127, 0.25), rgba(189, 0, 255, 0.25));
            border-color: var(--neon-pink);
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.4);
        }

        /* ワイヤレスイヤホン遅延設定用（赤色） */
        .game-btn.red-color {
            background: rgba(255, 51, 51, 0.07);
            border-color: rgba(255, 51, 51, 0.4);
            color: #ff9999;
        }
        .game-btn.red-color::after { color: var(--neon-red); }
        .game-btn.red-color:active {
            background: rgba(255, 51, 51, 0.2);
            border-color: var(--neon-red);
            box-shadow: 0 0 15px rgba(255, 51, 51, 0.4);
        }

        /* 設定画面へのボタン用デザイン */
        .game-btn.settings-trigger {
            background: rgba(0, 240, 255, 0.05);
            border-color: rgba(0, 240, 255, 0.3);
            color: var(--neon-blue);
        }
        .game-btn.settings-trigger::after {
            color: var(--neon-blue);
        }

        .no-game {
            font-size: 14px;
            color: var(--text-sub);
            padding: 40px 20px;
            line-height: 1.6;
            text-align: center;
            border: 1px dashed rgba(255, 255, 255, 0.1);
            border-radius: 16px;
        }

        /* --- 4. 設定画面 --- */
        #settings-screen {
            justify-content: flex-start;
        }

        .settings-container {
            flex-grow: 1;
            overflow-y: auto;
            padding-right: 4px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .setting-group {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 16px;
            border-radius: 14px;
        }

        .setting-label {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .setting-label span.value-disp {
            color: var(--neon-blue);
            font-family: monospace;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--neon-blue);
            cursor: pointer;
        }

        /* 並び順設定用リストのスタイル */
        .order-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 180px;
            overflow-y: auto;
            margin-top: 8px;
            padding-right: 4px;
        }
        .order-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
        }
        .order-btns {
            display: flex;
            gap: 4px;
        }
        .order-btn {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
        }
        .order-btn:active {
            background: var(--neon-blue);
            color: #000;
        }

        .setting-actions {
            margin-top: 20px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .action-btn {
            flex: 1;
            padding: 14px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            border: none;
            transition: 0.2s;
        }

        .btn-save {
            background: var(--neon-blue);
            color: #000;
        }
        .btn-save:active {
            opacity: 0.8;
            transform: scale(0.98);
        }

        .btn-back {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .btn-back:active {
            background: rgba(255, 255, 255, 0.1);
            transform: scale(0.98);
        }

        .btn-reset {
            background: rgba(255, 0, 127, 0.1);
            color: var(--neon-pink);
            border: 1px solid rgba(255, 0, 127, 0.3);
            width: 100%;
            margin-top: 4px;
        }
        .btn-reset:active {
            background: rgba(255, 0, 127, 0.2);
            transform: scale(0.98);
        }

        /* --- 5. 全画面ゲームプレイヤーエリア --- */
        #game-player-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000000;
            z-index: 99999;
            display: flex;
            flex-direction: column;
            overscroll-behavior: none !important;
        }

        #game-frame {
            width: 100%;
            height: 100%;
            border: none;
            background: #ffffff;
            -webkit-user-select: auto !important;
            user-select: auto !important;
            pointer-events: auto !important;
            touch-action: manipulation !important; 
        }

        .close-game-btn {
            position: fixed;
            z-index: 100000;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            border-radius: 50%;
            cursor: pointer;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: transform 0.2s ease, opacity 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .close-game-btn:active {
            transform: scale(0.9);
        }

        #game-player-screen.hidden {
            display: none !important;
        }
    </style>
</head>
<body>

<!-- タイトル画面 -->
<div id="title-screen" class="screen">
    <div class="title-logo">Online Game Portal</div>
    <div class="title-sub">NEXT GENERATION</div>
    <button class="start-btn" onclick="startGamePortal()">PRESS START</button>
</div>

<!-- メイン画面 -->
<div id="main-screen" class="screen hidden">
    <h1>MY GAME PORTAL</h1>
    <p class="subtitle">SELECT A MISSION TO LAUNCH</p>

    <!-- ゲームリストエリア -->
    <div id="game-list" class="game-list">
        <div class="no-game">LOADING DATA...</div>
    </div>
</div>

<!-- 設定画面 -->
<div id="settings-screen" class="screen hidden">
    <h1>SETTINGS</h1>
    <p class="subtitle">CUSTOMIZE APP & BUTTONS</p>

    <div class="settings-container">
        <!-- 透明度設定 -->
        <div class="setting-group">
            <div class="setting-label">
                透明度 (Opacity) <span id="val-opacity" class="value-disp">0.6</span>
            </div>
            <input type="range" id="range-opacity" min="0.1" max="1.0" step="0.05" value="0.6" oninput="updateSettingPreview()">
        </div>

        <!-- サイズ設定 -->
        <div class="setting-group">
            <div class="setting-label">
                サイズ (Size) <span id="val-size" class="value-disp">44px</span>
            </div>
            <input type="range" id="range-size" min="30" max="70" step="2" value="44" oninput="updateSettingPreview()">
        </div>

        <!-- 位置調整（上下） -->
        <div class="setting-group">
            <div class="setting-label">
                下からの距離 (Bottom) <span id="val-bottom" class="value-disp">24px</span>
            </div>
            <input type="range" id="range-bottom" min="10" max="800" step="2" value="24" oninput="updateSettingPreview()">
        </div>

        <!-- 位置調整（左右） -->
        <div class="setting-group">
            <div class="setting-label">
                左からの距離 (Left) <span id="val-left" class="value-disp">24px</span>
            </div>
            <input type="range" id="range-left" min="10" max="350" step="2" value="24" oninput="updateSettingPreview()">
        </div>

        <!-- 解放済みゲームの順序設定 -->
        <div class="setting-group">
            <div class="setting-label">
                ゲームの表示順序変更
            </div>
            <div style="font-size: 11px; color: var(--text-sub); margin-bottom: 4px;">リスト内の表示順を上下で入れ替えます</div>
            <div id="order-list-container" class="order-list">
                <!-- 動的に生成 -->
            </div>
        </div>

        <!-- プレビュー＆ボタンアクション -->
        <div class="setting-group" style="text-align: center; border-style: dashed;">
            <div style="font-size: 12px; color: var(--text-sub); margin-bottom: 8px;">戻るボタンプレビュー</div>
            <div style="position: relative; height: 80px; display: flex; align-items: center; justify-content: center;">
                <button id="preview-btn" class="close-game-btn" style="position: static;" onclick="void(0);">◀</button>
            </div>
        </div>

        <button class="action-btn btn-reset" onclick="resetSettingsToDefault()">設定を初期化する</button>

        <div class="setting-actions">
            <button class="action-btn btn-back" onclick="closeSettings()">キャンセル</button>
            <button class="action-btn btn-save" onclick="saveSettings()">保存する</button>
        </div>
    </div>
</div>

<!-- ゲームプレイヤー画面 -->
<div id="game-player-screen" class="hidden">
    <button id="active-close-btn" class="close-game-btn" onclick="closeGame()">◀</button>
    <iframe id="game-frame" src=""></iframe>
</div>

<script>
    window.addEventListener('touchstart', {}, { passive: true });

    document.getElementById('game-player-screen').addEventListener('contextmenu', function(e) {
        e.preventDefault();
    }, { passive: false });

    document.getElementById('game-player-screen').addEventListener('touchmove', function(e) {
        if (!e.target.classList.contains('close-game-btn')) {
            e.preventDefault();
        }
    }, { passive: false });

    // ゲームライブラリ
    const gameLibrary = {
        "arena_survival": "arena.io",
        "sakana_online": "魚オンライン",
        "hurappi_battle": "フラッピーバードバトル",
        "color_card_duel": "カラーカードデュエル",
        "neon_duel": "NEON DUEL",
        "denkiisu": "電気椅子ゲーム",
        "air_hocker": "エアホッケー",
        "game_fest": "GAME FEST 15",
        "jinrou": "人狼ゲーム系",
        "coinrush":"コインラッシュ",
        "rizumuex": "リズムキャッチャーEX",
        "Neon Architect - Refined Final": "Neon Architect - Refined Final",
        "hiragananarabe2": "ひらがなならべ2"
    };

    const defaultUnlockedIds = ["arena_survival", "sakana_online", "hurappi_battle", "color_card_duel", "neon_duel", "denkiisu","air_hocker","jinrou"];
    const storageKeyPrefix = "";
    const unlockedValue = "1";

    // --- 設定関連のデフォルト値＆管理 ---
    const defaultSettings = {
        opacity: 0.6,
        size: 44,
        bottom: 24,
        left: 24,
        gameOrder: []
    };

    function getAppSettings() {
        try {
            const saved = localStorage.getItem('launcher_settings');
            if (saved) {
                return { ...defaultSettings, ...JSON.parse(saved) };
            }
        } catch (e) {}
        return defaultSettings;
    }

    function applySettingsToButton(btnElem) {
        const s = getAppSettings();
        btnElem.style.opacity = s.opacity;
        btnElem.style.width = s.size + 'px';
        btnElem.style.height = s.size + 'px';
        btnElem.style.bottom = s.bottom + 'px';
        btnElem.style.left = s.left + 'px';
        btnElem.style.background = `rgba(20, 20, 35, ${Math.max(0.2, s.opacity)})`;
        btnElem.style.color = 'var(--neon-pink)';
        btnElem.style.border = '1px solid var(--neon-pink)';
        btnElem.style.boxShadow = '0 4px 15px rgba(255, 0, 127, 0.3)';
    }

    function getUnlockedGameIds() {
        let unlocked = [];
        for (const id of Object.keys(gameLibrary)) {
            if (id === "datamanagement") continue;
            const status = localStorage.getItem(storageKeyPrefix + id);
            if (defaultUnlockedIds.includes(id) || status === unlockedValue || status === "1" || status === "true") {
                unlocked.push(id);
            }
        }
        return unlocked;
    }

    function openSettings() {
        const s = getAppSettings();
        document.getElementById('range-opacity').value = s.opacity;
        document.getElementById('range-size').value = s.size;
        document.getElementById('range-bottom').value = s.bottom;
        document.getElementById('range-left').value = s.left;

        updateSettingPreview();
        buildOrderListUI();

        document.getElementById("main-screen").classList.add("hidden");
        document.getElementById("settings-screen").classList.remove("hidden");
    }

    function closeSettings() {
        document.getElementById("settings-screen").classList.add("hidden");
        document.getElementById("main-screen").classList.remove("hidden");
    }

    function updateSettingPreview() {
        const opacity = parseFloat(document.getElementById('range-opacity').value);
        const size = parseInt(document.getElementById('range-size').value);
        const bottom = parseInt(document.getElementById('range-bottom').value);
        const left = parseInt(document.getElementById('range-left').value);

        document.getElementById('val-opacity').innerText = opacity.toFixed(2);
        document.getElementById('val-size').innerText = size + 'px';
        document.getElementById('val-bottom').innerText = bottom + 'px';
        document.getElementById('val-left').innerText = left + 'px';

        const previewBtn = document.getElementById('preview-btn');
        previewBtn.style.opacity = opacity;
        previewBtn.style.width = size + 'px';
        previewBtn.style.height = size + 'px';
        previewBtn.style.background = `rgba(20, 20, 35, ${Math.max(0.2, opacity)})`;
        previewBtn.style.color = 'var(--neon-pink)';
        previewBtn.style.border = '1px solid var(--neon-pink)';
    }

    let currentEditingOrder = [];
    function buildOrderListUI() {
        const container = document.getElementById('order-list-container');
        container.innerHTML = "";

        const unlocked = getUnlockedGameIds();
        const s = getAppSettings();

        currentEditingOrder = [];
        if (s.gameOrder && Array.isArray(s.gameOrder)) {
            for (const id of s.gameOrder) {
                if (unlocked.includes(id)) {
                    currentEditingOrder.push(id);
                }
            }
        }
        for (const id of unlocked) {
            if (!currentEditingOrder.includes(id)) {
                currentEditingOrder.push(id);
            }
        }

        currentEditingOrder.forEach((id, index) => {
            const item = document.createElement('div');
            item.className = 'order-item';
            
            const nameSpan = document.createElement('span');
            nameSpan.innerText = gameLibrary[id] || id;
            item.appendChild(nameSpan);

            const btnDiv = document.createElement('div');
            btnDiv.className = 'order-btns';

            const upBtn = document.createElement('button');
            upBtn.className = 'order-btn';
            upBtn.innerText = '▲';
            upBtn.onclick = () => moveOrder(index, -1);
            if (index === 0) upBtn.style.opacity = '0.3';

            const downBtn = document.createElement('button');
            downBtn.className = 'order-btn';
            downBtn.innerText = '▼';
            downBtn.onclick = () => moveOrder(index, 1);
            if (index === currentEditingOrder.length - 1) downBtn.style.opacity = '0.3';

            btnDiv.appendChild(upBtn);
            btnDiv.appendChild(downBtn);
            item.appendChild(btnDiv);

            container.appendChild(item);
        });
    }

    function moveOrder(index, direction) {
        const newIndex = index + direction;
        if (newIndex < 0 || newIndex >= currentEditingOrder.length) return;
        
        const temp = currentEditingOrder[index];
        currentEditingOrder[index] = currentEditingOrder[newIndex];
        currentEditingOrder[newIndex] = temp;

        const container = document.getElementById('order-list-container');
        container.innerHTML = "";

        currentEditingOrder.forEach((id, idx) => {
            const item = document.createElement('div');
            item.className = 'order-item';
            
            const nameSpan = document.createElement('span');
            nameSpan.innerText = gameLibrary[id] || id;
            item.appendChild(nameSpan);

            const btnDiv = document.createElement('div');
            btnDiv.className = 'order-btns';

            const upBtn = document.createElement('button');
            upBtn.className = 'order-btn';
            upBtn.innerText = '▲';
            upBtn.onclick = () => moveOrder(idx, -1);
            if (idx === 0) upBtn.style.opacity = '0.3';

            const downBtn = document.createElement('button');
            downBtn.className = 'order-btn';
            downBtn.innerText = '▼';
            downBtn.onclick = () => moveOrder(idx, 1);
            if (idx === currentEditingOrder.length - 1) downBtn.style.opacity = '0.3';

            btnDiv.appendChild(upBtn);
            btnDiv.appendChild(downBtn);
            item.appendChild(btnDiv);

            container.appendChild(item);
        });
    }

    function saveSettings() {
        const current = getAppSettings();
        const newSettings = {
            ...current,
            opacity: parseFloat(document.getElementById('range-opacity').value),
            size: parseInt(document.getElementById('range-size').value),
            bottom: parseInt(document.getElementById('range-bottom').value),
            left: parseInt(document.getElementById('range-left').value),
            gameOrder: currentEditingOrder
        };

        localStorage.setItem('launcher_settings', JSON.stringify(newSettings));
        closeSettings();
        loadGames();
    }

    function resetSettingsToDefault() {
        if (confirm("設定をすべて初期状態に戻しますか？")) {
            localStorage.removeItem('launcher_settings');
            closeSettings();
            loadGames();
        }
    }

    function startGamePortal() {
        document.getElementById("title-screen").classList.add("hidden");
        document.getElementById("main-screen").classList.remove("hidden");
    }

    function createGameButton(id, displayName) {
        const button = document.createElement("button");
        button.className = "game-btn";
        button.innerText = displayName;
        
        // 各種専用色の割り当て
        if (id === "ClearCheckerUra") {
            button.classList.add("ura");
        } else if (id === "clear_checker" || id === "datamanagement") {
            button.classList.add("special");
        } else if (id === "manual") {
            button.classList.add("manual-color");
        } else if (id === "yondaisiren" || id === "remix") {
            button.classList.add("purple-color");
        } else if (id === "ClearCheckerMoreUra") {
            button.classList.add("manual-color"); // 調節後のマゼンタ/ピンク系グラデーション
        } else if (id === "motokarateka") {
            button.classList.add("special"); // 追加：ワイヤレスイヤホン遅延設定を赤色に
        }

        button.onclick = () => {
            const gameUrl = encodeURIComponent(id) + ".html";
            const frame = document.getElementById("game-frame");
            frame.src = gameUrl;
            
            const activeCloseBtn = document.getElementById("active-close-btn");
            applySettingsToButton(activeCloseBtn);

            document.getElementById("game-player-screen").classList.remove("hidden");
        };

        return button;
    }

    function closeGame() {
        document.getElementById("game-player-screen").classList.add("hidden");
        document.getElementById("game-frame").src = "";
        loadGames();
    }

    function loadGames() {
        const listContainer = document.getElementById("game-list");
        listContainer.innerHTML = "";

        const s = getAppSettings();
        let unlockedIds = getUnlockedGameIds();

        if (s.gameOrder && Array.isArray(s.gameOrder) && s.gameOrder.length > 0) {
            unlockedIds.sort((a, b) => {
                let idxA = s.gameOrder.indexOf(a);
                let idxB = s.gameOrder.indexOf(b);
                if (idxA === -1) idxA = 999;
                if (idxB === -1) idxB = 999;
                return idxA - idxB;
            });
        }

        let hasGames = false;

        for (const id of unlockedIds) {
            const displayName = gameLibrary[id];
            if (displayName) {
                const button = createGameButton(id, displayName);
                listContainer.appendChild(button);
                hasGames = true;
            }
        }

        const settingsButton = document.createElement("button");
        settingsButton.className = "game-btn settings-trigger special";
        settingsButton.innerText = "設定";
        settingsButton.onclick = openSettings;
        listContainer.appendChild(settingsButton);

        let dataManagementButton = null;
        const dmStatus = localStorage.getItem(storageKeyPrefix + "datamanagement");
        if (defaultUnlockedIds.includes("datamanagement") || dmStatus === unlockedValue || dmStatus === "1" || dmStatus === "true") {
            dataManagementButton = createGameButton("datamanagement", gameLibrary["datamanagement"]);
        }

        if (dataManagementButton) {
            listContainer.appendChild(dataManagementButton);
        }

        if (!hasGames && !dataManagementButton) {
            listContainer.innerHTML = '<div class="no-game">解放されているゲームがありません。<br><span style="font-size:11px; color:#666;">（テスト用にストレージデータを保存してください）</span></div>';
        }
    }

    window.onload = loadGames;
</script>

</body>
</html>

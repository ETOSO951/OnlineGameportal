<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Arena.io - スマホマルチプレイバトル</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- WebRTC PeerJS CDN -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

  <style>
    * {
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      box-sizing: border-box;
      touch-action: none;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #050811;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    @keyframes pulseGlow {
      0%, 100% { filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.6)); }
      50% { filter: drop-shadow(0 0 20px rgba(168, 85, 247, 0.9)); }
    }
    .neon-box {
      animation: pulseGlow 3s infinite alternate;
    }
  </style>
</head>
<body class="relative bg-slate-950 text-white">

  <!-- ゲーム描画キャンバス -->
  <canvas id="gameCanvas"></canvas>

  <!-- 画面上部/全般 HUD -->
  <div id="gameHud" class="pointer-events-none absolute inset-0 hidden flex flex-col justify-between p-2.5 sm:p-4 select-none">
    
    <!-- トップバー: ステータス、通信ステータス、ランキング -->
    <div class="flex justify-between items-start w-full">
      <!-- 左上: プレイヤーHP・EXP・レベル -->
      <div class="flex flex-col gap-1 w-36 sm:w-56">
        <div class="flex items-center gap-1.5">
          <span id="hudName" class="font-bold text-xs sm:text-sm drop-shadow tracking-wide truncate max-w-[100px]">Player</span>
          <span id="hudClass" class="text-[9px] sm:text-[10px] bg-indigo-600/80 px-1.5 py-0.5 rounded-full border border-indigo-400 font-semibold uppercase">Gunner</span>
        </div>

        <!-- HPバー -->
        <div class="relative w-full h-3 bg-slate-900/90 rounded-full border border-slate-700 overflow-hidden shadow">
          <div id="hudHpFill" class="h-full bg-gradient-to-r from-emerald-500 to-green-400 w-full transition-all duration-100"></div>
          <span id="hudHpText" class="absolute inset-0 flex items-center justify-center text-[8px] font-black text-white drop-shadow">100 / 100</span>
        </div>

        <!-- ブーストバー -->
        <div class="relative w-full h-1.5 bg-slate-900/90 rounded-full border border-slate-700 overflow-hidden shadow">
          <div id="hudBoostFill" class="h-full bg-gradient-to-r from-amber-500 to-yellow-300 w-full transition-all duration-75"></div>
        </div>

        <!-- EXPバー -->
        <div class="relative w-full h-1.5 bg-slate-900/90 rounded-full border border-slate-700 overflow-hidden shadow">
          <div id="hudExpFill" class="h-full bg-gradient-to-r from-cyan-500 to-blue-500 w-0 transition-all duration-100"></div>
        </div>
        <div class="flex justify-between text-[9px] text-slate-300 font-mono">
          <span id="hudLevel">Lv.1</span>
          <span id="hudKills">撃破: 0</span>
        </div>
      </div>

      <!-- 中央上部: 通信状況インジケーター & キルログ -->
      <div class="flex flex-col items-center gap-1.5">
        <!-- ネットワーク状態バッジ (スマホ同士が繋がっているか即確認可能) -->
        <div class="bg-slate-900/90 backdrop-blur-md px-2.5 py-1 rounded-full border border-slate-700 shadow-md flex items-center gap-2 text-[10px] pointer-events-auto">
          <div class="flex items-center gap-1">
            <span id="netStatusDot" class="w-2 h-2 rounded-full bg-amber-400 animate-ping"></span>
            <span id="netStatusText" class="font-bold text-amber-300 font-mono">接続待機</span>
          </div>
          <span class="text-slate-500">|</span>
          <div class="text-slate-300 font-mono">
            <i class="fa-solid fa-users text-cyan-400 mr-1"></i><span id="netPlayerCount" class="font-bold text-white">1</span>人
          </div>
          <span class="text-slate-500">|</span>
          <div class="text-slate-300 font-mono">
            <span id="netPing">--</span>ms
          </div>
        </div>

        <!-- キルログ表示エリア -->
        <div id="killFeed" class="flex flex-col items-center gap-1 max-w-[220px] text-center text-[10px] font-medium text-slate-300 pointer-events-none"></div>
      </div>

      <!-- 右上: ランキングとレーダー -->
      <div class="flex flex-col items-end gap-1.5">
        <div class="bg-slate-900/80 backdrop-blur-md rounded-xl p-1.5 border border-slate-800 text-[10px] shadow-lg w-28 sm:w-36 pointer-events-auto">
          <div class="font-bold border-b border-slate-700/80 pb-0.5 text-slate-400 flex items-center justify-between text-[9px]">
            <span><i class="fa-solid fa-trophy text-amber-400 mr-1"></i>順位</span>
            <span id="roomCodeBadge" class="bg-indigo-950 text-indigo-300 px-1 rounded text-[8px] font-mono">ROOM</span>
          </div>
          <ol id="leaderboardList" class="mt-1 space-y-0.5 text-slate-200"></ol>
        </div>

        <!-- ミニマップ -->
        <div class="relative w-16 h-16 sm:w-20 sm:h-20 bg-slate-900/90 rounded-lg border border-slate-700 overflow-hidden shadow">
          <canvas id="miniMapCanvas" class="w-full h-full block"></canvas>
        </div>
      </div>
    </div>

    <!-- 画面中央: アナウンス (レベルアップ等) -->
    <div id="centerAlert" class="self-center text-center opacity-0 transition-opacity duration-300 pointer-events-none">
      <div id="centerAlertText" class="text-2xl font-black text-amber-300 drop-shadow-[0_2px_12px_rgba(251,191,36,0.9)]">LEVEL UP!</div>
    </div>

    <!-- 画面下部: スマホ用バーチャルパッド & ボタン -->
    <div class="flex justify-between items-end w-full pb-1 sm:pb-3 px-1">
      <!-- バーチャルジョイスティック -->
      <div id="joystickZone" class="relative w-32 h-32 sm:w-36 sm:h-36 rounded-full border border-dashed border-cyan-400/30 bg-slate-900/40 backdrop-blur-sm pointer-events-auto flex items-center justify-center shadow-lg">
        <div id="joystickKnob" class="absolute w-12 h-12 rounded-full bg-cyan-400 shadow-[0_0_15px_rgba(6,182,212,0.8)] border-2 border-white pointer-events-none transform -translate-x-1/2 -translate-y-1/2 left-1/2 top-1/2"></div>
      </div>

      <!-- 右側ボタン群 -->
      <div class="flex flex-col items-end gap-2 pointer-events-auto">
        <!-- 定型文エモート -->
        <div class="flex gap-1.5">
          <button data-emote="⚔️ 突撃!" class="emote-btn px-2 py-1 rounded-full bg-slate-900/80 border border-slate-700 text-[10px] active:scale-90 text-amber-200 shadow">⚔️突撃</button>
          <button data-emote="🆘 救援!" class="emote-btn px-2 py-1 rounded-full bg-slate-900/80 border border-slate-700 text-[10px] active:scale-90 text-rose-300 shadow">🆘救援</button>
          <button data-emote="🤝 同盟?" class="emote-btn px-2 py-1 rounded-full bg-slate-900/80 border border-slate-700 text-[10px] active:scale-90 text-emerald-300 shadow">🤝同盟</button>
          <button data-emote="✨ ナイス!" class="emote-btn px-2 py-1 rounded-full bg-slate-900/80 border border-slate-700 text-[10px] active:scale-90 text-cyan-200 shadow">✨ナイス</button>
        </div>

        <div class="flex items-center gap-3">
          <!-- ダッシュボタン -->
          <button id="btnDash" class="w-14 h-14 sm:w-16 sm:h-16 rounded-full bg-amber-600 active:bg-amber-500 border-2 border-amber-300 shadow-[0_0_15px_rgba(245,158,11,0.5)] flex flex-col items-center justify-center active:scale-90 transition-transform">
            <i class="fa-solid fa-bolt text-lg text-white"></i>
            <span class="text-[8px] font-bold text-amber-100">DASH</span>
          </button>

          <!-- 攻撃/発射ボタン -->
          <button id="btnAttack" class="w-18 h-18 sm:w-20 sm:h-20 rounded-full bg-gradient-to-br from-rose-600 to-red-500 active:from-rose-500 active:to-red-400 border-2 border-rose-300 shadow-[0_0_20px_rgba(244,63,94,0.7)] flex flex-col items-center justify-center active:scale-90 transition-transform p-3">
            <i class="fa-solid fa-crosshairs text-2xl text-white"></i>
            <span class="text-[9px] font-black text-rose-100">FIRE</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- 参加ロビー画面 -->
  <div id="lobbyScreen" class="absolute inset-0 bg-slate-950/95 backdrop-blur-md flex items-center justify-center p-4 z-40 overflow-y-auto">
    <div class="w-full max-w-sm bg-slate-900/90 border border-slate-800 p-5 rounded-3xl shadow-2xl neon-box flex flex-col gap-3.5 my-auto">
      <div class="text-center">
        <h1 class="text-2xl sm:text-3xl font-black italic bg-gradient-to-r from-cyan-400 via-indigo-400 to-pink-500 bg-clip-text text-transparent">
          ARENA.IO ONLINE
        </h1>
        <p class="text-[11px] text-slate-400 mt-0.5">身内10人でリアルタイム対戦 & 協力</p>
      </div>

      <!-- プレイヤー名 -->
      <div>
        <label class="text-[11px] font-semibold text-slate-300 mb-1 block">プレイヤー名</label>
        <input id="inputNickname" type="text" maxlength="10" placeholder="名前を入力 (例: たろう)" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-cyan-400">
      </div>

      <!-- ルームID (合言葉) -->
      <div>
        <label class="text-[11px] font-semibold text-slate-300 mb-1 flex justify-between">
          <span>ルームID (合言葉)</span>
          <span class="text-[9px] text-cyan-400">同じ文字で同じ部屋に合流!</span>
        </label>
        <input id="inputRoom" type="text" maxlength="10" value="ARENA10" placeholder="例: ARENA10" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white font-mono uppercase focus:outline-none focus:border-cyan-400">
      </div>

      <!-- チーム選択 -->
      <div>
        <label class="text-[11px] font-semibold text-slate-300 mb-1 block">チーム選択</label>
        <div class="grid grid-cols-3 gap-2" id="teamSelector">
          <button type="button" data-team="solo" class="team-btn py-1.5 px-1 rounded-xl border border-cyan-500/50 bg-cyan-950/40 text-cyan-300 text-xs font-bold text-center ring-2 ring-cyan-400">
            👑 バトロワ
          </button>
          <button type="button" data-team="red" class="team-btn py-1.5 px-1 rounded-xl border border-rose-500/30 bg-rose-950/20 text-rose-300 text-xs font-bold text-center">
            🔴 赤チーム
          </button>
          <button type="button" data-team="blue" class="team-btn py-1.5 px-1 rounded-xl border border-blue-500/30 bg-blue-950/20 text-blue-300 text-xs font-bold text-center">
            🔵 青チーム
          </button>
        </div>
      </div>

      <!-- クラス選択 -->
      <div>
        <label class="text-[11px] font-semibold text-slate-300 mb-1 block">兵種タイプ</label>
        <div class="grid grid-cols-3 gap-2" id="classSelector">
          <button type="button" data-class="gunner" class="class-btn py-2 px-1 rounded-xl border border-indigo-500 bg-indigo-950/40 text-indigo-300 text-xs font-bold flex flex-col items-center ring-2 ring-indigo-400">
            <i class="fa-solid fa-crosshairs mb-0.5"></i>
            <span>ガンナー</span>
            <span class="text-[8px] text-slate-400">標準連射</span>
          </button>
          <button type="button" data-class="shotgun" class="class-btn py-2 px-1 rounded-xl border border-slate-700 bg-slate-800/40 text-slate-300 text-xs font-bold flex flex-col items-center">
            <i class="fa-solid fa-burst mb-0.5"></i>
            <span>ショットガン</span>
            <span class="text-[8px] text-slate-400">近接3連</span>
          </button>
          <button type="button" data-class="sniper" class="class-btn py-2 px-1 rounded-xl border border-slate-700 bg-slate-800/40 text-slate-300 text-xs font-bold flex flex-col items-center">
            <i class="fa-solid fa-bullseye mb-0.5"></i>
            <span>スナイパー</span>
            <span class="text-[8px] text-slate-400">長射程高威力</span>
          </button>
        </div>
      </div>

      <!-- 接続ボタン -->
      <button id="btnJoin" class="w-full py-3 bg-gradient-to-r from-cyan-500 via-indigo-500 to-pink-500 rounded-xl font-black text-sm tracking-wider shadow-lg active:scale-95 transition">
        アリーナに接続する
      </button>

      <!-- 接続状況ログ -->
      <div id="lobbyNetLog" class="text-[10px] text-center text-slate-400 font-mono">ルーム合言葉を入力して参戦</div>
    </div>
  </div>

  <!-- リスポーンモーダル -->
  <div id="deathModal" class="absolute inset-0 bg-red-950/80 backdrop-blur-md hidden flex flex-col items-center justify-center p-4 z-50">
    <div class="w-full max-w-xs bg-slate-900/90 border border-red-500/50 p-5 rounded-3xl text-center shadow-2xl flex flex-col items-center gap-2.5">
      <div class="text-3xl text-rose-500 animate-bounce">
        <i class="fa-solid fa-skull"></i>
      </div>
      <h2 class="text-xl font-black text-rose-400">撃破されました！</h2>
      <p id="deathMessage" class="text-[11px] text-slate-300">敵の弾幕に倒れた！</p>
      
      <div class="bg-slate-800/80 rounded-xl p-2.5 w-full text-left text-[11px] space-y-1">
        <div class="flex justify-between text-slate-400"><span>獲得スコア:</span><span id="finalScore" class="font-bold text-cyan-400">0</span></div>
        <div class="flex justify-between text-slate-400"><span>撃破数:</span><span id="finalKills" class="font-bold text-amber-400">0</span></div>
      </div>

      <button id="btnRespawn" class="w-full py-2.5 bg-gradient-to-r from-emerald-500 to-teal-600 rounded-xl font-black text-xs tracking-wider active:scale-95 transition">
        今すぐ復活 (リスポーン)
      </button>
    </div>
  </div>

  <script>
    /* =========================================================
       1. WEB AUDIO サウンドエンジン
       ========================================================= */
    class SoundFX {
      constructor() {
        this.ctx = null;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      playShoot(freq = 550) {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(freq, now);
        osc.frequency.exponentialRampToValueAtTime(70, now + 0.1);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.1);
      }
      playHit() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(200, now);
        osc.frequency.linearRampToValueAtTime(90, now + 0.08);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.08);
      }
      playGem() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(800, now);
        osc.frequency.exponentialRampToValueAtTime(1400, now + 0.08);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.08);
      }
      playDash() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(260, now);
        osc.frequency.linearRampToValueAtTime(600, now + 0.12);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.12);
      }
      playExplode() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(130, now);
        osc.frequency.exponentialRampToValueAtTime(30, now + 0.3);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.3);
      }
    }
    const sound = new SoundFX();

    /* =========================================================
       2. ワールド設定とプレイヤーステータス
       ========================================================= */
    const WORLD_WIDTH = 2500;
    const WORLD_HEIGHT = 2500;
    const GEMS_COUNT = 150;

    const CLASS_CONFIG = {
      gunner: { name: 'ガンナー', reload: 180, speed: 4.8, bulletSpeed: 14, bulletDmg: 20, bulletSize: 6, maxHp: 110, count: 1, spread: 0 },
      shotgun: { name: 'ショットガン', reload: 450, speed: 4.5, bulletSpeed: 12, bulletDmg: 15, bulletSize: 5, maxHp: 130, count: 3, spread: 0.3 },
      sniper: { name: 'スナイパー', reload: 650, speed: 4.3, bulletSpeed: 22, bulletDmg: 60, bulletSize: 7, maxHp: 90, count: 1, spread: 0.02 }
    };

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const miniCanvas = document.getElementById('miniMapCanvas');
    const miniCtx = miniCanvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      miniCanvas.width = miniCanvas.parentElement.clientWidth;
      miniCanvas.height = miniCanvas.parentElement.clientHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // 自プレイヤー
    const myId = 'p_' + Math.random().toString(36).substr(2, 7);
    let myPlayer = {
      id: myId,
      name: 'Player',
      team: 'solo',
      classType: 'gunner',
      x: WORLD_WIDTH / 2 + (Math.random() - 0.5) * 400,
      y: WORLD_HEIGHT / 2 + (Math.random() - 0.5) * 400,
      angle: 0,
      vx: 0,
      vy: 0,
      hp: 110,
      maxHp: 110,
      stamina: 100,
      score: 0,
      kills: 0,
      level: 1,
      exp: 0,
      nextExp: 50,
      radius: 23,
      isAlive: true,
      isDashing: false,
      lastShootTime: 0,
      emote: null,
      emoteTimer: 0
    };

    // リモートプレイヤーマップ (Key: peerId or playerId)
    const remotePlayers = new Map();
    // 弾丸リスト
    let bullets = [];
    // オーブ
    let gems = [];
    // パーティクル & エフェクト
    let particles = [];
    let popups = [];
    // 障害物
    const obstacles = [
      { x: 700, y: 700, r: 85 }, { x: 1800, y: 700, r: 85 },
      { x: 700, y: 1800, r: 85 }, { x: 1800, y: 1800, r: 85 },
      { x: 1250, y: 750, r: 65 }, { x: 1250, y: 1750, r: 65 },
      { x: 750, y: 1250, r: 65 }, { x: 1750, y: 1250, r: 65 }
    ];

    /* =========================================================
       3. WebRTC (PeerJS) リアルタイムP2P通信システム
       - 部屋ID (合言葉) ごとにホスト・クライアントでメッシュ接続
       - 10人規模のスマホで即座にデータチャネル通信
       ========================================================= */
    let peer = null;
    let isHost = false;
    let hostConn = null; // クライアント時のホスト宛てコネクション
    const peerConnections = new Map(); // ホスト時の全クライアント宛て
    let roomCode = 'ARENA10';
    let lastPingSend = 0;
    let currentPing = 0;

    function getHostPeerId(roomId) {
      return `arena_io_room_${roomId.toLowerCase().trim()}_host`;
    }

    function initNetwork(roomId) {
      roomCode = roomId;
      const hostId = getHostPeerId(roomCode);
      const logEl = document.getElementById('lobbyNetLog');
      logEl.textContent = `ルーム [${roomCode}] へ接続確認中...`;

      // まず自身がホストとしてID取得を試みる
      peer = new Peer(hostId, {
        debug: 1,
        config: {
          iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' }
          ]
        }
      });

      peer.on('open', (id) => {
        isHost = true;
        logEl.textContent = `ホストとしてルーム作成成功! 参加者を待機中...`;
        updateNetStatusUI(true, 1);
        setupHostHandlers();
        initGems();
      });

      peer.on('error', (err) => {
        // ホストIDが既に使われている場合は参加者 (Client) として接続
        if (err.type === 'unavailable-id') {
          peer.destroy();
          connectAsClient(hostId);
        } else {
          logEl.textContent = `接続エラー: ${err.type}。再試行してください`;
        }
      });
    }

    function connectAsClient(hostId) {
      const logEl = document.getElementById('lobbyNetLog');
      logEl.textContent = `ホスト発見! 接続しています...`;

      // クライアント用ランダムID
      peer = new Peer(`arena_${roomCode}_c_${Math.random().toString(36).substr(2, 6)}`, {
        debug: 1,
        config: {
          iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' }
          ]
        }
      });

      peer.on('open', (myPeerId) => {
        hostConn = peer.connect(hostId, { reliable: false });
        setupClientHandlers();
      });

      peer.on('error', (err) => {
        logEl.textContent = `接続再試行中... (${err.type})`;
      });
    }

    // ホスト側の通信ハンドラ
    function setupHostHandlers() {
      peer.on('connection', (conn) => {
        conn.on('open', () => {
          peerConnections.set(conn.peer, conn);
          updateNetStatusUI(true, peerConnections.size + 1);

          // 新規参加者へ初期マップ情報 (Gems) を送信
          conn.send({
            type: 'init_gems',
            gems: gems
          });
        });

        conn.on('data', (data) => {
          handleIncomingNetworkData(data, conn.peer);
          // 受信データを他の全クライアントへ中継 (ブロードキャスト)
          peerConnections.forEach((otherConn, pid) => {
            if (pid !== conn.peer && otherConn.open) {
              otherConn.send(data);
            }
          });
        });

        conn.on('close', () => {
          peerConnections.delete(conn.peer);
          remotePlayers.delete(conn.peer);
          updateNetStatusUI(true, peerConnections.size + 1);
          broadcast({ type: 'player_leave', peerId: conn.peer });
        });
      });
    }

    // クライアント側の通信ハンドラ
    function setupClientHandlers() {
      hostConn.on('open', () => {
        isHost = false;
        document.getElementById('lobbyNetLog').textContent = `ルーム接続完了!`;
        updateNetStatusUI(false, 2);

        // Ping測定定期送信
        setInterval(() => {
          if (hostConn && hostConn.open) {
            lastPingSend = performance.now();
            hostConn.send({ type: 'ping', t: lastPingSend });
          }
        }, 2000);
      });

      hostConn.on('data', (data) => {
        handleIncomingNetworkData(data);
      });

      hostConn.on('close', () => {
        updateNetStatusUI(false, 1, '切断されました');
      });
    }

    // メッセージのブロードキャスト送信
    function broadcast(payload) {
      if (isHost) {
        peerConnections.forEach(conn => {
          if (conn.open) conn.send(payload);
        });
      } else if (hostConn && hostConn.open) {
        hostConn.send(payload);
      }
    }

    // 受信パケットの処理
    function handleIncomingNetworkData(data, senderPeerId) {
      if (!data) return;

      switch (data.type) {
        case 'ping':
          if (isHost && senderPeerId) {
            const sender = peerConnections.get(senderPeerId);
            if (sender && sender.open) sender.send({ type: 'pong', t: data.t });
          }
          break;

        case 'pong':
          currentPing = Math.round(performance.now() - data.t);
          document.getElementById('netPing').textContent = currentPing;
          break;

        case 'sync_state':
          // 他プレイヤーの位置・ステータス更新
          if (data.id === myPlayer.id) return;
          remotePlayers.set(data.id, {
            ...data,
            lastSeen: performance.now()
          });
          updateLeaderboard();
          break;

        case 'shoot':
          // 敵の弾丸生成
          if (data.ownerId === myPlayer.id) return;
          bullets.push(data.bullet);
          sound.playShoot();
          break;

        case 'hit':
          // ダメージ通知
          if (data.targetId === myPlayer.id) {
            takeDamage(data.damage, data.attackerName);
          }
          break;

        case 'gem_eaten':
          // 誰かがオーブを取得
          const gIdx = gems.findIndex(g => g.id === data.gemId);
          if (gIdx !== -1) {
            gems.splice(gIdx, 1);
            if (isHost) {
              setTimeout(() => spawnSingleGem(), 4000);
            }
          }
          break;

        case 'init_gems':
          gems = data.gems || [];
          break;

        case 'gem_spawn':
          gems.push(data.gem);
          break;

        case 'kill_broadcast':
          addKillLog(data.killer, data.victim);
          break;

        case 'player_leave':
          remotePlayers.delete(data.peerId);
          updateLeaderboard();
          break;
      }
    }

    function updateNetStatusUI(asHost, count, customText) {
      const dot = document.getElementById('netStatusDot');
      const text = document.getElementById('netStatusText');
      const countEl = document.getElementById('netPlayerCount');
      
      dot.classList.remove('bg-amber-400', 'bg-emerald-400', 'bg-rose-500');
      if (customText) {
        dot.classList.add('bg-rose-500');
        text.textContent = customText;
        text.className = 'font-bold text-rose-400 font-mono';
      } else {
        dot.classList.add('bg-emerald-400');
        text.textContent = asHost ? '👑 HOST' : '🟢 CLIENT';
        text.className = 'font-bold text-emerald-400 font-mono';
      }
      countEl.textContent = count;
      document.getElementById('roomCodeBadge').textContent = roomCode;
    }

    function initGems() {
      gems = [];
      for (let i = 0; i < GEMS_COUNT; i++) {
        spawnSingleGem();
      }
    }

    function spawnSingleGem() {
      const angle = Math.random() * Math.PI * 2;
      const dist = Math.random() * (WORLD_WIDTH / 2 - 120);
      const isGold = Math.random() < 0.15;
      const gem = {
        id: 'g_' + Math.random().toString(36).substr(2, 7),
        x: Math.round(WORLD_WIDTH / 2 + Math.cos(angle) * dist),
        y: Math.round(WORLD_HEIGHT / 2 + Math.sin(angle) * dist),
        val: isGold ? 25 : 10,
        color: isGold ? '#fbbf24' : '#06b6d4',
        r: isGold ? 8 : 5
      };
      gems.push(gem);

      if (isHost) {
        broadcast({ type: 'gem_spawn', gem: gem });
      }
    }

    /* =========================================================
       4. スマホタッチ操作 (ジョイスティック / 各種ボタン)
       ========================================================= */
    let joyTouchId = null;
    let joyCenter = { x: 0, y: 0 };
    let joyVector = { x: 0, y: 0 };
    const joyZone = document.getElementById('joystickZone');
    const joyKnob = document.getElementById('joystickKnob');

    function updateJoystick(clientX, clientY) {
      const dx = clientX - joyCenter.x;
      const dy = clientY - joyCenter.y;
      const dist = Math.hypot(dx, dy);
      const maxR = 50;
      const angle = Math.atan2(dy, dx);
      const bounded = Math.min(dist, maxR);

      joyKnob.style.transform = `translate(calc(-50% + ${Math.cos(angle) * bounded}px), calc(-50% + ${Math.sin(angle) * bounded}px))`;

      if (dist > 6) {
        joyVector = {
          x: Math.cos(angle) * (bounded / maxR),
          y: Math.sin(angle) * (bounded / maxR)
        };
        myPlayer.angle = angle;
      } else {
        joyVector = { x: 0, y: 0 };
      }
    }

    joyZone.addEventListener('touchstart', (e) => {
      e.preventDefault();
      if (joyTouchId !== null) return;
      const t = e.changedTouches[0];
      joyTouchId = t.identifier;
      const r = joyZone.getBoundingClientRect();
      joyCenter = { x: r.left + r.width / 2, y: r.top + r.height / 2 };
      updateJoystick(t.clientX, t.clientY);
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
      if (joyTouchId === null) return;
      for (let i = 0; i < e.changedTouches.length; i++) {
        if (e.changedTouches[i].identifier === joyTouchId) {
          updateJoystick(e.changedTouches[i].clientX, e.changedTouches[i].clientY);
          break;
        }
      }
    }, { passive: false });

    function resetJoy() {
      joyTouchId = null;
      joyVector = { x: 0, y: 0 };
      joyKnob.style.transform = `translate(-50%, -50%)`;
    }
    window.addEventListener('touchend', (e) => {
      for (let i = 0; i < e.changedTouches.length; i++) {
        if (e.changedTouches[i].identifier === joyTouchId) {
          resetJoy();
          break;
        }
      }
    });
    window.addEventListener('touchcancel', resetJoy);

    // キーボード操作対応 (PCデバッグ用)
    const keys = {};
    window.addEventListener('keydown', (e) => {
      keys[e.key.toLowerCase()] = true;
      if (e.key === ' ' || e.key === 'Enter') shootWeapon();
      if (e.key === 'Shift') triggerDash();
    });
    window.addEventListener('keyup', (e) => {
      keys[e.key.toLowerCase()] = false;
    });

    /* =========================================================
       5. 攻撃、ダッシュ、ダメージ処理
       ========================================================= */
    // 最も近い敵を自動索敵
    function getAutoAimAngle() {
      let nearest = null;
      let minD = 550;

      remotePlayers.forEach((rp) => {
        if (!rp.isAlive) return;
        // 同一チームは索敵除外
        if (myPlayer.team !== 'solo' && myPlayer.team === rp.team) return;

        const d = Math.hypot(rp.x - myPlayer.x, rp.y - myPlayer.y);
        if (d < minD) {
          minD = d;
          nearest = rp;
        }
      });

      if (nearest) {
        return Math.atan2(nearest.y - myPlayer.y, nearest.x - myPlayer.x);
      }
      return myPlayer.angle;
    }

    function shootWeapon() {
      if (!myPlayer.isAlive) return;
      const cfg = CLASS_CONFIG[myPlayer.classType];
      const now = performance.now();
      if (now - myPlayer.lastShootTime < cfg.reload) return;

      myPlayer.lastShootTime = now;
      sound.playShoot(myPlayer.classType === 'sniper' ? 880 : 540);

      const aimAngle = getAutoAimAngle();
      myPlayer.angle = aimAngle;

      for (let i = 0; i < cfg.count; i++) {
        let spreadAngle = aimAngle;
        if (cfg.count > 1) {
          spreadAngle += (i - (cfg.count - 1) / 2) * (cfg.spread / cfg.count);
        } else if (cfg.spread > 0) {
          spreadAngle += (Math.random() - 0.5) * cfg.spread;
        }

        const bullet = {
          id: 'b_' + Math.random().toString(36).substr(2, 7),
          ownerId: myPlayer.id,
          ownerName: myPlayer.name,
          team: myPlayer.team,
          color: getPlayerColor(myPlayer),
          x: myPlayer.x + Math.cos(spreadAngle) * (myPlayer.radius + 6),
          y: myPlayer.y + Math.sin(spreadAngle) * (myPlayer.radius + 6),
          vx: Math.cos(spreadAngle) * cfg.bulletSpeed,
          vy: Math.sin(spreadAngle) * cfg.bulletSpeed,
          damage: cfg.bulletDmg,
          radius: cfg.bulletSize,
          life: 80
        };

        bullets.push(bullet);

        // 他プレイヤーへ弾丸共有
        broadcast({
          type: 'shoot',
          ownerId: myPlayer.id,
          bullet: bullet
        });
      }

      // 反動
      myPlayer.vx -= Math.cos(aimAngle) * 1.8;
      myPlayer.vy -= Math.sin(aimAngle) * 1.8;
    }

    function triggerDash() {
      if (!myPlayer.isAlive || myPlayer.stamina < 30) return;
      myPlayer.stamina -= 30;
      myPlayer.isDashing = true;
      sound.playDash();

      const boost = 14;
      myPlayer.vx += Math.cos(myPlayer.angle) * boost;
      myPlayer.vy += Math.sin(myPlayer.angle) * boost;

      // ダッシュ軌跡パーティクル
      for (let i = 0; i < 6; i++) {
        particles.push({
          x: myPlayer.x,
          y: myPlayer.y,
          vx: (Math.random() - 0.5) * 4,
          vy: (Math.random() - 0.5) * 4,
          color: '#38bdf8',
          size: 4,
          alpha: 1,
          decay: 0.06
        });
      }
      setTimeout(() => { myPlayer.isDashing = false; }, 200);
    }

    function takeDamage(dmg, attackerName) {
      if (!myPlayer.isAlive) return;
      sound.playHit();
      myPlayer.hp -= dmg;

      popups.push({
        x: myPlayer.x + (Math.random() - 0.5) * 20,
        y: myPlayer.y - 25,
        text: `-${dmg}`,
        color: '#f43f5e',
        size: 16,
        life: 40,
        dy: -1
      });

      if (myPlayer.hp <= 0) {
        myPlayer.isAlive = false;
        sound.playExplode();
        document.getElementById('deathMessage').textContent = `${attackerName || '敵'} に撃破された！`;
        document.getElementById('finalScore').textContent = myPlayer.score;
        document.getElementById('finalKills').textContent = myPlayer.kills;
        document.getElementById('deathModal').classList.remove('hidden');

        broadcast({
          type: 'kill_broadcast',
          killer: attackerName || 'Enemy',
          victim: myPlayer.name
        });
      }
    }

    function sendEmote(txt) {
      if (!myPlayer.isAlive) return;
      myPlayer.emote = txt;
      myPlayer.emoteTimer = 140;
      popups.push({
        x: myPlayer.x,
        y: myPlayer.y - 35,
        text: txt,
        color: '#fef08a',
        size: 16,
        life: 60,
        dy: -0.6
      });
      syncMyState();
    }

    // ボタンのイベント紐付け
    document.getElementById('btnAttack').addEventListener('touchstart', (e) => { e.preventDefault(); shootWeapon(); });
    document.getElementById('btnAttack').addEventListener('mousedown', (e) => { e.preventDefault(); shootWeapon(); });
    document.getElementById('btnDash').addEventListener('touchstart', (e) => { e.preventDefault(); triggerDash(); });
    document.getElementById('btnDash').addEventListener('mousedown', (e) => { e.preventDefault(); triggerDash(); });

    document.querySelectorAll('.emote-btn').forEach(b => {
      b.addEventListener('click', () => sendEmote(b.dataset.emote));
    });

    /* =========================================================
       6. ロビー設定 & リスポーン
       ========================================================= */
    let selectedTeam = 'solo';
    let selectedClass = 'gunner';

    document.querySelectorAll('.team-btn').forEach(btn => {
      btn.addEventListener('click', () => {

    document.querySelectorAll('.class-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.class-btn').forEach(b => {
          b.classList.remove('ring-2', 'ring-indigo-400', 'border-indigo-500');
          b.classList.add('border-slate-700');
        });

        btn.classList.add('ring-2', 'ring-indigo-400', 'border-indigo-500');

    document.getElementById('btnJoin').addEventListener('click', () => {
      sound.init();
      const n = document.getElementById('inputNickname').value.trim();
      const r = document.getElementById('inputRoom').value.trim().toUpperCase() || 'ARENA10';

      myPlayer.name = n || '勇者' + Math.floor(Math.random() * 900 + 100);

      document.getElementById('hudName').textContent = myPlayer.name;

      initNetwork(r);

    });

    document.getElementById('btnRespawn').addEventListener('click', () => {
      applyClassStats();
      myPlayer.x = WORLD_WIDTH / 2 + (Math.random() - 0.5) * 600;
      myPlayer.y = WORLD_HEIGHT / 2 + (Math.random() - 0.5) * 600;
      myPlayer.vx = 0;
      myPlayer.vy = 0;
      myPlayer.isAlive = true;

    });

    function applyClassStats() {
      const cfg = CLASS_CONFIG[myPlayer.classType];
      myPlayer.maxHp = cfg.maxHp + (myPlayer.level - 1) * 15;
      myPlayer.hp = myPlayer.maxHp;
      myPlayer.radius = 23 + (myPlayer.level - 1) * 1.2;
    }

    function addKillLog(killer, victim) {
      const feed = document.getElementById('killFeed');
      const item = document.createElement('div');
      item.className = 'bg-slate-900/80 px-2 py-0.5 rounded-full border border-slate-700 animate-pulse text-[10px] text-white shadow';
      item.innerHTML = `<span class="text-rose-400 font-bold">${killer}</span> 💥 <span class="text-slate-400">${victim}</span>`;
      feed.prepend(item);
      setTimeout(() => item.remove(), 4000);
    }

    function updateLeaderboard() {
      const all = [myPlayer, ...Array.from(remotePlayers.values())];
      all.sort((a, b) => (b.score || 0) - (a.score || 0));

      const list = document.getElementById('leaderboardList');
      list.innerHTML = '';
      all.slice(0, 5).forEach((p, i) => {
        const li = document.createElement('li');
        const isMe = p.id === myPlayer.id;
        li.className = `flex justify-between items-center ${isMe ? 'text-amber-300 font-bold' : 'text-slate-300'}`;
        let icon = '👑';
        if (p.team === 'red') icon = '🔴';
        if (p.team === 'blue') icon = '🔵';
        li.innerHTML = `<span class="truncate max-w-[85px]">${i + 1}.${icon} ${p.name}</span><span class="font-mono text-[9px]">${p.score || 0}</span>`;
        list.appendChild(li);
      });
      document.getElementById('netPlayerCount').textContent = all.length;
    }

    function getPlayerColor(p) {
      if (p.team === 'red') return '#f43f5e';
      if (p.team === 'blue') return '#3b82f6';
      return '#10b981';
    }

    /* =========================================================
       7. ゲームループ (物理演算・判定・描画)
       ========================================================= */
    let lastNetworkTick = 0;
    const NETWORK_TICK_RATE = 50; // 50ms (秒間20回同期待ち)

    function syncMyState() {
      broadcast({
        type: 'sync_state',
        id: myPlayer.id,
        name: myPlayer.name,
        team: myPlayer.team,
        classType: myPlayer.classType,
        x: Math.round(myPlayer.x),
        y: Math.round(myPlayer.y),
        angle: Number(myPlayer.angle.toFixed(2)),
        hp: Math.round(myPlayer.hp),
        maxHp: Math.round(myPlayer.maxHp),
        score: myPlayer.score,
        kills: myPlayer.kills,
        level: myPlayer.level,
        isAlive: myPlayer.isAlive,
        emote: myPlayer.emote
      });
    }

    function update() {
      if (!myPlayer.isAlive) return;

      // キーボード移動入力補助
      if (keys['w'] || keys['arrowup']) joyVector.y = -1;
      else if (keys['s'] || keys['arrowdown']) joyVector.y = 1;
      else if (joyTouchId === null && !keys['w'] && !keys['s']) joyVector.y = 0;

      if (keys['a'] || keys['arrowleft']) joyVector.x = -1;
      else if (keys['d'] || keys['arrowright']) joyVector.x = 1;
      else if (joyTouchId === null && !keys['a'] && !keys['d']) joyVector.x = 0;

      // 速度計算
      const cfg = CLASS_CONFIG[myPlayer.classType];
      const speed = myPlayer.isDashing ? cfg.speed * 2.1 : cfg.speed;

      myPlayer.vx += joyVector.x * speed * 0.28;
      myPlayer.vy += joyVector.y * speed * 0.28;

      myPlayer.vx *= 0.82;
      myPlayer.vy *= 0.82;

      myPlayer.x += myPlayer.vx;
      myPlayer.y += myPlayer.vy;

      // ワールド境界制限
      myPlayer.x = Math.max(myPlayer.radius, Math.min(WORLD_WIDTH - myPlayer.radius, myPlayer.x));
      myPlayer.y = Math.max(myPlayer.radius, Math.min(WORLD_HEIGHT - myPlayer.radius, myPlayer.y));

      // 障害物コリジョン
      obstacles.forEach(obs => {
        const dx = myPlayer.x - obs.x;
        const dy = myPlayer.y - obs.y;
        const dist = Math.hypot(dx, dy);
        const minDist = myPlayer.radius + obs.r;
        if (dist < minDist) {
          const overlap = minDist - dist;
          myPlayer.x += (dx / dist) * overlap;
          myPlayer.y += (dy / dist) * overlap;
        }
      });

      // スタミナ回復
      if (myPlayer.stamina < 100) {
        myPlayer.stamina = Math.min(100, myPlayer.stamina + 0.4);
      }

      // エモートタイマー
      if (myPlayer.emoteTimer > 0) {
        myPlayer.emoteTimer--;
        if (myPlayer.emoteTimer <= 0) myPlayer.emote = null;
      }

      // オーブ収集判定
      for (let i = gems.length - 1; i >= 0; i--) {
        const g = gems[i];
        const dist = Math.hypot(myPlayer.x - g.x, myPlayer.y - g.y);
        if (dist < 100) {
          g.x += (myPlayer.x - g.x) * 0.15;
          g.y += (myPlayer.y - g.y) * 0.15;
        }
        if (dist < myPlayer.radius + g.r) {
          myPlayer.exp += g.val;
          myPlayer.score += g.val;
          sound.playGem();

          broadcast({ type: 'gem_eaten', gemId: g.id });
          gems.splice(i, 1);

          // レベルアップ
          if (myPlayer.exp >= myPlayer.nextExp) {
            myPlayer.level++;
            myPlayer.exp -= myPlayer.nextExp;
            myPlayer.nextExp = Math.round(myPlayer.nextExp * 1.5);
            applyClassStats();
            document.getElementById('centerAlert').classList.remove('opacity-0');
            setTimeout(() => document.getElementById('centerAlert').classList.add('opacity-0'), 1500);
          }
        }
      }

      // 弾丸の更新と当たり判定
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.vx;
        b.y += b.vy;
        b.life--;

        // 障害物衝突
        let hitObstacle = false;
        for (const obs of obstacles) {
          if (Math.hypot(b.x - obs.x, b.y - obs.y) < obs.r + b.radius) {
            hitObstacle = true;
            break;
          }
        }

        if (hitObstacle || b.life <= 0) {
          bullets.splice(i, 1);
          continue;
        }

        // 自分が撃った弾が相手に当たったか判定
        if (b.ownerId === myPlayer.id) {
          remotePlayers.forEach((rp, rId) => {
            if (!rp.isAlive) return;
            if (myPlayer.team !== 'solo' && myPlayer.team === rp.team) return;

            const dist = Math.hypot(b.x - rp.x, b.y - rp.y);
            const targetR = 23 + ((rp.level || 1) - 1) * 1.2;

            if (dist < targetR + b.radius) {
              sound.playHit();
              bullets.splice(i, 1);

              // 相手へダメージ送信
              broadcast({
                type: 'hit',
                targetId: rp.id,
                attackerName: myPlayer.name,
                damage: b.damage
              });

              // パーティクル
              for (let p = 0; p < 4; p++) {
                particles.push({
                  x: b.x,
                  y: b.y,
                  vx: (Math.random() - 0.5) * 5,
                  vy: (Math.random() - 0.5) * 5,
                  color: '#ef4444',
                  size: 3,
                  alpha: 1,
                  decay: 0.08
                });
              }
            }
          });
        }
      }

      // パーティクル & ポップアップ更新
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= p.decay;
        if (p.alpha <= 0) particles.splice(i, 1);
      }
      for (let i = popups.length - 1; i >= 0; i--) {
        const pop = popups[i];
        pop.y += pop.dy;
        pop.life--;
        if (pop.life <= 0) popups.splice(i, 1);
      }

      // HUD反映
      const hpPct = Math.max(0, Math.min(100, (myPlayer.hp / myPlayer.maxHp) * 100));
      document.getElementById('hudHpFill').style.width = `${hpPct}%`;
      document.getElementById('hudHpText').textContent = `${Math.ceil(myPlayer.hp)} / ${myPlayer.maxHp}`;
      document.getElementById('hudBoostFill').style.width = `${myPlayer.stamina}%`;
      document.getElementById('hudExpFill').style.width = `${(myPlayer.exp / myPlayer.nextExp) * 100}%`;
      document.getElementById('hudLevel').textContent = `Lv.${myPlayer.level}`;
      document.getElementById('hudKills').textContent = `撃破: ${myPlayer.kills}`;

      // リアルタイムP2P位置同期 (20Hz)
      const now = performance.now();
      if (now - lastNetworkTick > NETWORK_TICK_RATE) {
        lastNetworkTick = now;
        syncMyState();
      }
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const camX = myPlayer.x - canvas.width / 2;
      const camY = myPlayer.y - canvas.height / 2;

      ctx.save();
      ctx.translate(-camX, -camY);

      // グリッド線描画
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
      ctx.lineWidth = 1;
      const grid = 60;
      const startX = Math.floor(camX / grid) * grid;
      const startY = Math.floor(camY / grid) * grid;

      for (let x = startX; x < camX + canvas.width + grid; x += grid) {
        ctx.beginPath();
        ctx.moveTo(x, camY);
        ctx.lineTo(x, camY + canvas.height);
        ctx.stroke();
      }
      for (let y = startY; y < camY + canvas.height + grid; y += grid) {
        ctx.beginPath();
        ctx.moveTo(camX, y);
        ctx.lineTo(camX + canvas.width, y);
        ctx.stroke();
      }

      // 外周ボーダー
      ctx.strokeStyle = '#ef4444';
      ctx.lineWidth = 8;
      ctx.strokeRect(0, 0, WORLD_WIDTH, WORLD_HEIGHT);

      // 障害物
      obstacles.forEach(obs => {
        ctx.beginPath();
        ctx.arc(obs.x, obs.y, obs.r, 0, Math.PI * 2);
        ctx.fillStyle = '#1e293b';
        ctx.fill();
        ctx.lineWidth = 4;
        ctx.strokeStyle = '#334155';
        ctx.stroke();
      });

      // オーブ描画
      gems.forEach(g => {
        ctx.beginPath();
        ctx.arc(g.x, g.y, g.r, 0, Math.PI * 2);
        ctx.fillStyle = g.color;
        ctx.shadowColor = g.color;
        ctx.shadowBlur = 6;
        ctx.fill();
        ctx.shadowBlur = 0;
      });

      // 弾丸描画
      bullets.forEach(b => {
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
        ctx.fillStyle = b.color;
        ctx.shadowColor = b.color;
        ctx.shadowBlur = 5;
        ctx.fill();
        ctx.shadowBlur = 0;
      });

      // 他プレイヤー描画
      remotePlayers.forEach(rp => {
        if (!rp.isAlive) return;
        drawCharacter(rp, rp.x, rp.y, rp.angle, false);
      });

      // 自プレイヤー描画
      if (myPlayer.isAlive) {
        drawCharacter(myPlayer, myPlayer.x, myPlayer.y, myPlayer.angle, true);
      }

      // パーティクル
      particles.forEach(p => {
        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      // ダメージポップアップ & エモート
      popups.forEach(pop => {
        ctx.font = `bold ${pop.size}px sans-serif`;
        ctx.fillStyle = pop.color;
        ctx.textAlign = 'center';
        ctx.shadowColor = 'rgba(0,0,0,0.8)';
        ctx.shadowBlur = 4;
        ctx.fillText(pop.text, pop.x, pop.y);
        ctx.shadowBlur = 0;
      });

      ctx.restore();

      // ミニマップ更新
      renderMiniMap();
    }

    function drawCharacter(p, x, y, angle, isSelf) {
      const r = p.radius || 23;
      const color = getPlayerColor(p);

      ctx.save();
      ctx.translate(x, y);

      // 砲塔
      ctx.save();
      ctx.rotate(angle);
      ctx.fillStyle = '#64748b';
      ctx.strokeStyle = '#334155';
      ctx.lineWidth = 2;
      ctx.fillRect(r * 0.4, -6, r * 1.1, 12);
      ctx.strokeRect(r * 0.4, -6, r * 1.1, 12);
      ctx.restore();

      // 本体円
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.fill();
      ctx.lineWidth = isSelf ? 3 : 2;
      ctx.strokeStyle = isSelf ? '#ffffff' : '#000000';
      ctx.stroke();

      // プレイヤー名
      ctx.font = 'bold 11px sans-serif';
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.fillText(p.name || 'Fighter', 0, -r - 12);

      // HPバー
      const barW = 34;
      const barH = 4;
      const maxHp = p.maxHp || 100;
      const hp = Math.max(0, p.hp || 0);
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(-barW / 2, -r - 8, barW, barH);
      ctx.fillStyle = color;
      ctx.fillRect(-barW / 2, -r - 8, barW * (hp / maxHp), barH);

      // エモートバルーン
      if (p.emote) {
        ctx.font = 'bold 14px sans-serif';
        ctx.fillStyle = '#fef08a';
        ctx.fillText(p.emote, 0, -r - 24);
      }

      ctx.restore();
    }

    function renderMiniMap() {
      miniCtx.clearRect(0, 0, miniCanvas.width, miniCanvas.height);
      const sx = miniCanvas.width / WORLD_WIDTH;
      const sy = miniCanvas.height / WORLD_HEIGHT;

      miniPlayersDraw(sx, sy);
    }

    function miniPlayersDraw(sx, sy) {
      remotePlayers.forEach(p => {
        if (!p.isAlive) return;
        miniCtx.beginPath();
        miniCtx.arc(p.x * sx, p.y * sy, 2.5, 0, Math.PI * 2);
        miniCtx.fillStyle = getPlayerColor(p);
        miniCtx.fill();
      });

      if (myPlayer.isAlive) {
        miniCtx.beginPath();
        miniCtx.arc(myPlayer.x * sx, myPlayer.y * sy, 3.5, 0, Math.PI * 2);
        miniCtx.fillStyle = '#ffffff';
        miniCtx.fill();
      }
    }

    function loop() {
      update();
      render();
      requestAnimationFrame(loop);
    }

    window.onload = function () {
      requestAnimationFrame(loop);
    };
  </script>
</body>
</html>

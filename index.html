<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Arena.io - 身内オンライン対戦バトル</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * {
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      box-sizing: border-box;
      touch-action: none;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0f19;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    /* Pulse and glow animations */
    @keyframes neonGlow {
      0%, 100% { filter: drop-shadow(0 0 8px rgba(59, 130, 246, 0.6)); }
      50% { filter: drop-shadow(0 0 16px rgba(147, 51, 234, 0.8)); }
    }
    .neon-border {
      animation: neonGlow 3s infinite alternate;
    }
    /* Custom Scrollbar for Kill log */
    ::-webkit-scrollbar {
      width: 4px;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
    }
  </style>
</head>
<body class="relative bg-slate-950 text-white">

  <canvas id="gameCanvas"></canvas>

  <!-- In-game HUD -->
  <div id="gameHud" class="pointer-events-none absolute inset-0 hidden flex flex-col justify-between p-3 select-none">
    <!-- Top Bar: Player Stats & Leaderboard & Kill Feed -->
    <div class="flex justify-between items-start w-full">
      <!-- Left: HP, EXP, Level & Class -->
      <div class="flex flex-col gap-1 w-44 sm:w-60">
        <!-- Name & Class badge -->
        <div class="flex items-center gap-2">
          <span id="hudName" class="font-bold text-sm sm:text-base drop-shadow tracking-wide truncate max-w-[120px]">Player</span>
          <span id="hudClass" class="text-[10px] sm:text-xs bg-indigo-600/80 px-2 py-0.5 rounded-full border border-indigo-400 font-semibold uppercase">Gunner</span>
        </div>

        <!-- HP Bar -->
        <div class="relative w-full h-3.5 bg-slate-900/80 rounded-full border border-slate-700 overflow-hidden shadow-inner">
          <div id="hudHpFill" class="h-full bg-gradient-to-r from-emerald-500 to-green-400 w-full transition-all duration-150"></div>
          <span id="hudHpText" class="absolute inset-0 flex items-center justify-center text-[9px] font-black tracking-wider text-white drop-shadow">100 / 100</span>
        </div>

        <!-- Boost Stamina Bar -->
        <div class="relative w-full h-2 bg-slate-900/80 rounded-full border border-slate-700 overflow-hidden shadow-inner">
          <div id="hudBoostFill" class="h-full bg-gradient-to-r from-amber-500 to-yellow-300 w-full transition-all duration-75"></div>
        </div>

        <!-- EXP Bar -->
        <div class="relative w-full h-2 bg-slate-900/80 rounded-full border border-slate-700 overflow-hidden shadow-inner">
          <div id="hudExpFill" class="h-full bg-gradient-to-r from-cyan-500 to-blue-500 w-0 transition-all duration-150"></div>
        </div>
        <div class="flex justify-between text-[10px] text-slate-300 font-mono">
          <span id="hudLevel">Lv.1</span>
          <span id="hudKills">撃破: 0</span>
        </div>
      </div>

      <!-- Center: Killfeed & Emote Banner -->
      <div id="killFeed" class="flex flex-col items-center gap-1 max-w-[200px] text-center text-[10px] font-medium text-slate-300 pointer-events-none"></div>

      <!-- Right: Leaderboard & Minimap container -->
      <div class="flex flex-col items-end gap-2">
        <div class="bg-slate-900/80 backdrop-blur-md rounded-xl p-2 border border-slate-800 text-[11px] shadow-lg w-32 sm:w-40 pointer-events-auto">
          <div class="font-bold border-b border-slate-700 pb-1 text-slate-400 flex items-center justify-between text-[10px]">
            <span><i class="fa-solid fa-trophy text-amber-400 mr-1"></i>ランキング</span>
            <span id="playerCountBadge" class="bg-indigo-900/60 px-1 rounded text-[9px] text-indigo-200">1人</span>
          </div>
          <ol id="leaderboardList" class="mt-1 space-y-0.5 text-slate-200"></ol>
        </div>

        <!-- Mini-radar Map -->
        <div class="relative w-20 h-20 sm:w-24 sm:h-24 bg-slate-900/90 rounded-lg border border-slate-700 overflow-hidden shadow">
          <canvas id="miniMapCanvas" class="w-full h-full block"></canvas>
        </div>
      </div>
    </div>

    <!-- Center Screen Alerts / Emote Display for self -->
    <div id="centerAlert" class="self-center text-center opacity-0 transition-opacity duration-300 pointer-events-none">
      <div id="centerAlertText" class="text-xl sm:text-2xl font-black text-amber-300 drop-shadow-[0_2px_10px_rgba(251,191,36,0.8)]">LEVEL UP!</div>
    </div>

    <!-- Bottom Controls Overlay (Mobile Friendly Touch Elements) -->
    <div class="flex justify-between items-end w-full pb-2">
      <!-- Joystick Anchor / Zone Indicator -->
      <div id="joystickZone" class="relative w-36 h-36 rounded-full border border-dashed border-white/20 bg-white/5 pointer-events-auto flex items-center justify-center">
        <div id="joystickKnob" class="absolute w-12 h-12 rounded-full bg-cyan-500/80 shadow-[0_0_12px_rgba(6,182,212,0.8)] border-2 border-white pointer-events-none transform -translate-x-1/2 -translate-y-1/2 left-1/2 top-1/2"></div>
      </div>

      <!-- Action Buttons -->
      <div class="flex flex-col items-end gap-3 pointer-events-auto">
        <!-- Quick Emote / Ping Row -->
        <div class="flex gap-2">
          <button data-emote="⚔️ 突撃!" class="emote-btn px-2.5 py-1.5 rounded-full bg-slate-800/80 hover:bg-slate-700 border border-slate-600 text-xs active:scale-95 shadow">⚔️ 突撃</button>
          <button data-emote="🆘 たすけて!" class="emote-btn px-2.5 py-1.5 rounded-full bg-slate-800/80 hover:bg-slate-700 border border-slate-600 text-xs active:scale-95 shadow">🆘 救援</button>
          <button data-emote="🤝 同盟?" class="emote-btn px-2.5 py-1.5 rounded-full bg-slate-800/80 hover:bg-slate-700 border border-slate-600 text-xs active:scale-95 shadow">🤝 同盟</button>
          <button data-emote="✨ ナイス!" class="emote-btn px-2.5 py-1.5 rounded-full bg-slate-800/80 hover:bg-slate-700 border border-slate-600 text-xs active:scale-95 shadow">✨ ナイス</button>
        </div>

        <!-- Big Attack & Dash Buttons -->
        <div class="flex items-center gap-4">
          <!-- Dash / Boost Button -->
          <button id="btnDash" class="w-16 h-16 rounded-full bg-amber-600 active:bg-amber-500 border-2 border-amber-300 shadow-[0_0_15px_rgba(245,158,11,0.5)] flex flex-col items-center justify-center active:scale-95 select-none transition-transform">
            <i class="fa-solid fa-bolt text-lg text-white"></i>
            <span class="text-[9px] font-bold mt-0.5 text-amber-100">DASH</span>
          </button>

          <!-- Main Shoot / Attack Button -->
          <button id="btnAttack" class="w-20 h-20 rounded-full bg-gradient-to-br from-rose-600 to-red-500 active:from-rose-500 active:to-red-400 border-3 border-rose-300 shadow-[0_0_20px_rgba(244,63,94,0.6)] flex flex-col items-center justify-center active:scale-95 select-none transition-transform">
            <i class="fa-solid fa-crosshairs text-2xl text-white"></i>
            <span class="text-[10px] font-black tracking-wider text-rose-100 mt-1">FIRE</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <div id="lobbyScreen" class="absolute inset-0 bg-slate-950/95 backdrop-blur-md flex items-center justify-center p-4 z-40">
    <div class="w-full max-w-md bg-slate-900/90 border border-slate-800 p-6 rounded-3xl shadow-2xl neon-border flex flex-col gap-4">
      <div class="text-center">
        <h1 class="text-3xl font-black italic bg-gradient-to-r from-cyan-400 via-indigo-400 to-pink-500 bg-clip-text text-transparent">
          ARENA.IO
        </h1>
        <p class="text-xs text-slate-400 mt-1">仲間約10人でバチバチ戦うリアルタイムバトル</p>
      </div>

      <!-- Player Name -->
      <div>
        <label class="text-xs font-semibold text-slate-300 mb-1 block">プレイヤー名</label>
        <input id="inputNickname" type="text" maxlength="10" placeholder="なまえ（例: ぽん太）" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-white placeholder-slate-500 focus:outline-none focus:border-cyan-400 transition">
      </div>

      <!-- Room Code -->
      <div>
        <label class="text-xs font-semibold text-slate-300 mb-1 flex justify-between">
          <span>ルームID (合言葉)</span>
          <span class="text-[10px] text-indigo-400">同じ部屋名で合流!</span>
        </label>
        <input id="inputRoom" type="text" maxlength="12" value="FRIENDS" placeholder="例: minna-room" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-white uppercase font-mono tracking-wider focus:outline-none focus:border-cyan-400 transition">
      </div>

      <!-- Team Select -->
      <div>
        <label class="text-xs font-semibold text-slate-300 mb-1.5 block">チーム設定</label>
        <div class="grid grid-cols-3 gap-2" id="teamSelector">
          <button type="button" data-team="solo" class="team-btn py-2 px-3 rounded-xl border border-cyan-500/50 bg-cyan-950/40 text-cyan-300 text-xs font-bold text-center active:scale-95 transition ring-2 ring-cyan-400">
            👑 個人戦 (FFA)
          </button>
          <button type="button" data-team="red" class="team-btn py-2 px-3 rounded-xl border border-rose-500/30 bg-rose-950/20 text-rose-300 text-xs font-bold text-center active:scale-95 transition">
            🔴 赤チーム
          </button>
          <button type="button" data-team="blue" class="team-btn py-2 px-3 rounded-xl border border-blue-500/30 bg-blue-950/20 text-blue-300 text-xs font-bold text-center active:scale-95 transition">
            🔵 青チーム
          </button>
        </div>
      </div>

      <!-- Class Evolution preview -->
      <div>
        <label class="text-xs font-semibold text-slate-300 mb-1.5 block">初期スタイル</label>
        <div class="grid grid-cols-3 gap-2" id="classSelector">
          <button type="button" data-class="gunner" class="class-btn py-2 px-2 rounded-xl border border-indigo-500 bg-indigo-950/40 text-indigo-300 text-xs font-bold flex flex-col items-center ring-2 ring-indigo-400">
            <i class="fa-solid fa-crosshairs text-base mb-1"></i>
            <span>ガンナー</span>
            <span class="text-[9px] text-slate-400 font-normal">バランス型</span>
          </button>
          <button type="button" data-class="shotgun" class="class-btn py-2 px-2 rounded-xl border border-slate-700 bg-slate-800/40 text-slate-300 text-xs font-bold flex flex-col items-center">
            <i class="fa-solid fa-explosion text-base mb-1"></i>
            <span>散弾銃</span>
            <span class="text-[9px] text-slate-400 font-normal">近接拡散</span>
          </button>
          <button type="button" data-class="sniper" class="class-btn py-2 px-2 rounded-xl border border-slate-700 bg-slate-800/40 text-slate-300 text-xs font-bold flex flex-col items-center">
            <i class="fa-solid fa-bullseye text-base mb-1"></i>
            <span>スナイパー</span>
            <span class="text-[9px] text-slate-400 font-normal">長距離高威力</span>
          </button>
        </div>
      </div>

      <!-- Sound toggle & Join Button -->
      <div class="flex items-center justify-between mt-2 pt-2 border-t border-slate-800">
        <label class="flex items-center gap-2 text-xs text-slate-400 cursor-pointer">
          <input type="checkbox" id="checkSound" checked class="rounded bg-slate-800 border-slate-700 text-indigo-500 focus:ring-0">
          <span>サウンド効果 (BGM/SE)</span>
        </label>
      </div>

      <button id="btnJoin" class="w-full py-3.5 bg-gradient-to-r from-cyan-500 via-indigo-500 to-pink-500 rounded-2xl font-black text-base tracking-wider hover:opacity-95 active:scale-[0.98] shadow-lg shadow-indigo-500/30 transition">
        アリーナに参戦する！
      </button>
    </div>
  </div>

  <div id="deathModal" class="absolute inset-0 bg-red-950/80 backdrop-blur-md hidden flex flex-col items-center justify-center p-4 z-50">
    <div class="w-full max-w-xs bg-slate-900/90 border border-red-500/50 p-6 rounded-3xl text-center shadow-2xl flex flex-col items-center gap-3">
      <div class="text-4xl text-rose-500 animate-bounce">
        <i class="fa-solid fa-skull"></i>
      </div>
      <h2 class="text-2xl font-black text-rose-400">撃破されました...</h2>
      <p id="deathMessage" class="text-xs text-slate-300">敵の弾幕に倒れた！</p>
      
      <div class="bg-slate-800/80 rounded-xl p-3 w-full my-1 border border-slate-700 text-left text-xs space-y-1">
        <div class="flex justify-between text-slate-400"><span>最終スコア:</span><span id="finalScore" class="font-bold text-cyan-400">0</span></div>
        <div class="flex justify-between text-slate-400"><span>撃破数:</span><span id="finalKills" class="font-bold text-amber-400">0</span></div>
      </div>

      <button id="btnRespawn" class="w-full py-3 bg-gradient-to-r from-emerald-500 to-teal-600 rounded-xl font-black text-sm tracking-wider hover:opacity-95 active:scale-95 shadow-lg shadow-teal-500/30 transition">
        今すぐ復活 (リスポーン)
      </button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, deleteDoc, onSnapshot, collection, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const appId = typeof __app_id !== 'undefined' ? __app_id : 'arena-io-game';
    let db = null;
    let auth = null;
    let currentUser = null;
    let isFirebaseReady = false;

    try {
      if (typeof __firebase_config !== 'undefined' && __firebase_config) {
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        db = getFirestore(app);
        auth = getAuth(app);
      }
    } catch (e) {
      console.warn("Firebase config fallback to local emulation", e);
    }

    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      playShoot(pitch = 600) {
        if (!this.enabled || !this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(pitch, now);
        osc.frequency.exponentialRampToValueAtTime(80, now + 0.12);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.12);
      }
      playHit() {
        if (!this.enabled || !this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.linearRampToValueAtTime(100, now + 0.08);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.08);
      }
      playGem() {
        if (!this.enabled || !this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, now);
        osc.frequency.exponentialRampToValueAtTime(1320, now + 0.09);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.09);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.09);
      }
      playDash() {
        if (!this.enabled || !this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.linearRampToValueAtTime(600, now + 0.15);
        gain.gain.setValueAtTime(0.18, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.15);
      }
      playExplosion() {
        if (!this.enabled || !this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(120, now);
        osc.frequency.exponentialRampToValueAtTime(30, now + 0.35);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.35);
      }
      playLevelUp() {
        if (!this.enabled || !this.ctx) return;
        [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
          const now = this.ctx.currentTime + (i * 0.08);
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.2);
        });
      }
    }
    const sound = new SoundEngine();

    const WORLD_WIDTH = 2600;
    const WORLD_HEIGHT = 2600;
    const TOTAL_GEMS = 180;

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const miniCanvas = document.getElementById('miniMapCanvas');
    const miniCtx = miniCanvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      miniCanvas.width = miniCanvas.parentElement.clientWidth;
      miniCanvas.height = miniCanvas.parentElement.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const CLASS_CONFIG = {
      gunner: { name: 'ガンナー', reload: 190, speed: 4.8, bulletSpeed: 13, bulletDmg: 20, bulletSize: 6, maxHp: 110, count: 1, spread: 0 },
      shotgun: { name: '散弾銃', reload: 450, speed: 4.5, bulletSpeed: 11, bulletDmg: 16, bulletSize: 5, maxHp: 130, count: 4, spread: 0.35 },
      sniper: { name: 'スナイパー', reload: 650, speed: 4.4, bulletSpeed: 21, bulletDmg: 60, bulletSize: 7, maxHp: 90, count: 1, spread: 0.02 }
    };

    let localPlayer = {
      id: 'p_' + Math.random().toString(36).substring(2, 9),
      name: 'Player',
      team: 'solo',
      classType: 'gunner',
      x: WORLD_WIDTH / 2 + (Math.random() - 0.5) * 400,
      y: WORLD_HEIGHT / 2 + (Math.random() - 0.5) * 400,
      angle: 0,
      vx: 0,
      vy: 0,
      radius: 24,
      hp: 110,
      maxHp: 110,
      stamina: 100,
      score: 0,
      kills: 0,
      level: 1,
      exp: 0,
      nextExp: 50,
      lastFireTime: 0,
      lastDashTime: 0,
      isDashing: false,
      isAlive: true,
      emote: null,
      emoteTimer: 0
    };

    let remotePlayers = new Map();
    let localBullets = [];
    let remoteBullets = [];
    let gems = [];
    let particles = [];
    let floatingTexts = [];
    let obstacles = [];
    let bushes = [];
    let killLogs = [];

    let currentRoomId = 'FRIENDS';
    let lastNetworkSync = 0;
    const SYNC_INTERVAL = 85; // 85ms network tick rate

    function initMapFeatures() {
      obstacles = [];
      bushes = [];
      // Fixed obstacles with rocks
      const obsPositions = [
        { x: 700, y: 700, r: 80 }, { x: 1900, y: 700, r: 80 },
        { x: 700, y: 1900, r: 80 }, { x: 1900, y: 1900, r: 80 },
        { x: 1300, y: 800, r: 60 }, { x: 1300, y: 1800, r: 60 },
        { x: 800, y: 1300, r: 60 }, { x: 1800, y: 1300, r: 60 }
      ];
      obsPositions.forEach(p => obstacles.push(p));

      // Hiding bushes (ambush zones)
      const bushPositions = [
        { x: 500, y: 1300, r: 120 }, { x: 2100, y: 1300, r: 120 },
        { x: 1300, y: 500, r: 120 }, { x: 1300, y: 2100, r: 120 },
        { x: 1000, y: 1000, r: 100 }, { x: 1600, y: 1600, r: 100 }
      ];
      bushPositions.forEach(b => bushes.push(b));

      // Initial Gems
      gems = [];
      for (let i = 0; i < TOTAL_GEMS; i++) {
        spawnGem(i);
      }
    }

    function spawnGem(id) {
      // High reward closer to center
      const angle = Math.random() * Math.PI * 2;
      const dist = Math.random() * (WORLD_WIDTH / 2 - 100);
      const isGold = Math.random() < 0.15;
      gems.push({
        id: id ?? ('g_' + Math.random().toString(36).substr(2, 6)),
        x: WORLD_WIDTH / 2 + Math.cos(angle) * dist,
        y: WORLD_HEIGHT / 2 + Math.sin(angle) * dist,
        val: isGold ? 25 : 10,
        color: isGold ? '#fbbf24' : '#06b6d4',
        r: isGold ? 9 : 6
      });
    }

    initMapFeatures();

    let joyTouchId = null;
    let joyStart = { x: 0, y: 0 };
    let joyMove = { x: 0, y: 0 };
    let joyVector = { x: 0, y: 0 };
    const joyZone = document.getElementById('joystickZone');
    const joyKnob = document.getElementById('joystickKnob');

    function updateJoystickPosition(currentX, currentY) {
      const dx = currentX - joyStart.x;
      const dy = currentY - joyStart.y;
      const dist = Math.hypot(dx, dy);
      const maxDist = 55;
      const angle = Math.atan2(dy, dx);
      const boundedDist = Math.min(dist, maxDist);

      const offsetX = Math.cos(angle) * boundedDist;
      const offsetY = Math.sin(angle) * boundedDist;

      joyKnob.style.transform = `translate(calc(-50% + ${offsetX}px), calc(-50% + ${offsetY}px))`;
      joyVector = {
        x: dist > 5 ? Math.cos(angle) * (boundedDist / maxDist) : 0,
        y: dist > 5 ? Math.sin(angle) * (boundedDist / maxDist) : 0
      };

      if (dist > 8) {
        localPlayer.angle = angle;
      }
    }

    function resetJoystick() {
      joyTouchId = null;
      joyVector = { x: 0, y: 0 };
      joyKnob.style.transform = `translate(-50%, -50%)`;
    }

    joyZone.addEventListener('touchstart', (e) => {
      e.preventDefault();
      if (joyTouchId !== null) return;
      const touch = e.changedTouches[0];
      joyTouchId = touch.identifier;
      const rect = joyZone.getBoundingClientRect();
      joyStart = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
      updateJoystickPosition(touch.clientX, touch.clientY);
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
      if (joyTouchId === null) return;
      for (let i = 0; i < e.changedTouches.length; i++) {
        const touch = e.changedTouches[i];
        if (touch.identifier === joyTouchId) {
          updateJoystickPosition(touch.clientX, touch.clientY);
          break;
        }
      }
    }, { passive: false });

    window.addEventListener('touchend', (e) => {
      for (let i = 0; i < e.changedTouches.length; i++) {
        if (e.changedTouches[i].identifier === joyTouchId) {
          resetJoystick();
          break;
        }
      }
    });

    window.addEventListener('touchcancel', () => resetJoystick());

    const keys = {};
    window.addEventListener('keydown', (e) => {
      keys[e.key.toLowerCase()] = true;
      if (e.key === ' ' || e.key === 'Enter') shootWeapon();
      if (e.key === 'Shift') triggerDash();
    });
    window.addEventListener('keyup', (e) => {
      keys[e.key.toLowerCase()] = false;
    });

    function getClosestTargetAngle() {
      let closest = null;
      let minDistance = 550;

      remotePlayers.forEach((rp) => {
        if (!rp.isAlive) return;
        // Avoid auto-aiming at same teammates
        if (localPlayer.team !== 'solo' && localPlayer.team === rp.team) return;

        const dist = Math.hypot(rp.x - localPlayer.x, rp.y - localPlayer.y);
        if (dist < minDistance) {
          minDistance = dist;
          closest = rp;
        }
      });

      if (closest) {
        return Math.atan2(closest.y - localPlayer.y, closest.x - localPlayer.x);
      }
      return localPlayer.angle;
    }

    function shootWeapon() {
      if (!localPlayer.isAlive) return;
      const cfg = CLASS_CONFIG[localPlayer.classType];
      const now = performance.now();
      if (now - localPlayer.lastFireTime < cfg.reload) return;

      localPlayer.lastFireTime = now;
      sound.playShoot(localPlayer.classType === 'sniper' ? 880 : 540);

      // Aim towards closest enemy or player movement direction
      const aimAngle = getClosestTargetAngle();
      localPlayer.angle = aimAngle;

      for (let i = 0; i < cfg.count; i++) {
        let spreadAngle = aimAngle;
        if (cfg.count > 1) {
          spreadAngle += (i - (cfg.count - 1) / 2) * (cfg.spread / cfg.count);
        } else if (cfg.spread > 0) {
          spreadAngle += (Math.random() - 0.5) * cfg.spread;
        }

        const b = {
          id: 'b_' + Math.random().toString(36).substr(2, 7),
          ownerId: localPlayer.id,
          team: localPlayer.team,
          color: getPlayerColor(localPlayer),
          x: localPlayer.x + Math.cos(spreadAngle) * (localPlayer.radius + 6),
          y: localPlayer.y + Math.sin(spreadAngle) * (localPlayer.radius + 6),
          vx: Math.cos(spreadAngle) * cfg.bulletSpeed,
          vy: Math.sin(spreadAngle) * cfg.bulletSpeed,
          damage: cfg.bulletDmg,
          radius: cfg.bulletSize,
          life: 80
        };
        localBullets.push(b);
      }

      // Small recoil
      localPlayer.vx -= Math.cos(aimAngle) * 1.5;
      localPlayer.vy -= Math.sin(aimAngle) * 1.5;
    }

    function triggerDash() {
      if (!localPlayer.isAlive) return;
      if (localPlayer.stamina < 35) return;
      localPlayer.stamina -= 35;
      localPlayer.isDashing = true;
      sound.playDash();

      const speedBoost = 15;
      localPlayer.vx += Math.cos(localPlayer.angle) * speedBoost;
      localPlayer.vy += Math.sin(localPlayer.angle) * speedBoost;

      // Dash particle trail
      for (let i = 0; i < 8; i++) {
        particles.push({
          x: localPlayer.x,
          y: localPlayer.y,
          vx: (Math.random() - 0.5) * 4,
          vy: (Math.random() - 0.5) * 4,
          color: '#38bdf8',
          size: Math.random() * 5 + 3,
          alpha: 1,
          decay: 0.05
        });
      }

      setTimeout(() => { localPlayer.isDashing = false; }, 200);
    }

    function sendEmote(text) {
      if (!localPlayer.isAlive) return;
      localPlayer.emote = text;
      localPlayer.emoteTimer = 160;
      floatingTexts.push({
        x: localPlayer.x,
        y: localPlayer.y - 35,
        text: text,
        color: '#fef08a',
        size: 16,
        life: 60,
        dy: -0.8
      });
      syncLocalPlayerToRoom();
    }

    const btnAttack = document.getElementById('btnAttack');
    btnAttack.addEventListener('touchstart', (e) => { e.preventDefault(); shootWeapon(); });
    btnAttack.addEventListener('mousedown', (e) => { e.preventDefault(); shootWeapon(); });

    const btnDash = document.getElementById('btnDash');
    btnDash.addEventListener('touchstart', (e) => { e.preventDefault(); triggerDash(); });
    btnDash.addEventListener('mousedown', (e) => { e.preventDefault(); triggerDash(); });

    document.querySelectorAll('.emote-btn').forEach(btn => {
      btn.addEventListener('click', () => sendEmote(btn.dataset.emote));
    });

    let selectedTeam = 'solo';
    let selectedClass = 'gunner';

    document.querySelectorAll('.team-btn').forEach(b => {
      b.addEventListener('click', () => {
        document.querySelectorAll('.team-btn').forEach(btn => {
          btn.classList.remove('ring-2', 'ring-cyan-400', 'ring-rose-400', 'ring-blue-400');
        });

        if (selectedTeam === 'red') b.classList.add('ring-2', 'ring-rose-400');
        if (selectedTeam === 'blue') b.classList.add('ring-2', 'ring-blue-400');
      });
    });

    document.querySelectorAll('.class-btn').forEach(b => {
      b.addEventListener('click', () => {
        document.querySelectorAll('.class-btn').forEach(btn => {
          btn.classList.remove('ring-2', 'ring-indigo-400');
          btn.classList.remove('border-indigo-500');

        b.classList.add('ring-2', 'ring-indigo-400', 'border-indigo-500');

    });

    document.getElementById('checkSound').addEventListener('change', (e) => {
      sound.enabled = e.target.checked;
    });

    document.getElementById('btnJoin').addEventListener('click', () => {
      sound.init();
      const nameInput = document.getElementById('inputNickname').value.trim();
      const roomInput = document.getElementById('inputRoom').value.trim().toUpperCase() || 'FRIENDS';

      localPlayer.name = nameInput || '名無しファイター';
      localPlayer.team = selectedTeam;
      localPlayer.classType = selectedClass;
      currentRoomId = roomInput;

      applyClassStats();

      document.getElementById('lobbyScreen').classList.add('hidden');
      document.getElementById('gameHud').classList.remove('hidden');

    document.getElementById('btnRespawn').addEventListener('click', () => {

    });

    function applyClassStats() {
      const cfg = CLASS_CONFIG[localPlayer.classType];
      localPlayer.maxHp = cfg.maxHp + (localPlayer.level - 1) * 12;
      localPlayer.hp = localPlayer.maxHp;
      localPlayer.radius = 23 + (localPlayer.level - 1) * 1.2;
    }

    function respawnPlayer() {
      applyClassStats();
      localPlayer.x = WORLD_WIDTH / 2 + (Math.random() - 0.5) * 600;
      localPlayer.y = WORLD_HEIGHT / 2 + (Math.random() - 0.5) * 600;
      localPlayer.vx = 0;
      localPlayer.vy = 0;
      localPlayer.isAlive = true;
      localPlayer.stamina = 100;
      document.getElementById('deathModal').classList.add('hidden');
      syncLocalPlayerToRoom();
    }

    let roomUnsubscribe = null;

    async function initFirestoreRoomSync() {
      if (!db || !auth) {
        console.warn("Operating in standalone offline sandbox (simulated peers)");
        spawnSimulatedFriends();
        return;
      }

      try {
        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          await signInWithCustomToken(auth, __initial_auth_token);
        } else {
          await signInAnonymously(auth);
        }

        currentUser = auth.currentUser;
        if (!currentUser) return;
        localPlayer.id = currentUser.uid;

        // Path Rule: /artifacts/{appId}/public/data/{collectionName}
        const playersCollection = collection(db, 'artifacts', appId, 'public', 'data', `arena_room_${currentRoomId}`);

        // Listen to active players
        roomUnsubscribe = onSnapshot(playersCollection, (snapshot) => {
          const now = Date.now();
          snapshot.docChanges().forEach((change) => {
            const data = change.doc.data();
            const id = change.doc.id;

            if (id === localPlayer.id) return; // Ignore self

            if (change.type === 'removed') {
              remotePlayers.delete(id);
            } else {
              // Only consider players updated within last 15 seconds
              if (!data.lastUpdated || (now - data.lastUpdated < 15000)) {
                remotePlayers.set(id, data);
              } else {
                remotePlayers.delete(id);
              }
            }
          });
          updateLeaderboardAndCount();
        }, (error) => {
          console.error("Firestore snapshot error:", error);
        });

        // Cleanup before unload
        window.addEventListener('beforeunload', () => {
          if (currentUser) {
            deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', `arena_room_${currentRoomId}`, localPlayer.id));
          }
        });

      } catch (err) {
        console.error("Authentication/Sync error:", err);
        spawnSimulatedFriends();
      }
    }

    async function syncLocalPlayerToRoom() {
      if (!db || !auth || !auth.currentUser) return;

      try {
        const playerDocRef = doc(db, 'artifacts', appId, 'public', 'data', `arena_room_${currentRoomId}`, localPlayer.id);
        await setDoc(playerDocRef, {
          id: localPlayer.id,
          name: localPlayer.name,
          team: localPlayer.team,
          classType: localPlayer.classType,
          x: Math.round(localPlayer.x),
          y: Math.round(localPlayer.y),
          angle: Number(localPlayer.angle.toFixed(2)),
          hp: Math.round(localPlayer.hp),
          maxHp: Math.round(localPlayer.maxHp),
          score: localPlayer.score,
          kills: localPlayer.kills,
          level: localPlayer.level,
          isAlive: localPlayer.isAlive,
          emote: localPlayer.emote,
          lastUpdated: Date.now()
        }, { merge: true });
      } catch (err) {
        // Soft fail
      }
    }

    function spawnSimulatedFriends() {
      const botNames = ['たかし', 'さくら', 'Ken', 'Yuki', 'アキラ', 'モブマスター', 'ダイキ', 'ミオ'];
      const teams = ['solo', 'red', 'blue'];
      const classes = ['gunner', 'shotgun', 'sniper'];

      botNames.forEach((bname, idx) => {
        const id = 'bot_' + idx;
        remotePlayers.set(id, {
          id: id,
          name: bname,
          team: teams[idx % teams.length],
          classType: classes[idx % classes.length],
          x: WORLD_WIDTH / 2 + (Math.random() - 0.5) * 900,
          y: WORLD_HEIGHT / 2 + (Math.random() - 0.5) * 900,
          angle: Math.random() * Math.PI * 2,
          hp: 110,
          maxHp: 110,
          score: Math.floor(Math.random() * 150),
          kills: Math.floor(Math.random() * 3),
          level: Math.floor(Math.random() * 2) + 1,
          isAlive: true,
          emote: null,
          isBot: true,
          vx: 0,
          vy: 0,
          lastShoot: performance.now() + Math.random() * 1000
        });
      });
      updateLeaderboardAndCount();
    }

    function getPlayerColor(p) {
      if (p.team === 'red') return '#f43f5e';
      if (p.team === 'blue') return '#3b82f6';
      return '#10b981'; // solo emerald
    }

    function updateLeaderboardAndCount() {
      const allPlayers = [localPlayer, ...Array.from(remotePlayers.values())];
      allPlayers.sort((a, b) => (b.score || 0) - (a.score || 0));

      const countBadge = document.getElementById('playerCountBadge');
      if (countBadge) countBadge.textContent = `${allPlayers.length}人`;

      const listEl = document.getElementById('leaderboardList');
      if (listEl) {
        listEl.innerHTML = '';
        allPlayers.slice(0, 6).forEach((p, idx) => {
          const li = document.createElement('li');
          const isSelf = p.id === localPlayer.id;
          li.className = `flex justify-between items-center ${isSelf ? 'text-amber-300 font-bold' : 'text-slate-300'}`;
          
          let teamIcon = '👑';
          if (p.team === 'red') teamIcon = '🔴';
          if (p.team === 'blue') teamIcon = '🔵';

          li.innerHTML = `
            <span class="truncate max-w-[90px]">${idx + 1}. ${teamIcon} ${p.name || 'Fighter'}</span>
            <span class="font-mono text-[10px]">${p.score || 0}</span>
          `;
          listEl.appendChild(li);
        });
      }
    }

    function addKillFeed(killerName, victimName) {
      const feed = document.getElementById('killFeed');
      if (!feed) return;
      const item = document.createElement('div');
      item.className = 'bg-slate-900/80 px-2 py-1 rounded-full border border-slate-700 animate-pulse text-[10px] text-white';
      item.innerHTML = `<span class="text-rose-400 font-bold">${killerName}</span> 💥 <span class="text-slate-400">${victimName}</span>`;
      feed.prepend(item);
      setTimeout(() => item.remove(), 4000);
    }

    function triggerLevelAlert(txt) {
      const alertBox = document.getElementById('centerAlert');
      const alertText = document.getElementById('centerAlertText');
      alertText.textContent = txt;
      alertBox.classList.remove('opacity-0');
      sound.playLevelUp();
      setTimeout(() => alertBox.classList.add('opacity-0'), 1500);
    }

    let lastTime = performance.now();

    function update(dt) {
      if (!localPlayer.isAlive) return;

      // 1. Desktop Keyboard movement
      if (keys['w'] || keys['arrowup']) joyVector.y = -1;
      else if (keys['s'] || keys['arrowdown']) joyVector.y = 1;
      else if (joyTouchId === null && !keys['w'] && !keys['s']) joyVector.y = 0;

      if (keys['a'] || keys['arrowleft']) joyVector.x = -1;
      else if (keys['d'] || keys['arrowright']) joyVector.x = 1;
      else if (joyTouchId === null && !keys['a'] && !keys['d']) joyVector.x = 0;

      // 2. Local Player Velocity & Speed
      const classCfg = CLASS_CONFIG[localPlayer.classType];
      const baseSpeed = classCfg.speed;
      const speed = localPlayer.isDashing ? baseSpeed * 2.2 : baseSpeed;

      localPlayer.vx += joyVector.x * speed * 0.25;
      localPlayer.vy += joyVector.y * speed * 0.25;

      // Friction
      localPlayer.vx *= 0.84;
      localPlayer.vy *= 0.84;

      localPlayer.x += localPlayer.vx;
      localPlayer.y += localPlayer.vy;

      // World Boundary Collision
      localPlayer.x = Math.max(localPlayer.radius, Math.min(WORLD_WIDTH - localPlayer.radius, localPlayer.x));
      localPlayer.y = Math.max(localPlayer.radius, Math.min(WORLD_HEIGHT - localPlayer.radius, localPlayer.y));

      // Obstacle Collision
      obstacles.forEach(obs => {
        const dx = localPlayer.x - obs.x;
        const dy = localPlayer.y - obs.y;
        const dist = Math.hypot(dx, dy);
        const minDist = localPlayer.radius + obs.r;
        if (dist < minDist) {
          const overlap = minDist - dist;
          const nx = dx / dist;
          const ny = dy / dist;
          localPlayer.x += nx * overlap;
          localPlayer.y += ny * overlap;
        }
      });

      // Stamina Recharge
      if (localPlayer.stamina < 100) {
        localPlayer.stamina = Math.min(100, localPlayer.stamina + 0.35);
      }

      // Emote Timer
      if (localPlayer.emoteTimer > 0) {
        localPlayer.emoteTimer--;
        if (localPlayer.emoteTimer <= 0) localPlayer.emote = null;
      }

      // 3. Gem Pickups
      for (let i = gems.length - 1; i >= 0; i--) {
        const g = gems[i];
        const dist = Math.hypot(localPlayer.x - g.x, localPlayer.y - g.y);
        // Gem magnet effect
        if (dist < 120) {
          g.x += (localPlayer.x - g.x) * 0.15;
          g.y += (localPlayer.y - g.y) * 0.15;
        }
        if (dist < localPlayer.radius + g.r) {
          localPlayer.exp += g.val;
          localPlayer.score += g.val;
          sound.playGem();

          // Particle burst
          for (let p = 0; p < 4; p++) {
            particles.push({
              x: g.x,
              y: g.y,
              vx: (Math.random() - 0.5) * 5,
              vy: (Math.random() - 0.5) * 5,
              color: g.color,
              size: 3,
              alpha: 1,
              decay: 0.05
            });
          }

          gems.splice(i, 1);
          setTimeout(() => spawnGem(), 4000); // Respawn after 4s

          // Level Up Check
          if (localPlayer.exp >= localPlayer.nextExp) {
            localPlayer.level++;
            localPlayer.exp -= localPlayer.nextExp;
            localPlayer.nextExp = Math.round(localPlayer.nextExp * 1.5);
            applyClassStats();
            triggerLevelAlert(`LEVEL UP! Lv.${localPlayer.level}`);
          }
        }
      }

      // 4. Update Bullets (Local and Simulation)
      for (let i = localBullets.length - 1; i >= 0; i--) {
        const b = localBullets[i];
        b.x += b.vx;
        b.y += b.vy;
        b.life--;

        // Obstacle Bullet Hit
        let hitObs = false;
        for (const obs of obstacles) {
          if (Math.hypot(b.x - obs.x, b.y - obs.y) < obs.r + b.radius) {
            hitObs = true;
            break;
          }
        }

        if (hitObs || b.life <= 0) {
          localBullets.splice(i, 1);
          continue;
        }

        // Check Hit Against Remote Players / Bots
        remotePlayers.forEach((rp, rId) => {
          if (!rp.isAlive) return;
          if (localPlayer.team !== 'solo' && localPlayer.team === rp.team) return; // Friendly fire off

          const dist = Math.hypot(b.x - rp.x, b.y - rp.y);
          const targetRadius = 24 + ((rp.level || 1) - 1) * 1.2;

          if (dist < targetRadius + b.radius) {
            sound.playHit();
            rp.hp -= b.damage;

            // Damage text
            floatingTexts.push({
              x: rp.x + (Math.random() - 0.5) * 20,
              y: rp.y - 20,
              text: `-${b.damage}`,
              color: '#f87171',
              size: 14,
              life: 45,
              dy: -1
            });

            // Particles
            for (let k = 0; k < 5; k++) {
              particles.push({
                x: b.x,
                y: b.y,
                vx: (Math.random() - 0.5) * 6,
                vy: (Math.random() - 0.5) * 6,
                color: '#ef4444',
                size: 3,
                alpha: 1,
                decay: 0.08
              });
            }

            localBullets.splice(i, 1);

            // Defeat remote player/bot
            if (rp.hp <= 0 && rp.isAlive) {
              rp.isAlive = false;
              sound.playExplosion();
              localPlayer.kills++;
              localPlayer.score += 150;
              addKillFeed(localPlayer.name, rp.name);

              // Spawn extra gems at death spot
              for (let g = 0; g < 6; g++) {
                gems.push({
                  id: 'dg_' + Math.random(),
                  x: rp.x + (Math.random() - 0.5) * 60,
                  y: rp.y + (Math.random() - 0.5) * 60,
                  val: 20,
                  color: '#fbbf24',
                  r: 8
                });
              }

              if (rp.isBot) {
                setTimeout(() => {
                  rp.isAlive = true;
                  rp.hp = rp.maxHp || 110;
                  rp.x = WORLD_WIDTH / 2 + (Math.random() - 0.5) * 800;
                  rp.y = WORLD_HEIGHT / 2 + (Math.random() - 0.5) * 800;
                }, 4000);
              }
            }
          }
        });
      }

      // 5. Update Simulated Bots (Movement & Action)
      const now = performance.now();
      remotePlayers.forEach((rp) => {
        if (!rp.isBot || !rp.isAlive) return;

        // Simple wandering and target tracking
        const targetDx = localPlayer.x - rp.x;
        const targetDy = localPlayer.y - rp.y;
        const distToPlayer = Math.hypot(targetDx, targetDy);

        if (distToPlayer < 450 && (localPlayer.team === 'solo' || localPlayer.team !== rp.team)) {
          rp.angle = Math.atan2(targetDy, targetDx);
          rp.x += Math.cos(rp.angle) * 1.8;
          rp.y += Math.sin(rp.angle) * 1.8;

          // Bot shoot at local player
          if (now - (rp.lastShoot || 0) > 1300) {
            rp.lastShoot = now;
            const b = {
              x: rp.x + Math.cos(rp.angle) * 28,
              y: rp.y + Math.sin(rp.angle) * 28,
              vx: Math.cos(rp.angle) * 9,
              vy: Math.sin(rp.angle) * 9,
              damage: 15,
              radius: 5,
              life: 70,
              color: getPlayerColor(rp)
            };
            remoteBullets.push(b);
          }
        } else {
          rp.angle += (Math.random() - 0.5) * 0.1;
          rp.x += Math.cos(rp.angle) * 1.4;
          rp.y += Math.sin(rp.angle) * 1.4;
        }

        rp.x = Math.max(40, Math.min(WORLD_WIDTH - 40, rp.x));
        rp.y = Math.max(40, Math.min(WORLD_HEIGHT - 40, rp.y));
      });

      // 6. Update Remote Bullets hitting Local Player
      for (let i = remoteBullets.length - 1; i >= 0; i--) {
        const b = remoteBullets[i];
        b.x += b.vx;
        b.y += b.vy;
        b.life--;

        if (b.life <= 0) {
          remoteBullets.splice(i, 1);
          continue;
        }

        const dist = Math.hypot(b.x - localPlayer.x, b.y - localPlayer.y);
        if (dist < localPlayer.radius + b.radius) {
          sound.playHit();
          localPlayer.hp -= b.damage;
          remoteBullets.splice(i, 1);

          floatingTexts.push({
            x: localPlayer.x + (Math.random() - 0.5) * 20,
            y: localPlayer.y - 20,
            text: `-${b.damage}`,
            color: '#ef4444',
            size: 15,
            life: 45,
            dy: -1
          });

          if (localPlayer.hp <= 0 && localPlayer.isAlive) {
            localPlayer.isAlive = false;
            sound.playExplosion();
            document.getElementById('deathMessage').textContent = '撃破されました！仲間とリベンジしよう！';
            document.getElementById('finalScore').textContent = localPlayer.score;
            document.getElementById('finalKills').textContent = localPlayer.kills;
            document.getElementById('deathModal').classList.remove('hidden');
            syncLocalPlayerToRoom();
          }
        }
      }

      // 7. Update Particles & Floating Text
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= p.decay;
        if (p.alpha <= 0) particles.splice(i, 1);
      }

      for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const ft = floatingTexts[i];
        ft.y += ft.dy;
        ft.life--;
        if (ft.life <= 0) floatingTexts.splice(i, 1);
      }

      // 8. Update In-Game HUD Elements
      const hpPct = Math.max(0, Math.min(100, (localPlayer.hp / localPlayer.maxHp) * 100));
      document.getElementById('hudHpFill').style.width = `${hpPct}%`;
      document.getElementById('hudHpText').textContent = `${Math.ceil(localPlayer.hp)} / ${localPlayer.maxHp}`;
      document.getElementById('hudBoostFill').style.width = `${localPlayer.stamina}%`;
      document.getElementById('hudExpFill').style.width = `${(localPlayer.exp / localPlayer.nextExp) * 100}%`;
      document.getElementById('hudLevel').textContent = `Lv.${localPlayer.level}`;
      document.getElementById('hudKills').textContent = `撃破: ${localPlayer.kills}`;

      // 9. Periodic Firebase Sync
      if (now - lastNetworkSync > SYNC_INTERVAL) {
        lastNetworkSync = now;
        syncLocalPlayerToRoom();
      }
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Camera centered on local player
      const cameraX = localPlayer.x - canvas.width / 2;
      const cameraY = localPlayer.y - canvas.height / 2;

      ctx.save();
      ctx.translate(-cameraX, -cameraY);

      // Draw Grid Background
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
      ctx.lineWidth = 1;
      const gridSize = 60;
      const startX = Math.floor(cameraX / gridSize) * gridSize;
      const startY = Math.floor(cameraY / gridSize) * gridSize;

      for (let x = startX; x < cameraX + canvas.width + gridSize; x += gridSize) {
        ctx.beginPath();
        ctx.moveTo(x, cameraY);
        ctx.lineTo(x, cameraY + canvas.height);
        ctx.stroke();
      }
      for (let y = startY; y < cameraY + canvas.height + gridSize; y += gridSize) {
        ctx.beginPath();
        ctx.moveTo(cameraX, y);
        ctx.lineTo(cameraX + canvas.width, y);
        ctx.stroke();
      }

      // Draw Arena Center Circle (Hot Zone)
      ctx.beginPath();
      ctx.arc(WORLD_WIDTH / 2, WORLD_HEIGHT / 2, 280, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(244, 63, 94, 0.05)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(244, 63, 94, 0.2)';
      ctx.lineWidth = 3;
      ctx.stroke();

      // Draw Arena Outer Boundaries
      ctx.strokeStyle = '#ef4444';
      ctx.lineWidth = 8;
      ctx.strokeRect(0, 0, WORLD_WIDTH, WORLD_HEIGHT);

      // Draw Obstacles (Rocks/Blocks)
      obstacles.forEach(obs => {
        ctx.beginPath();
        ctx.arc(obs.x, obs.y, obs.r, 0, Math.PI * 2);
        ctx.fillStyle = '#334155';
        ctx.fill();
        ctx.lineWidth = 4;
        ctx.strokeStyle = '#475569';
        ctx.stroke();
      });

      // Draw Gems
      gems.forEach(g => {
        ctx.beginPath();
        ctx.arc(g.x, g.y, g.r, 0, Math.PI * 2);
        ctx.fillStyle = g.color;
        ctx.shadowColor = g.color;
        ctx.shadowBlur = 8;
        ctx.fill();
        ctx.shadowBlur = 0;
      });

      // Draw Bullets (Local & Remote)
      [...localBullets, ...remoteBullets].forEach(b => {
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
        ctx.fillStyle = b.color || '#38bdf8';
        ctx.shadowColor = b.color || '#38bdf8';
        ctx.shadowBlur = 6;
        ctx.fill();
        ctx.shadowBlur = 0;
      });

      // Draw Remote Players
      remotePlayers.forEach(p => {
        if (!p.isAlive) return;
        drawCharacter(p, p.x, p.y, p.angle, false);
      });

      // Draw Local Player
      if (localPlayer.isAlive) {
        drawCharacter(localPlayer, localPlayer.x, localPlayer.y, localPlayer.angle, true);
      }

      // Draw Bushes (Hiding Zones - Over players for ambush feeling)
      bushes.forEach(b => {
        const dist = Math.hypot(localPlayer.x - b.x, localPlayer.y - b.y);
        const inside = dist < b.r;
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fillStyle = inside ? 'rgba(34, 197, 94, 0.4)' : 'rgba(22, 163, 74, 0.85)';
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#15803d';
        ctx.stroke();
      });

      // Draw Particle Effects
      particles.forEach(p => {
        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      // Draw Floating Combat Texts & Emotes
      floatingTexts.forEach(ft => {
        ctx.font = `bold ${ft.size}px sans-serif`;
        ctx.fillStyle = ft.color;
        ctx.textAlign = 'center';
        ctx.shadowColor = 'rgba(0,0,0,0.8)';
        ctx.shadowBlur = 4;
        ctx.fillText(ft.text, ft.x, ft.y);
        ctx.shadowBlur = 0;
      });

      ctx.restore();

      // Render Radar Mini-map
      renderMiniMap();
    }

    function drawCharacter(p, x, y, angle, isSelf) {
      const radius = p.radius || 24;
      const color = getPlayerColor(p);

      ctx.save();
      ctx.translate(x, y);

      // Gun Barrel / Turret
      ctx.save();
      ctx.rotate(angle);
      ctx.fillStyle = '#64748b';
      ctx.strokeStyle = '#334155';
      ctx.lineWidth = 2;

      if (p.classType === 'shotgun') {
        ctx.fillRect(radius * 0.4, -9, radius * 0.9, 18);
        ctx.strokeRect(radius * 0.4, -9, radius * 0.9, 18);
      } else if (p.classType === 'sniper') {
        ctx.fillRect(radius * 0.4, -4, radius * 1.5, 8);
        ctx.strokeRect(radius * 0.4, -4, radius * 1.5, 8);
      } else {
        // Standard Gunner
        ctx.fillRect(radius * 0.4, -6, radius * 1.1, 12);
        ctx.strokeRect(radius * 0.4, -6, radius * 1.1, 12);
      }
      ctx.restore();

      // Body Circle
      ctx.beginPath();
      ctx.arc(0, 0, radius, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.fill();
      ctx.lineWidth = isSelf ? 3.5 : 2;
      ctx.strokeStyle = isSelf ? '#ffffff' : 'rgba(0, 0, 0, 0.4)';
      ctx.stroke();

      // Name & HP Bar above head
      ctx.font = 'bold 11px sans-serif';
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.fillText(p.name || 'Player', 0, -radius - 14);

      // HP Bar above head
      const hpWidth = 36;
      const hpHeight = 5;
      const maxHp = p.maxHp || 100;
      const hp = Math.max(0, p.hp || 0);
      const hpPercent = Math.min(1, hp / maxHp);

      ctx.fillStyle = 'rgba(15, 23, 42, 0.7)';
      ctx.fillRect(-hpWidth / 2, -radius - 10, hpWidth, hpHeight);
      ctx.fillStyle = color;
      ctx.fillRect(-hpWidth / 2, -radius - 10, hpWidth * hpPercent, hpHeight);

      // Emote Cloud above player
      if (p.emote) {
        ctx.font = 'bold 13px sans-serif';
        ctx.fillStyle = '#fef08a';
        ctx.fillText(p.emote, 0, -radius - 28);
      }

      ctx.restore();
    }

    function renderMiniMap() {
      miniCtx.clearRect(0, 0, miniCanvas.width, miniCanvas.height);
      const scaleX = miniCanvas.width / WORLD_WIDTH;
      const scaleY = miniCanvas.height / WORLD_HEIGHT;

      // Draw border
      miniCtx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
      miniCtx.strokeRect(0, 0, miniCanvas.width, miniCanvas.height);

      // Remote players on minimap
      remotePlayers.forEach(p => {
        if (!p.isAlive) return;
        miniCtx.beginPath();
        miniCtx.arc(p.x * scaleX, p.y * scaleY, 2.5, 0, Math.PI * 2);
        miniCtx.fillStyle = getPlayerColor(p);
        miniCtx.fill();
      });

      // Local player on minimap
      if (localPlayer.isAlive) {
        miniCtx.beginPath();
        miniCtx.arc(localPlayer.x * scaleX, localPlayer.y * scaleY, 3.5, 0, Math.PI * 2);
        miniCtx.fillStyle = '#ffffff';
        miniCtx.fill();
      }
    }

    function gameLoop(time) {
      const dt = (time - lastTime) / 1000;
      lastTime = time;

      update(dt);
      render();

      requestAnimationFrame(gameLoop);
    }

    window.onload = function () {
      requestAnimationFrame(gameLoop);
    };
  </script>
</body>
</html>

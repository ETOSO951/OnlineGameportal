<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flappy Wizard: Stable Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; touch-action: none; user-select: none; }
        #wrapper { position: relative; width: 320px; margin: 0 auto; }
        canvas { display: block; width: 320px; height: 480px; background: #70c5ce; border: 2px solid #333; }
        #ui { background: rgba(0,0,0,0.9); padding: 5px; display: flex; justify-content: space-around; font-size: 14px; border-bottom: 2px solid #444; }
        
        #skill-panel { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; background: #111; padding: 5px; width: 310px; margin: 0 auto; box-sizing: border-box; }
        .skill-btn { font-size: 9px; padding: 6px 0; background: #333; color: #ccc; border: 1px solid #555; border-radius: 3px; cursor: pointer; text-align: center; }
        .skill-btn.active-skill { border-color: #f8e71c; color: #f8e71c; box-shadow: 0 0 5px #f8e71c; }
        .skill-btn.disabled { opacity: 0.35; cursor: not-allowed; }
        #reroll-btn { background: #442211; color: #f8e71c; border-color: #884422; }

        #status-msg { position: absolute; top: 40%; width: 100%; text-align: center; font-size: 24px; font-weight: bold; text-shadow: 2px 2px #000; pointer-events: none; z-index: 10; }
        #roulette-msg { position: absolute; top: 15%; width: 100%; text-align: center; font-size: 16px; font-weight: bold; color: #f8e71c; background: rgba(0,0,0,0.7); padding: 4px 0; display: none; z-index: 15; text-shadow: 1px 1px #000; }
        .setup { text-align: center; padding: 50px 20px; }
        #peer-status { font-size: 12px; color: #aaa; margin-top: 5px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="setup-screen" class="setup">
        <h1 style="color:#f8e71c; margin-bottom:0;">FLAPPY WIZARD</h1>
        <div id="peer-status">オフライン</div>
        <br>
        <input type="text" id="room-id" placeholder="合言葉を入れる" style="padding:10px; border-radius:5px; border:none;"><br><br>
        <button onclick="initPeer(true)" style="padding:10px 20px; background:#e67e22; border:none; color:#fff; font-weight:bold; border-radius:5px; cursor:pointer;">1P作成 (Host)</button>
        <button onclick="initPeer(false)" style="padding:10px 20px; background:#2ecc71; border:none; color:#fff; font-weight:bold; border-radius:5px; cursor:pointer;">2P参加 (Guest)</button>
    </div>

    <div id="game-screen" class="hidden">
        <div id="ui">
            <div>1P: <span id="s1">0</span></div>
            <div id="stage-display" style="color:#f8e71c; font-weight:bold;">NORMAL</div>
            <div>2P: <span id="s2">0</span></div>
        </div>
        <div id="wrapper">
            <canvas id="gameCanvas" width="320" height="480"></canvas>
            <div id="status-msg"></div>
            <div id="roulette-msg"></div>
        </div>
        <div style="background:#222; height:8px; width:320px; margin:0 auto;"><div id="mp-bar" style="height:100%; width:0%; background:#00d4ff;"></div></div>
        
        <div id="skill-panel">
            <button class="skill-btn" id="slot-0" onclick="useHandSlot(0)"></button>
            <button class="skill-btn" id="slot-1" onclick="useHandSlot(1)"></button>
            <button class="skill-btn" id="slot-2" onclick="useHandSlot(2)"></button>
            <button class="skill-btn" id="slot-3" onclick="useHandSlot(3)"></button>
            <button class="skill-btn" id="reroll-btn" onclick="rerollHand()">更新<br>(15)</button>
        </div>
    </div>

<script>
let audioCtx = null;
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function playSE(type) {
    try {
        initAudio();
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        if (type === 'flap') {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.exponentialRampToValueAtTime(600, now + 0.1);
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(now); osc.stop(now + 0.1);
        } else if (type === 'skill') {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(500, now);
            osc.frequency.exponentialRampToValueAtTime(1200, now + 0.2);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(now); osc.stop(now + 0.2);
        } else if (type === 'die') {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(200, now);
            osc.frequency.exponentialRampToValueAtTime(50, now + 0.4);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(now); osc.stop(now + 0.4);
        } else if (type === 'win') {
            [440, 554, 659, 880].forEach((freq, idx) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.frequency.setValueAtTime(freq, now + idx * 0.1);
                gain.gain.setValueAtTime(0.2, now + idx * 0.1);
                gain.gain.linearRampToValueAtTime(0.01, now + idx * 0.1 + 0.2);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(now + idx * 0.1); osc.stop(now + idx * 0.1 + 0.2);
            });
        }
    } catch(e) {}
}

const STAGES = [
    { name: "NORMAL", bg: "#70c5ce", pipe: "#73bf2e", interval: 105, speed: 1.0, gap: 1.0, g:0.28, j:-5.2 },
    { name: "DUSK", bg: "#e67e22", pipe: "#a35200", interval: 100, speed: 1.1, gap: 1.0, g:0.28, j:-5.2 },
    { name: "NIGHT", bg: "#2c3e50", pipe: "#576574", interval: 105, speed: 1.0, gap: 1.05, g:0.28, j:-5.2, move:true },
    { name: "CAVERN", bg: "#4d4d4d", pipe: "#808080", interval: 105, speed: 1.0, gap: 0.95, g:0.28, j:-5.2 },
    { name: "DESERT", bg: "#d4a70f", pipe: "#e6c28d", interval: 105, speed: 1.0, gap: 1.0, g:0.32, j:-5.2 },
    { name: "OCEAN", bg: "#2980b9", pipe: "#16a085", interval: 80, speed: 0.9, gap: 1.15, g:0.14, j:-2.5 },
    { name: "CYBER", bg: "#8e44ad", pipe: "#c39bd3", interval: 100, speed: 1.2, gap: 1.3, g:0.26, j:-5.2, move:true },
    { name: "FOREST", bg: "#27ae60", pipe: "#1e8449", interval: 90, speed: 1.1, gap: 0.85, g:0.28, j:-5.2 },
    { name: "MANSION", bg: "#cece78", pipe: "#773477", interval: 65, speed: 0.8, gap: 1.1, g:0.28, j:-5.2, move:true },
    { name: "SNOWY", bg: "#8888aa", pipe: "#bdc3c7", interval: 75, speed: 1.3, gap: 0.85, g:0.28, j:-5.2 },
    { name: "MAGMA", bg: "#c0392b", pipe: "#e74c3c", interval: 120, speed: 1.8, gap: 0.8, g:0.28, j:-5.2 },
    { name: "SPACE", bg: "#000000", pipe: "#34495e", interval: 95, speed: 1.5, gap: 0.9, g:-0.28, j:5.2 },
    { name: "METEOR", bg: "#000000", pipe: "#73bf2e", interval: 95, speed: 1.3, gap: 0.85, g:0.28, j:-5.2, move:true }
];

const ALL_SKILLS = {
    speed:    { name: "高速",   cost: 25, dur: 300 },
    move:     { name: "揺れ",   cost: 30, dur: 300 },
    blind:    { name: "暗闇",   cost: 50, dur: 300 },
    rev:      { name: "反転",   cost: 65, dur: 300 },
    ghost:    { name: "透明",   cost: 30, dur: 300 }, // 強化：土管判定は残し、姿がほぼ見えなくなる
    fake:     { name: "分身",   cost: 25, dur: 300 },
    gravUp:   { name: "重力+",  cost: 25, dur: 300 },
    highJump: { name: "強跳",   cost: 30, dur: 300 },
    giant:    { name: "巨大化", cost: 40, dur: 300 },
    back:     { name: "足止め", cost: 65, dur: 80 },
    impact:   { name: "衝撃",   cost: 25, dur: 30 },
    ascend:   { name: "昇天",   cost: 100, dur: 300 },
    magnet:   { name: "磁石",   cost: 35, dur: 200 },
    flash:    { name: "閃光",   cost: 45, dur: 180 },
    quake:    { name: "地震",   cost: 40, dur: 250 }  // NEW
};

const HAPPENINGS = [
    { name: "★低重力モード！", apply: () => { activeHappenings.lowG = 300; } },
    { name: "★乱気流発生！", apply: () => { activeHappenings.turb = 300; } },
    { name: "★妨害側MP全回復！", apply: () => { mp = 100; } },
    { name: "★スローモーション！", apply: () => { activeHappenings.slow = 300; } },
    { name: "★土管の隙間シャッフル！", apply: () => { 
        pipes.forEach(p => { p.gapY = Math.random() * 200 + 100; });
    } },
    { name: "★スピード狂モード！", apply: () => { activeHappenings.speedUp = 250; } },
    { name: "★強制パニックジャンプ！", apply: () => { activeHappenings.panic = 220; } } // NEW
];

let peer, conn, isHost = false;
let sessionStages = [];
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let scores = { p1: 0, p2: 0 }, currentAttacker = "p1", mp = 0, frame = 0;
let bird = { x: 60, y: 240, v: 0, rot: 0 }, pipes = [], stars = [];
let activeSkills = {};
let activeHappenings = { lowG:0, turb:0, slow:0, speedUp:0, panic:0 };
let currentHand = [];
let lastStageIndex = 0;
let isGameOver = false;

function initPeer(host) {
    initAudio();
    const rid = document.getElementById('room-id').value.trim().toLowerCase();
    if(!rid) return alert("合言葉を入力してください");
    isHost = host;
    const status = document.getElementById('peer-status');
    status.innerText = isHost ? "マッチング待機中..." : "接続中...";

    peer = new Peer(isHost ? rid : rid + "_gst" + Math.floor(Math.random()*999));
    peer.on('open', () => { if(!isHost) { conn = peer.connect(rid); setupConn(); } });
    peer.on('connection', c => { conn = c; setupConn(); });
    peer.on('error', () => status.innerText = "エラー: 合言葉を確認してください");
}

function setupConn() {
    conn.on('open', () => {
        if(isHost) {
            const pool = STAGES.filter(s => s.name !== "NORMAL" && s.name !== "METEOR");
            const shuffled = pool.sort(() => 0.5 - Math.random()).slice(0, 3);
            sessionStages = [STAGES[0], ...shuffled, STAGES[STAGES.length-1]];
            conn.send({ type: "init", stages: sessionStages });
        }
        document.getElementById('setup-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        for(let i=0; i<40; i++) stars.push({x:Math.random()*320, y:Math.random()*480, s:Math.random()*2});
        setupDeck();
        startTurn();
        requestAnimationFrame(gameLoop);
    });
    conn.on('data', data => {
        if(data.type === "init") sessionStages = data.stages;
        if(data.type === "sync" && !isAttacker()) {
            bird.y = data.birdY; bird.rot = data.birdRot;
            pipes = data.pipes; scores = data.scores; frame = data.frame;
            activeSkills = data.skills; activeHappenings = data.happenings;
        }
        if(data.type === "skill") {
            activeSkills[data.skill] = data.dur || 300;
            playSE('skill');
        }
        if(data.type === "roulette") triggerRouletteVisual(data.index);
        if(data.type === "die") { playSE('die'); switchTurn(); }
    });
}

function isAttacker() { return (isHost && currentAttacker === "p1") || (!isHost && currentAttacker === "p2"); }

function setupDeck() {
    const keys = Object.keys(ALL_SKILLS);
    currentHand = [];
    while(currentHand.length < 4) {
        const rand = keys[Math.floor(Math.random() * keys.length)];
        if(!currentHand.includes(rand)) currentHand.push(rand);
    }
}

function useHandSlot(slotIdx) {
    if(isAttacker()) return;
    const skillKey = currentHand[slotIdx];
    const skill = ALL_SKILLS[skillKey];
    if(mp < skill.cost || (activeSkills[skillKey] && activeSkills[skillKey] > 0)) return;

    mp -= skill.cost;
    activeSkills[skillKey] = skill.dur;
    playSE('skill');
    conn.send({ type: "skill", skill: skillKey, dur: skill.dur });
}

function rerollHand() {
    if(isAttacker() || mp < 15) return;
    mp -= 15;
    playSE('skill');
    setupDeck();
}

function startTurn() {
    bird.y = 240; bird.v = 0; pipes = []; frame = 0;
    activeSkills = {};
    activeHappenings = { lowG:0, turb:0, slow:0, speedUp:0, panic:0 };
    lastStageIndex = 0;
    if(!isAttacker()) setupDeck();
    showStatus(isAttacker() ? "YOUR TURN" : "SABOTAGE", isAttacker() ? "#2ecc71" : "#e74c3c");
}

function getStage() {
    const s = scores[currentAttacker];
    return sessionStages[Math.min(Math.floor(s / 20), 4)] || STAGES[0];
}

function checkStageProgress() {
    const s = scores[currentAttacker];
    const stageIdx = Math.min(Math.floor(s / 20), 4);
    if(stageIdx > lastStageIndex) {
        lastStageIndex = stageIdx;
        const rIndex = Math.floor(Math.random() * HAPPENINGS.length);
        triggerRouletteVisual(rIndex);
        if(isAttacker()) {
            conn.send({ type: "roulette", index: rIndex });
            HAPPENINGS[rIndex].apply();
        }
    }
}

function triggerRouletteVisual(finalIndex) {
    const msg = document.getElementById('roulette-msg');
    msg.style.display = 'block';
    setTimeout(() => {
        msg.innerText = HAPPENINGS[finalIndex].name;
        setTimeout(() => { msg.style.display = 'none'; }, 2000);
    }, 500);
}

function update(dt) {
    const fpsAdj = dt * 60; 
    const stage = getStage();

    document.getElementById('s1').innerText = scores.p1;
    document.getElementById('s2').innerText = scores.p2;
    document.getElementById('stage-display').innerText = stage.name;

    if (!isAttacker()) {
        if (mp < 100) mp += 4.8 * dt; 
        if (mp > 100) mp = 100;
        document.getElementById('mp-bar').style.width = mp + "%";

        currentHand.forEach((key, idx) => {
            const btn = document.getElementById(`slot-${idx}`);
            const sk = ALL_SKILLS[key];
            btn.innerHTML = `${sk.name}<br>(${sk.cost})`;
            if (mp < sk.cost) btn.classList.add('disabled');
            else btn.classList.remove('disabled');
            if (activeSkills[key] > 0) btn.classList.add('active-skill');
            else btn.classList.remove('active-skill');
        });

        const rerollBtn = document.getElementById('reroll-btn');
        if (mp < 15) rerollBtn.classList.add('disabled');
        else rerollBtn.classList.remove('disabled');

        Object.keys(activeSkills).forEach(k => {
            if (activeSkills[k] > 0) activeSkills[k] -= 60 * dt; 
        });
        return;
    }

    frame++;
    checkStageProgress();

    // ハプニング：パニックジャンプ
    if (activeHappenings.panic > 0 && frame % 45 === 0) {
        bird.v = (activeSkills.highJump > 0 ? stage.j * 1.4 : stage.j) * (activeSkills.rev > 0 ? -1 : 1);
        playSE('flap');
    }

    let g = stage.g;
    if (activeSkills.gravUp > 0) g *= 2.0;
    if (activeSkills.impact > 0) g *= 2.0;
    if (activeSkills.rev > 0) g *= -1;
    if (activeHappenings.lowG > 0) g *= 0.5;
    if (activeSkills.ascend > 0) g = Math.abs(g) * -0.35;

    bird.v += g * fpsAdj; 
    if (activeHappenings.turb > 0) bird.v += (Math.random() - 0.5) * 1.5;

    // 磁石スキル
    if (activeSkills.magnet > 0) {
        let targetPipe = pipes.find(p => p.x + 52 > bird.x);
        if (targetPipe) {
            let gapCenter = targetPipe.currentGapY + (130 * stage.gap) / 2;
            bird.v += (gapCenter - bird.y) * 0.05 * fpsAdj;
        }
    }

    bird.y += bird.v * fpsAdj;
    bird.rot = Math.max(-0.5, Math.min(0.5, bird.v * 0.1));

    if (frame % stage.interval === 0) {
        pipes.push({ x: 330, gapY: Math.random() * 200 + 100, passed: false, off: Math.random() * 10, isFake: false });
    }
    if (activeSkills.fake > 0 && (frame + Math.floor(stage.interval / 5)) % stage.interval === 0) {
        pipes.push({ x: 330, gapY: Math.random() * 200 + 100, passed: false, off: Math.random() * 10, isFake: true });
    }

    let baseSpd = stage.speed * (activeSkills.speed > 0 ? 2.5 : 1.5) * 2;
    if (activeHappenings.slow > 0) baseSpd *= 0.6;
    if (activeHappenings.speedUp > 0) baseSpd *= 1.4;
    let moveSpd = activeSkills.back > 0 ? -baseSpd : baseSpd; 

    pipes.forEach(p => {
        p.x -= moveSpd * fpsAdj;
        let myGapY = p.gapY + (stage.move || activeSkills.move > 0 ? Math.sin(frame * 0.05 + p.off) * 45 : 0);
        p.currentGapY = myGapY;

        // 【透明（ゴースト）でも当たり判定は残す仕様に変更】
        if (!p.isFake) {
            let hitRadius = activeSkills.giant > 0 ? 20 : 11;
            if (bird.x + hitRadius > p.x && bird.x - hitRadius < p.x + 52) {
                if (bird.y - hitRadius < myGapY || bird.y + hitRadius > myGapY + 130 * stage.gap) {
                    die();
                }
            }
        }
        
        if (moveSpd > 0 && !p.isFake && !p.passed && p.x < bird.x) { 
            p.passed = true; 
            scores[currentAttacker]++; 
        }
    });

    if (pipes.length > 0 && pipes[0].x < -100) pipes.shift();
    if (bird.y < 0 || bird.y > 480) die();

    Object.keys(activeSkills).forEach(k => {
        if (activeSkills[k] > 0) {
            let decay = (k === 'impact') ? 270 : 1;
            activeSkills[k] -= decay * dt; 
            if (activeSkills[k] < 0) activeSkills[k] = 0;
        }
    });
    Object.keys(activeHappenings).forEach(k => {
        if (activeHappenings[k] > 0) activeHappenings[k] -= 60 * dt;
    });
}

function die() { 
    playSE('die');
    conn.send({ type: "die" }); 
    switchTurn(); 
}

function switchTurn() {
    if(currentAttacker === "p1") { currentAttacker = "p2"; startTurn(); }
    else { checkWinner(); }
}

function checkWinner() {
    if((scores.p1 >= 100 || scores.p2 >= 100) && scores.p1 !== scores.p2) {
        isGameOver = true;
        playSE('win');
        showStatus(scores.p1 > scores.p2 ? "1P WIN!" : "2P WIN!", "#f8e71c");
    } else {
        currentAttacker = "p1"; startTurn();
    }
}

function drawBird(ctx, bird) { 
    ctx.save(); ctx.translate(bird.x, bird.y); ctx.rotate(bird.rot); 
    const wPos = Math.sin(frame * 0.4) * 7; 
    ctx.fillStyle = "#f8e71c"; ctx.strokeStyle = "#000"; ctx.lineWidth = 2; 
    ctx.beginPath(); ctx.ellipse(0, 0, 16, 13, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); 
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.ellipse(-8, wPos, 8, 5, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); 
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(8, -5, 5, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); 
    ctx.fillStyle = "#000"; ctx.beginPath(); ctx.arc(10, -5, 2, 0, Math.PI * 2); ctx.fill(); 
    ctx.fillStyle = "#f15a24"; ctx.beginPath(); ctx.moveTo(12, 0); ctx.lineTo(22, 4); ctx.lineTo(12, 8); ctx.closePath(); ctx.fill(); ctx.stroke(); 
    ctx.restore(); 
} 

function drawPipe(x, y, isTop, stage, gap) { 
    const w = 52, capH = 26; 
    ctx.save(); 
    ctx.fillStyle = stage.pipe; ctx.strokeStyle = "#000"; ctx.lineWidth = 3; 
    const bodyY = isTop ? 0 : y + gap + capH; 
    const bodyH = isTop ? y : 480 - (y + gap + capH); 
    ctx.fillRect(x, bodyY, w, bodyH); ctx.strokeRect(x, bodyY, w, bodyH); 
    ctx.fillStyle = "rgba(255,255,255,0.3)"; ctx.fillRect(x + 5, bodyY, 10, bodyH); 
    ctx.fillStyle = stage.pipe; 
    ctx.fillRect(x - 4, isTop ? y : y + gap, w + 8, capH); ctx.strokeRect(x - 4, isTop ? y : y + gap, w + 8, capH); 
    ctx.restore(); 
}

function drawBackground(stage) {
    // 地震スキル発動中の画面揺れオフセット計算
    let quakeX = 0, quakeY = 0;
    if (activeSkills.quake > 0) {
        quakeX = (Math.random() - 0.5) * 8;
        quakeY = (Math.random() - 0.5) * 8;
    }

    ctx.save();
    ctx.translate(quakeX, quakeY);

    ctx.fillStyle = stage.bg; ctx.fillRect(0, 0, 320, 480);
    ctx.save();
    if(stage.name === "NORMAL") {
        ctx.fillStyle = "rgba(255,255,255,0.7)";
        for(let i=0; i<3; i++) {
            let cx = (60 + i*140 + frame*0.3) % 400 - 60;
            ctx.beginPath(); ctx.arc(cx, 100, 30, 0, 7); ctx.arc(cx+25, 85, 25, 0, 7); ctx.fill();
        }
    }
    if(/NIGHT|SPACE|METEOR/.test(stage.name)) {
        ctx.fillStyle = "#fff"; stars.forEach(s => ctx.fillRect(s.x, s.y, s.s, s.s));
    }
    if(stage.name === "CAVERN") {
        ctx.fillStyle = "#553311";
        for(let i=0; i<8; i++) { ctx.beginPath(); ctx.moveTo(i*40, 0); ctx.lineTo(i*40+20, 50); ctx.lineTo(i*40+40, 0); ctx.fill(); }
    }
    ctx.restore();
    ctx.restore();
}

function draw() {
    const stage = getStage();
    drawBackground(stage);
    
    pipes.forEach(p => {
        let myGapY = p.currentGapY !== undefined ? p.currentGapY : (p.gapY + (stage.move || activeSkills.move > 0 ? Math.sin(frame * 0.05 + p.off) * 45 : 0));
        ctx.save();
        if (p.isFake) ctx.globalAlpha = 0.9;
        else ctx.globalAlpha = 1.0;
        drawPipe(p.x, myGapY, true, stage, 130 * stage.gap);
        drawPipe(p.x, myGapY, false, stage, 130 * stage.gap);
        ctx.restore();
    });

    ctx.save();
    // 【透明スキルの強化】今よりもっと透明に（不透明度0.05）
    if (activeSkills.ghost > 0) {
        ctx.globalAlpha = 0.05;
    }
    if (activeSkills.ascend > 0) { ctx.shadowBlur = 15; ctx.shadowColor = "#fff"; }
    if (activeSkills.giant > 0) {
        ctx.translate(bird.x, bird.y);
        ctx.scale(1.75, 1.75);
        ctx.translate(-bird.x, -bird.y);
    }
    drawBird(ctx, bird);
    ctx.restore();
    
    if (activeSkills.blind > 0) {
        let g = ctx.createRadialGradient(bird.x, bird.y, 20, bird.x, bird.y, 90);
        g.addColorStop(0, "transparent"); g.addColorStop(1, "black");
        ctx.fillStyle = g; ctx.fillRect(0, 0, 320, 480);
    }

    if (activeSkills.flash > 0) {
        ctx.fillStyle = `rgba(255, 255, 255, ${Math.min(1, activeSkills.flash / 50)})`;
        ctx.fillRect(0, 0, 320, 480);
    }
}

let lastTime = 0;
function gameLoop(timestamp) {
    if (isGameOver) return;
    if (!lastTime) lastTime = timestamp;
    const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
    lastTime = timestamp;

    update(dt); 
    draw();

    if (isAttacker()) {
        conn.send({ 
            type: "sync", 
            birdY: bird.y, birdRot: bird.rot, 
            pipes, scores, frame, 
            skills: activeSkills, happenings: activeHappenings
        });
    }
    requestAnimationFrame(gameLoop);
}

const flap = (e) => {
    if (e && e.target && e.target.closest('#skill-panel')) return;
    if (isAttacker() && !isGameOver) { 
        const stage = getStage(); 
        bird.v = (activeSkills.highJump > 0 ? stage.j * 1.4 : stage.j) * (activeSkills.rev > 0 ? -1 : 1);
        playSE('flap');
    }
};
window.addEventListener('mousedown', flap);
window.addEventListener('touchstart', e => { flap(e); }, { passive: true });

function showStatus(t, c) { 
    const m = document.getElementById('status-msg'); 
    m.innerText = t; m.style.color = c; 
    setTimeout(() => { if(!isGameOver) m.innerText=""; }, 2000); 
}
</script>

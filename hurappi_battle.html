<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flappy Wizard: Definitive Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; touch-action: none; }
        #wrapper { position: relative; width: 320px; margin: 0 auto; }
        canvas { display: block; width: 320px; height: 480px; background: #70c5ce; border: 2px solid #333; }
        #ui { background: rgba(0,0,0,0.9); padding: 5px; display: flex; justify-content: space-around; font-size: 14px; border-bottom: 2px solid #444; }
        #skill-panel { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; background: #111; padding: 5px; width: 310px; margin: 0 auto; }
        .skill-btn { font-size: 10px; padding: 6px 0; background: #333; color: #ccc; border: 1px solid #555; border-radius: 3px; cursor: pointer; }
        #status-msg { position: absolute; top: 40%; width: 100%; text-align: center; font-size: 24px; font-weight: bold; text-shadow: 2px 2px #000; pointer-events: none; z-index: 10; }
        .setup { text-align: center; padding: 50px 20px; }
        #peer-status { font-size: 12px; color: #aaa; margin-top: 5px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="setup-screen" class="setup">
        <h1 style="color:#f8e71c; margin-bottom:0;">FLAPPY WIZARD</h1>
        <div id="peer-status">オフライン</div>
        <br>
        <input type="text" id="room-id" placeholder="合言葉を入れる" style="padding:10px; border-radius:5px; border:none;"><br><br>
        <button onclick="initPeer(true)" style="padding:10px 20px; background:#e67e22; border:none; color:#fff; font-weight:bold; border-radius:5px;">1P作成 (Host)</button>
        <button onclick="initPeer(false)" style="padding:10px 20px; background:#2ecc71; border:none; color:#fff; font-weight:bold; border-radius:5px;">2P参加 (Guest)</button>
    </div>

    <div id="game-screen" class="hidden">
        <div id="ui">
            <div>1P: <span id="s1">0</span></div>
            <div id="stage-display" style="color:#f8e71c; font-weight:bold;">NORMAL</div>
            <div>2P: <span id="s2">0</span></div>
        </div>
        <div id="wrapper">
            <canvas id="gameCanvas" width="320" height="480"></canvas>
            <div id="status-msg"></div>
        </div>
        <div style="background:#222; height:8px; width:320px; margin:0 auto;"><div id="mp-bar" style="height:100%; width:0%; background:#00d4ff;"></div></div>
        <div id="skill-panel">
            <button class="skill-btn" onclick="useSkill('speed', 25)">高速(25)</button>
            <button class="skill-btn" onclick="useSkill('move', 30)">揺れ(30)</button>
            <button class="skill-btn" onclick="useSkill('blind', 50)">暗闇(50)</button>
            <button class="skill-btn" onclick="useSkill('rev', 65)">反転(65)</button>
            <button class="skill-btn" onclick="useSkill('ghost', 30)">透明(45)</button>
            <button class="skill-btn" onclick="useSkill('fake', 25)">分身(35)</button>
            <button class="skill-btn" onclick="useSkill('gravUp', 25)">重力+(30)</button>
            <button class="skill-btn" onclick="useSkill('highJump', 30)">強跳(30)</button>
            <button class="skill-btn" onclick="useSkill('giant', 35)">巨大化(50)</button>
<button class="skill-btn" onclick="useSkill('back', 55)">足止め(55)</button>
<button class="skill-btn" onclick="useSkill('impact', 20)">衝撃(20)</button>
<button class="skill-btn" onclick="useSkill('ascend', 100)">昇天(100)</button>
        </div>
    </div>

<script>
// --- 定数・ステージ定義 ---
const STAGES = [
    { name: "NORMAL", bg: "#70c5ce", pipe: "#73bf2e", interval: 105, speed: 1.0, gap: 1.0, g:0.28, j:-5.2 },
    { name: "DUSK", bg: "#e67e22", pipe: "#a35200", interval: 100, speed: 1.1, gap: 1.0, g:0.28, j:-5.2 },
    { name: "NIGHT", bg: "#2c3e50", pipe: "#576574", interval: 105, speed: 1.0, gap: 1.05, g:0.28, j:-5.2, move:true },
    { name: "CAVERN", bg: "#4d4d4d", pipe: "#808080", interval: 105, speed: 1.0, gap: 0.95, g:0.28, j:-5.2 },
    { name: "DESERT", bg: "#d4a70f", pipe: "#e6c28d", interval: 105, speed: 1.0, gap: 1.0, g:0.32, j:-5.2 },
    { name: "OCEAN", bg: "#2980b9", pipe: "#16a085", interval: 80, speed: 0.9, gap: 1.15, g:0.14, j:-2.5 },
    { name: "CYBER", bg: "#8e44ad", pipe: "#c39bd3", interval: 100, speed: 1.2, gap: 1.3, g:0.26, j:-5.2, move:true },
    { name: "FOREST", bg: "#27ae60", pipe: "#1e8449", interval: 90, speed: 1.1, gap: 0.85, g:0.28, j:-5.2 },
    { name: "MANSION", bg: "#cece78", pipe: "#773477", interval: 65, speed: 0.8, gap: 1.1, g:0.28, j:-5.2, move:true },
    { name: "SNOWY", bg: "#8888aa", pipe: "#bdc3c7", interval: 75, speed: 1.3, gap: 0.85, g:0.28, j:-5.2 },
    { name: "MAGMA", bg: "#c0392b", pipe: "#e74c3c", interval: 120, speed: 1.8, gap: 0.8, g:0.28, j:-5.2 },
    { name: "SPACE", bg: "#000000", pipe: "#34495e", interval: 95, speed: 1.5, gap: 0.9, g:-0.28, j:5.2 },
    { name: "METEOR", bg: "#000000", pipe: "#73bf2e", interval: 95, speed: 1.3, gap: 0.85, g:0.28, j:-5.2, move:true }
];

// --- グローバル変数 ---
let peer, conn, isHost = false;
let sessionStages = [];
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let scores = { p1: 0, p2: 0 }, currentAttacker = "p1", mp = 0, frame = 0;
let bird = { x: 60, y: 240, v: 0, rot: 0 }, pipes = [], stars = [];
let activeSkills = { speed:0, move:0, blind:0, rev:0, ghost:0, fake:0, gravUp:0, highJump:0 };
let isGameOver = false;

// --- 通信・初期化 ---
function initPeer(host) {
    const rid = document.getElementById('room-id').value.trim().toLowerCase();
    if(!rid) return alert("合言葉を入力してください");
    isHost = host;
    const status = document.getElementById('peer-status');
    status.innerText = isHost ? "マッチング待機中..." : "接続中...";

    peer = new Peer(isHost ? rid : rid + "_gst" + Math.floor(Math.random()*999));
    
    peer.on('open', () => { if(!isHost) { conn = peer.connect(rid); setupConn(); } });
    peer.on('connection', c => { conn = c; setupConn(); });
    peer.on('error', () => status.innerText = "エラー: 合言葉を確認してください");
}

function setupConn() {
    conn.on('open', () => {
        if(isHost) {
            const pool = STAGES.filter(s => s.name !== "NORMAL" && s.name !== "METEOR");
            const shuffled = pool.sort(() => 0.5 - Math.random()).slice(0, 3);
            sessionStages = [STAGES[0], ...shuffled, STAGES[STAGES.length-1]];
            conn.send({ type: "init", stages: sessionStages });
        }
        document.getElementById('setup-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        for(let i=0; i<40; i++) stars.push({x:Math.random()*320, y:Math.random()*480, s:Math.random()*2});
        startTurn();
        requestAnimationFrame(gameLoop);
    });
    conn.on('data', data => {
        if(data.type === "init") sessionStages = data.stages;
        if(data.type === "sync" && !isAttacker()) {
            bird.y = data.birdY; bird.rot = data.birdRot;
            pipes = data.pipes; scores = data.scores; frame = data.frame; activeSkills = data.skills;
        }
        if(data.type === "skill") activeSkills[data.skill] = 300;
        if(data.type === "die") switchTurn();
    });
}

function isAttacker() { return (isHost && currentAttacker === "p1") || (!isHost && currentAttacker === "p2"); }

function startTurn() {
    bird.y = 240; bird.v = 0; pipes = []; frame = 0;
    Object.keys(activeSkills).forEach(k => activeSkills[k] = 0);
    showStatus(isAttacker() ? "YOUR TURN" : "SABOTAGE", isAttacker() ? "#2ecc71" : "#e74c3c");
}

function getStage() {
    const s = scores[currentAttacker];
    return sessionStages[Math.min(Math.floor(s / 20), 4)] || STAGES[0];
}

// --- 更新ロジック ---

function update(dt) {
    const fpsAdj = dt * 60; 
    frame++; 
    const stage = getStage();

    document.getElementById('s1').innerText = scores.p1;
    document.getElementById('s2').innerText = scores.p2;
    document.getElementById('stage-display').innerText = stage.name;

    if (!isAttacker()) {
        if (mp < 100) mp += 4.8 * dt; 
        if (mp > 100) mp = 100;
        document.getElementById('mp-bar').style.width = mp + "%";
        Object.keys(activeSkills).forEach(k => {
            if (activeSkills[k] > 0) activeSkills[k] -= 60 * dt; 
        });
        return;
    }

    // --- 物理演算 (衝撃・昇天・重力対応) ---
    let g = stage.g;
    if (activeSkills.gravUp > 0) g *= 2.0;
    if (activeSkills.impact > 0) g *= 2.0; // 衝撃: 一瞬の超重力
    if (activeSkills.rev > 0) g *= -1;
    if (activeSkills.ascend > 0) g = Math.abs(g) * -0.35; // 昇天: 重力反転

    bird.v += g * fpsAdj; 
    bird.y += bird.v * fpsAdj;
    bird.rot = Math.max(-0.5, Math.min(0.5, bird.v * 0.1));

    // --- 土管生成ロジック (分身強化版) ---
    // 1. 本物の土管（通常の間隔で生成）
    if (frame % stage.interval === 0) {
        pipes.push({ 
            x: 330, gapY: Math.random() * 200 + 100, 
            passed: false, off: Math.random() * 10, isFake: false 
        });
    }
    // 2. 分身の土管（スキル発動中、本物の合間に生成）
    // 本物の生成間隔の半分（interval / 2）のタイミングでフェイクを差し込む
    if (activeSkills.fake > 0 && (frame + Math.floor(stage.interval / 5)) % stage.interval === 0) {
        pipes.push({ 
            x: 330, gapY: Math.random() * 200 + 100, 
            passed: false, off: Math.random() * 10, isFake: true 
        });
    }

    // --- 移動と衝突判定 (足止め・巨大化対応) ---
    let baseSpd = stage.speed * (activeSkills.speed > 0 ? 2.5 : 1.5) * 2;
    let moveSpd = activeSkills.back > 0 ? -baseSpd : baseSpd; 

    pipes.forEach(p => {
        p.x -= moveSpd * fpsAdj;
        let myGapY = p.gapY + (stage.move || activeSkills.move > 0 ? Math.sin(frame * 0.05 + p.off) * 45 : 0);
        
        // 衝突判定
        if (activeSkills.ghost <= 0 && !p.isFake) {
            let hitSize = activeSkills.giant > 0 ? 24 : 12; // 巨大化
            if (bird.x + hitSize > p.x && bird.x - hitSize < p.x + 52) {
                if (bird.y - (hitSize-2) < myGapY || bird.y + (hitSize-2) > myGapY + 130 * stage.gap) {
                    die();
                }
            }
        }
        
        // スコア加算（フェイク土管はカウントしない）
        if (moveSpd > 0 && !p.isFake && !p.passed && p.x < bird.x) { 
            p.passed = true; 
            scores[currentAttacker]++; 
        }
    });

    if (pipes.length > 0 && pipes[0].x < -100) pipes.shift();
    if (bird.y < 0 || bird.y > 480) die();

    // スキルタイマー減少
    Object.keys(activeSkills).forEach(k => {
        if (activeSkills[k] > 0) {
            let decay = (k === 'impact') ? 270 : 1; // 衝撃はすぐ終わる
            activeSkills[k] -= decay * dt; 
            if (activeSkills[k] < 0) activeSkills[k] = 0;
        }
    });
}

function die() { conn.send({ type: "die" }); switchTurn(); }

function switchTurn() {
    if(currentAttacker === "p1") { currentAttacker = "p2"; startTurn(); }
    else { checkWinner(); }
}

function checkWinner() {
    if((scores.p1 >= 100 || scores.p2 >= 100) && scores.p1 !== scores.p2) {
        isGameOver = true;
        showStatus(scores.p1 > scores.p2 ? "1P WIN!" : "2P WIN!", "#f8e71c");
    } else {
        currentAttacker = "p1"; startTurn();
    }
}

// --- 描画 (統合版) ---
function drawBird(ctx, bird) { 
    ctx.save(); ctx.translate(bird.x, bird.y); ctx.rotate(bird.rot); 
    const wPos = Math.sin(frame * 0.4) * 7; 
    ctx.fillStyle = "#f8e71c"; ctx.strokeStyle = "#000"; ctx.lineWidth = 2; 
    ctx.beginPath(); ctx.ellipse(0, 0, 16, 13, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); 
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.ellipse(-8, wPos, 8, 5, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); 
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(8, -5, 5, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); 
    ctx.fillStyle = "#000"; ctx.beginPath(); ctx.arc(10, -5, 2, 0, Math.PI * 2); ctx.fill(); 
    ctx.fillStyle = "#f15a24"; ctx.beginPath(); ctx.moveTo(12, 0); ctx.lineTo(22, 4); ctx.lineTo(12, 8); ctx.closePath(); ctx.fill(); ctx.stroke(); 
    ctx.restore(); 
} 

function drawPipe(x, y, isTop, stage, gap) { 
    const w = 52, capH = 26; 
    ctx.save(); 
    ctx.fillStyle = stage.pipe; ctx.strokeStyle = "#000"; ctx.lineWidth = 3; 
    const bodyY = isTop ? 0 : y + gap + capH; 
    const bodyH = isTop ? y : 480 - (y + gap + capH); 
    ctx.fillRect(x, bodyY, w, bodyH); ctx.strokeRect(x, bodyY, w, bodyH); 
    ctx.fillStyle = "rgba(255,255,255,0.3)"; ctx.fillRect(x + 5, bodyY, 10, bodyH); 
    ctx.fillStyle = stage.pipe; 
    ctx.fillRect(x - 4, isTop ? y : y + gap, w + 8, capH); ctx.strokeRect(x - 4, isTop ? y : y + gap, w + 8, capH); 
    ctx.restore(); 
}

function drawBackground(stage) {
    ctx.fillStyle = stage.bg; ctx.fillRect(0, 0, 320, 480);
    ctx.save();
    if(stage.name === "NORMAL") {
        ctx.fillStyle = "rgba(255,255,255,0.7)";
        for(let i=0; i<3; i++) {
            let cx = (60 + i*140 + frame*0.3) % 400 - 60;
            ctx.beginPath(); ctx.arc(cx, 100, 30, 0, 7); ctx.arc(cx+25, 85, 25, 0, 7); ctx.fill();
        }
    }
    if(/NIGHT|SPACE|METEOR/.test(stage.name)) {
        ctx.fillStyle = "#fff"; stars.forEach(s => ctx.fillRect(s.x, s.y, s.s, s.s));
    }
    if(stage.name === "CAVERN") {
        ctx.fillStyle = "#553311";
        for(let i=0; i<8; i++) { ctx.beginPath(); ctx.moveTo(i*40, 0); ctx.lineTo(i*40+20, 50); ctx.lineTo(i*40+40, 0); ctx.fill(); }
    }
    ctx.restore();
}

function draw() {
    const stage = getStage();
    drawBackground(stage);
    
    pipes.forEach(p => {
        let myGapY = p.gapY + (stage.move || activeSkills.move > 0 ? Math.sin(frame * 0.05 + p.off) * 45 : 0);
        ctx.save();
        if (activeSkills.ghost > 0) {
            ctx.globalAlpha = 0.02; 
        } else if (p.isFake) {
            ctx.globalAlpha = 0.9;
        } else {
            ctx.globalAlpha = 1.0;
        }
        drawPipe(p.x, myGapY, true, stage, 130 * stage.gap);
        drawPipe(p.x, myGapY, false, stage, 130 * stage.gap);
        ctx.restore();
    });

    // --- プレイヤーの描画修正 ---
    ctx.save();
    // 昇天(ascend)中は少し青白く、巨大化(giant)中は1.5倍に
    if (activeSkills.ascend > 0) {
        ctx.shadowBlur = 15;
        ctx.shadowColor = "#fff";
    }
    if (activeSkills.giant > 0) {
        // birdの座標を中心に拡大するために一旦translate
        ctx.translate(bird.x, bird.y);
        ctx.scale(1.75, 1.75);
        ctx.translate(-bird.x, -bird.y);
    }
    drawBird(ctx, bird);
    ctx.restore();
    
    // 暗闇(Blind)
    if (activeSkills.blind > 0) {
        let g = ctx.createRadialGradient(bird.x, bird.y, 20, bird.x, bird.y, 90);
        g.addColorStop(0, "transparent"); g.addColorStop(1, "black");
        ctx.fillStyle = g; ctx.fillRect(0, 0, 320, 480);
    }
}

let lastTime = 0; // 前回のフレーム時間を保持

function gameLoop(timestamp) {
    if (isGameOver) return;

    // 最初のフレームでは lastTime が 0 なので調整
    if (!lastTime) lastTime = timestamp;

    // 前回の実行からの経過時間（秒単位）を計算
    const dt = (timestamp - lastTime) / 1000; 
    lastTime = timestamp;

    // ブラウザのタブが裏に回った時などに dt が巨大化するのを防ぐガード（最大0.1秒）
    const limitedDt = Math.min(dt, 0.1);

    update(limitedDt); 
    draw();

    // ホスト側（アタッカー側）がデータを同期
    if (isAttacker()) {
        conn.send({ 
            type: "sync", 
            birdY: bird.y, 
            birdRot: bird.rot, 
            pipes, 
            scores, 
            frame, 
            skills: activeSkills 
        });
    }
    requestAnimationFrame(gameLoop);
}

// --- 操作・UI ---
function useSkill(s, c) { if(!isAttacker() && mp >= c) { mp -= c; conn.send({ type: "skill", skill: s }); activeSkills[s]=300; } }
const flap = () => { if(isAttacker() && !isGameOver) { const stage = getStage(); bird.v = (activeSkills.highJump>0 ? stage.j*1.4 : stage.j) * (activeSkills.rev>0?-1:1); } };
window.addEventListener('mousedown', flap);
window.addEventListener('touchstart', e => { e.preventDefault(); flap(); });
function showStatus(t, c) { const m = document.getElementById('status-msg'); m.innerText = t; m.style.color = c; setTimeout(() => { if(!isGameOver) m.innerText=""; }, 2000); }

</script>
</body>
</html>
